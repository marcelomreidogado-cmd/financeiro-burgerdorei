<style>

  --bg:#0c0e14;--s1:#131620;--s2:#1a1f2e;--s3:#222840;
  --bd:#252b3b;--bd2:#2e3650;
  --acc:#f97316;--acc2:#fb923c;--acc3:rgba(249,115,22,.12);
  --ok:#22c55e;--ok2:rgba(34,197,94,.12);

  --wa:#eab308;--wa2:rgba(234,179,8,.12);
  --in:#3b82f6;--in2:rgba(59,130,246,.12);
  --pu:#a855f7;--pu2:rgba(168,85,247,.12);
  --tx:#e2e8f0;--tx2:#7d8ba8;--tx3:#3f4a63;
  --r:10px;--sw:218px;--hh:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
#app{display:flex;height:100vh}

/* SIDEBAR */
#sb{width:var(--sw);min-width:var(--sw);background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:width .22s ease;z-index:20;overflow:hidden}
#sb.col{width:52px;min-width:52px}
.sb-logo{height:var(--hh);display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-ico{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#c2410c);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;letter-spacing:-1px}
.sb-nm{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;white-space:nowrap;transition:opacity .15s}
#sb.col .sb-nm{opacity:0;pointer-events:none}
#sb.col #sb-logo-img{height:28px}
.sb-sec{padding:10px 8px 3px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;white-space:nowrap;overflow:hidden;flex-shrink:0;transition:opacity .15s}
#sb.col .sb-sec{opacity:0}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:1px 5px;border-radius:8px;cursor:pointer;transition:background .12s;white-space:nowrap;overflow:hidden;flex-shrink:0}
.ni:hover{background:var(--s2)}.ni.act{background:var(--acc3);color:var(--acc)}
.ni .ic{font-size:14px;flex-shrink:0;width:20px;text-align:center}
.ni .lb{font-size:13px;font-weight:500;transition:opacity .15s;overflow:hidden;text-overflow:ellipsis}
#sb.col .lb{opacity:0;pointer-events:none}
.sb-tog{margin-top:auto;height:42px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--bd);cursor:pointer;color:var(--tx2);font-size:15px;transition:color .12s;flex-shrink:0}
.sb-tog:hover{color:var(--acc)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:var(--hh);min-height:var(--hh);background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0}
#topbar h1{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;flex:1}
.chip{background:var(--s2);border:1px solid var(--bd);padding:3px 9px;border-radius:20px;font-size:11px;color:var(--tx2);font-family:'DM Mono',monospace}

/* MONTH TABS */
#month-nav{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 18px;display:none;flex-shrink:0;overflow-x:auto}
#month-nav.show{display:flex;align-items:center;gap:2px}
.yr-group{display:flex;align-items:center;gap:2px;flex-shrink:0;padding:6px 0}
.yr-lbl{font-size:11px;font-weight:600;color:var(--tx3);padding:0 6px;flex-shrink:0}
.m-tab{padding:4px 10px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;color:var(--tx2);transition:all .12s;flex-shrink:0;border:1px solid transparent}
.m-tab:hover{color:var(--tx);background:var(--s2)}
.m-tab.act{background:var(--acc3);color:var(--acc);border-color:rgba(249,115,22,.3)}
.m-tab.all{background:var(--s2);color:var(--tx2)}
.m-tab.all.act{background:var(--acc3);color:var(--acc)}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:16px 18px}

/* KPIS */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--acc))}
.kpi-l{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--tx2);text-transform:uppercase;margin-bottom:4px}
.kpi-v{font-family:'Syne',sans-serif;font-weight:700;font-size:19px}
.kpi-s{font-size:11px;color:var(--tx3);margin-top:2px}

/* TOOLBAR */
.tb{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:9px 11px;display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.sw-wrap{position:relative;flex:1;min-width:140px}
.sw-wrap input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:7px 9px 7px 29px;color:var(--tx);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.sw-wrap input:focus{border-color:var(--acc)}
.sw-wrap .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:13px}
select.fc,input.fc{background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;color:var(--tx);font-size:13px;outline:none;font-family:inherit;cursor:pointer;transition:border-color .15s}
select.fc:focus,input.fc:focus{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;border:none;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .12s;white-space:nowrap}
.bp{background:var(--acc);color:#fff}.bp:hover{background:var(--acc2)}
.bs{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}.bs:hover{border-color:var(--acc);color:var(--acc)}
.bd2{background:var(--er2);color:var(--er);border:1px solid rgba(239,68,68,.2)}.bd2:hover{background:rgba(239,68,68,.25)}
.bpu{background:var(--pu2);color:var(--pu);border:1px solid rgba(168,85,247,.2)}
.btn-s{padding:5px 9px;font-size:12px}.btn-i{padding:5px;width:28px;height:28px;justify-content:center}

/* TABLE */
.tw{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:auto;max-height:min(68vh, calc(100vh - 285px));overscroll-behavior:contain}
.tw table{width:100%;border-collapse:collapse}
.tw thead tr{background:var(--s2);border-bottom:1px solid var(--bd)}
.tw th{padding:8px 11px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--tx2);text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:4;background:var(--s2);box-shadow:0 1px 0 var(--bd)}
.tw th:hover{color:var(--tx)}.tw th.srt{color:var(--acc)}
.tw td{padding:8px 11px;border-bottom:1px solid var(--bd);border-right:1px solid rgba(255,255,255,.035);font-size:13px;vertical-align:middle}
.tw tr:last-child td{border-bottom:none}
.tw tbody tr:hover{background:rgba(255,255,255,.022)}
.tw tbody tr.sel{background:rgba(249,115,22,.1);outline:1px solid rgba(249,115,22,.35);outline-offset:-1px}
.tw tbody tr.sel:hover{background:rgba(249,115,22,.14)}
.tw tbody tr.sel td{color:var(--tx)}
.vencido-item:hover{background:rgba(239,68,68,.08)!important}
.pend-item:hover{background:rgba(249,115,22,.06)!important}
.tr{text-align:right}.tc{text-align:center}
.mono{font-family:'DM Mono',monospace}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* BADGES */
.bg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bgreen{background:var(--ok2);color:var(--ok)}.bred{background:var(--er2);color:var(--er)}
.byel{background:var(--wa2);color:var(--wa)}.bblue{background:var(--in2);color:var(--in)}
.bgray{background:var(--s2);color:var(--tx2)}.borange{background:var(--acc3);color:var(--acc)}
.bpu2{background:var(--pu2);color:var(--pu)}

.vin{color:var(--ok);font-family:'DM Mono',monospace}
.vout{color:var(--er);font-family:'DM Mono',monospace}

/* MODAL */
.mb{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mb.op{display:flex;animation:fi .15s ease}
@keyframes fi{from{opacity:0}}
.mo{background:var(--s1);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:580px;max-height:92vh;display:flex;flex-direction:column;animation:su .18s ease}
.mo-lg{max-width:720px}
@keyframes su{from{transform:translateY(16px);opacity:0}}
.mh{padding:15px 17px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:9px}
.mt{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;flex:1}
.mbody{padding:17px;overflow-y:auto;flex:1}
.mf{padding:11px 17px;border-top:1px solid var(--bd);display:flex;gap:7px;justify-content:flex-end}

/* FORM */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fgi{display:flex;flex-direction:column;gap:4px}
.fgi.full{grid-column:1/-1}
.fl{font-size:11px;font-weight:600;color:var(--tx2);letter-spacing:.04em}
.fl .rq{color:var(--acc)}
.fv{background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;color:var(--tx);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.fv:focus{border-color:var(--acc)}
.fv::placeholder{color:var(--tx3)}
select.fv option{background:var(--s1)}
.fv-hint{font-size:11px;color:var(--tx3);margin-top:2px}

/* CONFIRM */
#cfbg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center}
#cfbg.op{display:flex}
#cfbox{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:22px 20px;max-width:320px;width:90%;text-align:center}
#cfbox h3{font-family:'Syne',sans-serif;font-size:14px;margin-bottom:7px}
#cfbox p{color:var(--tx2);font-size:12px;margin-bottom:16px}
.cfb{display:flex;gap:8px;justify-content:center}

/* TOAST */
#ta{position:fixed;bottom:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:6px}
.tos{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:10px 13px;display:flex;align-items:center;gap:8px;font-size:13px;min-width:210px;max-width:290px;animation:ti .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tos.rem{animation:to .2s ease forwards}
@keyframes ti{from{transform:translateX(14px);opacity:0}}

.tos-ok{border-left:3px solid var(--ok)}.tos-er{border-left:3px solid var(--er)}.tos-in{border-left:3px solid var(--in)}

/* CHARTS */
.bi-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.bi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.bi-grid.g3{grid-template-columns:1fr 1fr 1fr}
.bi-card.full{grid-column:1/-1}
.sh{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.sh span{color:var(--tx2);font-size:11px;font-weight:400;font-family:'DM Sans',sans-serif}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.bar-lbl{font-size:11px;width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-wrap{flex:1;height:13px;background:var(--s2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s}
.bar-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx2);width:88px;text-align:right;flex-shrink:0}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.chart-area{height:120px;display:flex;align-items:flex-end;gap:2px;position:relative}
.chart-b{border-radius:3px 3px 0 0;opacity:.85;cursor:default;min-width:7px;transition:opacity .15s}
.chart-b:hover{opacity:1}

/* DRE */
.dre-t{width:100%;border-collapse:collapse;font-size:12px}
.dre-t td,.dre-t th{padding:5px 10px;border-bottom:1px solid var(--bd)}
.dre-t thead th{background:var(--s2);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx2);text-align:right;white-space:nowrap}

.dre-t td:first-child{position:sticky;left:0;background:var(--s1);z-index:1}
.dre-cat td{font-weight:600;color:var(--tx);background:var(--s2)}
.dre-cat td:first-child{background:var(--s2)}
.dre-sub td{color:var(--tx2);padding-left:22px;font-size:11px}
.dre-sub td:first-child{background:var(--s1)}
.dre-tot{font-weight:700}
.dre-tot td{background:rgba(249,115,22,.06);color:var(--acc);border-top:2px solid var(--bd2)}
.dre-tot td:first-child{background:rgba(249,115,22,.06)}

.dv{text-align:right;font-family:'DM Mono',monospace}
.dp{color:var(--ok)}.dn{color:var(--er)}.dc{color:var(--tx2);font-size:11px}

/* VISÃO GERAL */

/* AGENDA FINANCEIRA */
.ag-shell{display:flex;flex-direction:column;gap:12px}
.ag-top{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.ag-title{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:19px;text-transform:capitalize}
.ag-navbtn{width:34px;height:34px;border-radius:9px;background:var(--s2);border:1px solid rgba(249,115,22,.35);color:var(--acc);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.ag-navbtn:hover{background:var(--acc3);border-color:var(--acc)}
.ag-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ag-cal{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px;overflow:hidden}
.ag-week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px}
.ag-dow{text-align:center;color:var(--tx2);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.ag-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.ag-day{min-height:118px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.012));border:1px solid var(--bd);border-radius:12px;padding:9px;position:relative;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ag-day:hover{border-color:rgba(249,115,22,.55);transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.22)}
.ag-day.empty{background:transparent;border-color:transparent;cursor:default;box-shadow:none;transform:none}
.ag-day.today{border-color:var(--acc);box-shadow:0 0 0 1px rgba(249,115,22,.35) inset}
.ag-day.has{background:rgba(249,115,22,.055)}
.ag-day.mix{background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(239,68,68,.08))}
.ag-day.rec{background:rgba(34,197,94,.07)}
.ag-day.pag{background:rgba(239,68,68,.07)}
.ag-day.done{opacity:.74;background:rgba(34,197,94,.045)}
.ag-num{font-family:'DM Mono',monospace;font-size:13px;font-weight:800;color:var(--tx2);display:flex;align-items:center;justify-content:space-between;gap:5px}
.ag-check{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#06130b;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.ag-total{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ag-total.pos{color:var(--ok)}.ag-total.neg{color:var(--er)}.ag-total.zero{color:var(--tx3)}
.ag-lines{display:flex;flex-direction:column;gap:3px;margin-top:auto}
.ag-line{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:10.5px;color:var(--tx2);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.04);border-radius:6px;padding:3px 5px}
.ag-line strong{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--tx)}
.ag-pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:800}
.ag-pill.rec{background:var(--ok2);color:var(--ok)}.ag-pill.pag{background:var(--er2);color:var(--er)}.ag-pill.open{background:var(--wa2);color:var(--wa)}.ag-pill.done{background:var(--ok2);color:var(--ok)}
.ag-list{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.ag-list-head{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ag-item{display:grid;grid-template-columns:92px 1fr 115px 84px 98px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}
.ag-item:last-child{border-bottom:none}
.ag-item:hover{background:rgba(255,255,255,.022)}
.ag-item-title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-item-sub{font-size:11px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-muted{color:var(--tx3);font-size:11px}
.ag-day-detail{display:flex;flex-direction:column;gap:8px}
.ag-detail-row{display:grid;grid-template-columns:1fr 105px 86px 92px;gap:8px;align-items:center;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:9px}
@media(max-width:980px){.ag-week,.ag-grid{gap:5px}.ag-day{min-height:100px;padding:7px}.ag-total{font-size:13px}.ag-item{grid-template-columns:82px 1fr 100px;}.ag-item .hide-sm{display:none}}
@media(max-width:768px){.ag-week,.ag-grid{grid-template-columns:repeat(2,1fr)}.ag-dow{display:none}.ag-day.empty{display:none}.ag-top{align-items:stretch}.ag-actions{width:100%}.ag-actions .btn{flex:1;justify-content:center}.ag-detail-row{grid-template-columns:1fr}.ag-item{grid-template-columns:1fr}.ag-item .hide-sm{display:block}}
/* Ajuste visual forte da Agenda Financeira: números menores e leitura limpa */
.ag-shell .kpi{padding:11px 12px!important;min-width:0}
.ag-shell .kpi-v{font-size:15px!important;line-height:1.08!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.03em}
.ag-shell .kpi-s{font-size:10.5px!important;line-height:1.2}
.ag-day{min-height:104px!important;padding:7px 8px!important;gap:4px!important}
.ag-num{font-size:12px!important;line-height:1!important}
.ag-check{width:18px!important;height:18px!important;font-size:11px!important}
.ag-day .ag-total,
.ag-day .ag-total.pos,
.ag-day .ag-total.neg,
.ag-day .ag-total.zero{
  font-family:'DM Mono',monospace!important;
  font-size:11.2px!important;
  font-weight:900!important;
  letter-spacing:-.075em!important;
  line-height:1.05!important;
  margin:0!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  max-width:100%!important;
}
.ag-lines{gap:3px!important}
.ag-line{font-size:9.2px!important;line-height:1.05!important;padding:2px 5px!important;border-radius:6px!important;gap:4px!important}
.ag-line strong{font-family:'DM Mono',monospace!important;font-size:9.4px!important;line-height:1.05!important;letter-spacing:-.045em!important;color:var(--tx)!important}
.ag-muted{font-size:10.5px!important;line-height:1.1!important}
@media(min-width:1400px){
  .ag-day .ag-total,.ag-day .ag-total.pos,.ag-day .ag-total.neg,.ag-day .ag-total.zero{font-size:12px!important}
  .ag-line{font-size:9.8px!important}
  .ag-line strong{font-size:10px!important}
}
@media(max-width:980px){
  .ag-day{min-height:96px!important;padding:6px!important}
  .ag-day .ag-total,.ag-day .ag-total.pos,.ag-day .ag-total.neg,.ag-day .ag-total.zero{font-size:10.3px!important}
  .ag-line{font-size:8.8px!important;padding:2px 4px!important}
  .ag-line strong{font-size:8.9px!important}
}


/* Ajuste definitivo: mês da agenda menor e Plano de Contas em quadros */
.ag-shell .ag-title{font-size:15px!important;line-height:1.05!important;gap:8px!important;letter-spacing:-.035em!important}
.ag-shell .ag-title span{font-size:15px!important;line-height:1.05!important;font-weight:800!important;white-space:nowrap!important}
.ag-shell .ag-navbtn{width:28px!important;height:28px!important;border-radius:8px!important;font-size:18px!important;line-height:1!important}

@media(max-width:768px){.ag-shell .ag-title,.ag-shell .ag-title span{font-size:14px!important}.ag-shell .ag-navbtn{width:26px!important;height:26px!important;font-size:16px!important}}
.cc-layout{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:12px;align-items:start}
.cc-panel{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.cc-panel-head{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}

.cc-panel-sub{font-size:10.5px;color:var(--tx2);margin-top:2px}
.cc-groups{display:flex;flex-direction:column;gap:7px;padding:10px;max-height:calc(100vh - 260px);overflow:auto}
.cc-group-card{border:1px solid var(--bd);background:linear-gradient(180deg,rgba(255,255,255,.026),rgba(255,255,255,.012));border-radius:12px;padding:10px;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cc-group-card:hover{border-color:rgba(249,115,22,.55);transform:translateY(-1px)}
.cc-group-card.act{border-color:var(--acc);box-shadow:0 0 0 1px rgba(249,115,22,.25) inset;background:rgba(249,115,22,.08)}
.cc-group-name{font-size:12.5px;font-weight:800;color:var(--tx);line-height:1.15}
.cc-group-meta{font-size:10px;color:var(--tx2);margin-top:3px}
.cc-count{font-family:'DM Mono',monospace;font-size:11px;font-weight:800;color:var(--acc);background:var(--acc3);border:1px solid rgba(249,115,22,.18);border-radius:999px;padding:3px 7px;white-space:nowrap}
.cc-sub-list{padding:10px;display:flex;flex-direction:column;gap:7px}
.cc-sub-row{display:grid;grid-template-columns:1fr 90px 74px;gap:8px;align-items:center;background:rgba(255,255,255,.022);border:1px solid var(--bd);border-radius:12px;padding:10px}
.cc-sub-name{font-size:13px;font-weight:750;color:var(--tx)}
.cc-sub-empty{padding:36px 18px;text-align:center;color:var(--tx3)}
.cc-mini-actions{display:flex;gap:5px;justify-content:flex-end}
.cc-note{font-size:10.5px;color:var(--tx2);padding:10px 12px;border-top:1px solid var(--bd);line-height:1.35}
@media(max-width:980px){.cc-layout{grid-template-columns:1fr}.cc-groups{max-height:none}.cc-sub-row{grid-template-columns:1fr}.cc-mini-actions{justify-content:flex-start}}

/* PAGINATION */
.pag{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:9px}
.pb{width:27px;height:27px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--bd);color:var(--tx2);font-size:12px;cursor:pointer;transition:all .12s}
.pb:hover,.pb.act{border-color:var(--acc);color:var(--acc)}
.pi{font-size:11px;color:var(--tx2);margin:0 4px}

.es{text-align:center;padding:45px 20px;color:var(--tx3)}
.es .em{font-size:30px;margin-bottom:8px}
.es h3{color:var(--tx2);font-size:13px;margin-bottom:4px}
.ra{display:flex;gap:3px;justify-content:flex-end}

@media(max-width:768px){.kpis{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr}.bi-grid{grid-template-columns:1fr}.vg-grid{grid-template-columns:1fr}}

/* Ajuste Agenda: recebimentos manuais simples por origem */
.ag-origin-grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:8px;margin-top:6px}
.ag-origin-grid input{display:none!important}
.ag-origin-card{display:flex;align-items:center;justify-content:center;min-height:42px;border:1px solid var(--bd);border-radius:12px;background:var(--s2);color:var(--tx2);font-size:13px;font-weight:750;cursor:pointer;transition:.15s ease;user-select:none}
.ag-origin-card:hover{border-color:rgba(255,107,26,.45);color:var(--tx)}
.ag-origin-grid input:checked+.ag-origin-card{border-color:var(--acc);background:rgba(255,107,26,.14);color:var(--acc);box-shadow:0 0 0 1px rgba(255,107,26,.22) inset}
@media(max-width:760px){.ag-origin-grid{grid-template-columns:repeat(2,1fr)}}

/* Robustez financeira v1 — leitura suave, auditoria e fluxo de caixa */
:root{--font-soft:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
body,.app,.content,.btn,.fc,.fv,input,select,textarea,table{font-family:var(--font-soft)!important;letter-spacing:-.01em}
.ag-shell .ag-title span{font-size:18px!important;font-weight:750!important;letter-spacing:-.025em!important}
.ag-shell .ag-navbtn{width:30px!important;height:30px!important;font-size:17px!important}
.kpi .kpi-v,.ag-total,.cc-stat-v{font-family:var(--font-soft)!important;font-weight:700!important;letter-spacing:-.025em!important}
.fx-top{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(340px,1.1fr);gap:12px;margin-bottom:12px}
.fx-card,.audit-card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.fx-title,.audit-title{font-size:15px;font-weight:750;color:var(--tx);margin-bottom:4px;letter-spacing:-.02em}
.fx-sub,.audit-sub{font-size:11.5px;color:var(--tx2);line-height:1.35}
.fx-controls{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:12px}
.fx-controls .fgi{min-width:145px;flex:1}
.fx-month{font-size:18px;font-weight:750;color:var(--tx);letter-spacing:-.025em}
.fx-warn{border-color:rgba(239,68,68,.28)!important;background:rgba(239,68,68,.07)!important}
.fx-ok{border-color:rgba(34,197,94,.24)!important;background:rgba(34,197,94,.06)!important}
.fx-row-bad td{background:rgba(239,68,68,.055)}
.fx-row-good td{background:rgba(34,197,94,.035)}
.audit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:10px;margin-bottom:12px}
.audit-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);background:var(--s2);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--tx2);font-weight:650;margin:2px 4px 2px 0}
.audit-chip.bad{border-color:rgba(239,68,68,.35);color:#ff6b6b;background:rgba(239,68,68,.08)}
.audit-chip.warn{border-color:rgba(245,158,11,.35);color:#fbbf24;background:rgba(245,158,11,.08)}
.audit-chip.ok{border-color:rgba(34,197,94,.32);color:#4ade80;background:rgba(34,197,94,.08)}
.audit-list{display:grid;gap:10px}
.audit-item{border:1px solid var(--bd);background:var(--s1);border-radius:14px;padding:12px;transition:.16s ease}
.audit-item.audit-click{cursor:pointer}
.audit-item.audit-click:hover{border-color:rgba(255,107,26,.55);background:rgba(255,255,255,.04);transform:translateY(-1px)}
.audit-item h4{margin:0 0 4px;font-size:13.5px;color:var(--tx);font-weight:750}
.audit-item p{margin:0 0 8px;font-size:11.5px;color:var(--tx2);line-height:1.4}
.audit-meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--tx3);font-size:10.5px}
.audit-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.audit-tip{font-size:10.5px;color:var(--tx3)}
.audit-open{font-size:11px!important;padding:7px 10px!important}
.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:900px){.fx-top{grid-template-columns:1fr}.ag-shell .ag-title span{font-size:16px!important}}


/* DRE-API-DESIGN-2026-06-06: corrige sobreposição entre cabeçalho fixo, coluna de descrição e números na rolagem */
#content.dre-content{
  position:relative;
  overflow:auto!important;
  background:var(--bg);
}

let ccIdsEnsured=false;
function ccNorm(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ');}
function ccHashId(prefix,text){let h=2166136261;const str=String(text||'');for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return prefix+(h>>>0).toString(36);}

function loadScriptSafe(src, timeoutMs=8000){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[data-safe-src="${src}"]`)) return resolve(true);
    const sc=document.createElement('script');
    let done=false;
    const finish=(ok,err)=>{ if(done) return; done=true; clearTimeout(t); ok?resolve(true):reject(err||new Error('Falha ao carregar '+src)); };
    const t=setTimeout(()=>finish(false,new Error('Tempo esgotado ao carregar '+src)),timeoutMs);
    sc.src=src;
    sc.async=true;
    sc.defer=true;
    sc.dataset.safeSrc=src;
    sc.onload=()=>finish(true);
    sc.onerror=()=>finish(false,new Error('Erro ao carregar '+src));
    document.head.appendChild(sc);
  });
}

    return !!(window.firebase && firebase.firestore);

// Integridade financeira: snapshots são a única fonte de estado confirmado.
const FIN_COLLECTIONS=['lancamentos','agenda_financeira','centrocusto','patrimonio','clientes_mes','config','extratos_bancarios'];
const financeRaw={lancamentos:[],agenda_financeira:[]};
const financeSync={epoch:0,collections:{},pending:0,lastError:'',ready:false};
let financeBaseline=null;
let financeHealthTimer=null;
function finClean(row){return Object.fromEntries(Object.entries(row||{}).filter(([k,v])=>k!=='id'&&!k.startsWith('__')&&v!==undefined));}
function finVersion(row){
  if(!row)return '';
  const normalize=v=>{
    if(v&&typeof v.toMillis==='function')return {nanoseconds:v.nanoseconds,seconds:v.seconds};
    if(Array.isArray(v))return v.map(normalize);
    if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().filter(k=>k!=='id'&&!k.startsWith('__')).map(k=>[k,normalize(v[k])]));
    return v;
  };
  return JSON.stringify(normalize(row));
}
function finAssertReady(cols=['lancamentos','agenda_financeira']){
  if(!fbOk||!db||navigator.onLine===false)throw new Error('Sem conexão confirmada. Reconecte e tente novamente; o formulário foi mantido.');
  if(cols.some(c=>!financeSync.collections[c]?.confirmed||financeSync.collections[c]?.cached||financeSync.collections[c]?.error))throw new Error('Aguarde a sincronização com o servidor antes de gravar.');
}
function finStatus(){
  const states=Object.values(financeSync.collections);
  financeSync.ready=FIN_COLLECTIONS.every(c=>financeSync.collections[c]?.confirmed&&!financeSync.collections[c]?.error);
  const error=states.find(s=>s.error);
  const cached=states.some(s=>s.cached);
  setStatus(error?'● Erro de sincronização — veja Auditoria':financeSync.pending?'● Aguardando confirmação de gravação':navigator.onLine===false||cached?'● Sem confirmação atual do servidor':financeSync.ready?'● '+store.lancamentos.length+' lanç. | sincronizado':'● Conectando…',error?'var(--er)':(!financeSync.ready||cached||financeSync.pending)?'var(--wa)':'var(--ok)');
}
async function finTransaction(fn){
  financeSync.pending++;finStatus();
  try{return await db.runTransaction(fn);}
  catch(e){const messages={'permission-denied':'Sem permissão para confirmar a gravação no Firebase. Verifique o acesso; os dados do formulário foram mantidos.','unavailable':'Não foi possível confirmar a gravação. Reconecte e confira os registros antes de repetir.','aborted':'Outra edição ocorreu ao mesmo tempo. Reabra o registro e tente novamente.','deadline-exceeded':'A confirmação demorou. Confira os registros após reconectar antes de repetir.'};const error=messages[e.code]?Object.assign(new Error(messages[e.code]),{code:e.code}):e;financeSync.lastError=String(error.message||error);console.error('[Financeiro:gravação]',error);throw error;}
  finally{financeSync.pending--;finStatus();}
}
function finSnapshot(col,snap){
  const state=financeSync.collections[col];
  state.cached=!!snap.metadata.fromCache;state.pending=!!snap.metadata.hasPendingWrites;
  // Eventos locais/pending não são confirmação de persistência.
  if(!state.cached&&!state.pending){
    state.confirmed=true;state.error='';state.lastServer=new Date().toISOString();
    const rows=snap.docs.map(d=>({...d.data(),id:d.id}));
    financeRaw[col]=rows;
    if(col==='extratos_bancarios')window.BurgerBankUI?.acceptCloud(rows);
    if(col==='lancamentos'){store.lancamentos=rows.filter(r=>!r._deleted).map(r=>({...r}));normalizeLancamentosStore();}
    if(col==='agenda_financeira')store.agenda=agCanonicalRows(rows);
    if(col==='centrocusto'){store.centrocusto=rows;ccEnsureIds({persist:false});}
    if(col==='patrimonio')store.patrimonio=rows;
    if(col==='clientes_mes')store.clientes_mes=Object.fromEntries(rows.map(r=>[r.id,r.count||0]));
    if(col==='config'){const main=rows.find(r=>r.id==='main')||rows[0];if(main)store.cfg={...store.cfg,...finClean(main)};}
    lsSave();
    if(CM)safeRender(CM);
    clearTimeout(financeHealthTimer);financeHealthTimer=setTimeout(()=>financeMaybeHealth(),400);
  }
  finStatus();
}
async function loadAll(){
  const epoch=++financeSync.epoch;
  unsubListeners.forEach(u=>{try{u();}catch(e){}});unsubListeners=[];
  financeSync.collections={};
  const jobs=FIN_COLLECTIONS.map(col=>new Promise((resolve,reject)=>{
    financeSync.collections[col]={confirmed:false,cached:true,error:''};let first=true;
    const u=db.collection(col).onSnapshot({includeMetadataChanges:true},snap=>{
      if(epoch!==financeSync.epoch)return;
      finSnapshot(col,snap);
      if(first&&!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites){first=false;resolve(true);}
    },err=>{
      if(epoch!==financeSync.epoch)return;
      financeSync.collections[col].error=err.message;finStatus();
      if(first){first=false;reject(err);}
    });unsubListeners.push(u);
  }));
  try{await Promise.all(jobs);finStatus();return true;}catch(e){console.error('[Financeiro:sync]',e);return false;}
}
function setupRealtimeSync(){return loadAll();}
window.addEventListener('offline',finStatus);
window.addEventListener('online',()=>{finStatus();if(Object.values(financeSync.collections).some(s=>s.error))loadAll();});

function normalizeLancamentosStore(){
  // Identidade é o documento, não a semelhança de valores/despesas. Auditoria vê todos.
  store.lancamentos=[...new Map((store.lancamentos||[]).filter(r=>r&&!r._deleted&&r.id).map(r=>[r.id,r])).values()];
  return store.lancamentos;
}
function finExpected(col,id){return (financeRaw[col]||[]).find(r=>r.id===id)||null;}
async function finUpdateMany(changes){
  finAssertReady([...new Set(changes.map(c=>c.col))]);
  if(changes.length>200)throw new Error('Selecione até 200 registros por operação.');
  return finTransaction(async tx=>{
    const refs=changes.map(c=>db.collection(c.col).doc(c.id));
    const snaps=await Promise.all(refs.map(r=>tx.get(r)));
    snaps.forEach((s,i)=>{
      const c=changes[i],actual=s.exists?s.data():null;
      if(!actual||actual._deleted)throw new Error('Registro removido em outro computador. Reabra a tela.');
      if(!c.expected||finVersion(actual)!==finVersion(c.expected))throw new Error('Este registro mudou em outro computador. Reabra para revisar os valores atuais.');
    });
    changes.forEach((c,i)=>tx.update(refs[i],{...finClean(c.patch),_rev:(snaps[i].data()._rev||0)+1,updated_at:firebase.firestore.FieldValue.serverTimestamp()}));
    return true;
  });
}
async function finDeleteMany(col,rows){
  return finUpdateMany(rows.map(r=>({col,id:r.id,expected:r,patch:{_deleted:true,deleted_at:new Date().toISOString()}})));
}
async function finHash(value){
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));
  return [...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function lancBusinessKey(d,type='unica',count=1){
  return JSON.stringify([type,count,lancDateKey(d.data_competencia),lancDateKey(d.data_vencimento),lancMoneyKey(d.valor),...['rec_desp','forma_pagamento','categoria','subcategoria','descricao','instituicao','referencia'].map(k=>lancNormText(d[k]))]);
}
async function lancCreate(d,type='unica',count=1){
  finAssertReady(['lancamentos']);
  if(!Number.isFinite(d.valor)||d.valor<=0)throw new Error('Informe um valor positivo.');
  if(!finValidDate(d.data_competencia)||!finValidDate(d.data_vencimento))throw new Error('Informe competência e vencimento válidos.');
  if(!Number.isInteger(count)||count<1||count>60)throw new Error('A série deve ter entre 1 e 60 ocorrências.');
  d={...d,valor:lancRoundMoney(d.valor)};
  if(!Number.isSafeInteger(Math.round(d.valor*100))||d.valor<=0||(type==='parcelada'&&Math.round(d.valor*100)<count))throw new Error('Valor insuficiente ou fora do limite para distribuir as parcelas em centavos.');
  const key=lancBusinessKey(d,type,count),hash=await finHash(lancBusinessKey(d,type,1)),gid='v1_'+hash;
  const rows=type==='unica'?[{...d,id:'lanc_'+gid,creation_batch_id:gid}]:lancBuildSeries(d,type,count,gid);
  const existing=store.lancamentos.find(r=>{
    if(r._creation_key===key)return true;
    if(type==='unica')return !r.parcelamento_id&&!r.recorrencia_id&&lancBusinessKey(r)===key;
    const meta=lancManagedSeriesMeta([r]);return meta&&lancBusinessKey(meta.base,meta.type,1)===lancBusinessKey(d,type,1);
  });
  if(existing)throw new Error('Esta despesa/série já existe. Abra o registro para editar; para outra despesa, informe uma referência diferente.');
  return lancPersistMany(rows.map(r=>({...r,_creation_key:key,_integrity:1,_rev:1})),{create:true});
}
async function lancPersistMany(items,options={}){
  finAssertReady(['lancamentos']);
  const rows=[...new Map(items.map(r=>[r.id,r])).values()];
  if(!rows.length||rows.length>60)throw new Error('Lote inválido: máximo de 60 ocorrências.');
  if(!options.create){
    await finUpdateMany(rows.map(r=>({col:'lancamentos',id:r.id,expected:financeBaseline?.id===r.id?financeBaseline:finExpected('lancamentos',r.id),patch:r})));
    return rows;
  }
  await finTransaction(async tx=>{
    const refs=rows.map(r=>db.collection('lancamentos').doc(r.id));
    const snaps=await Promise.all(refs.map(r=>tx.get(r)));
    if(snaps.some(s=>s.exists))throw new Error('Esta operação já foi registrada ou excluída. Confira os lançamentos antes de repetir.');
    rows.forEach((r,i)=>tx.set(refs[i],{...finClean(r),updated_at:firebase.firestore.FieldValue.serverTimestamp()}));
  });
  return rows;
}
function finValidDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v||'')&&!isNaN(Date.parse(v+'T12:00:00Z'))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v;}

async function fbAdd(col, data){
  if(['lancamentos','agenda_financeira'].includes(col))throw new Error('Use o formulário financeiro para criar registros.');
  finAssertReady([col]);
  data={...data};delete data.id;
  data.updated_at = firebase.firestore.FieldValue.serverTimestamp();
  const ref = await db.collection(col).add(data);
  return ref.id;
}
async function fbSet(col,id,data){
  if(['lancamentos','agenda_financeira'].includes(col))return finUpdateMany([{col,id,expected:finExpected(col,id),patch:data}]);
  finAssertReady([col]);await db.collection(col).doc(id).set({...finClean(data),updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
}

async function fbSetMany(col, items){
  finAssertReady([col]);
  if(['lancamentos','agenda_financeira'].includes(col))return finUpdateMany((items||[]).map(r=>({col,id:r.id,expected:finExpected(col,r.id),patch:r})));
  const arr=(items||[]).filter(x=>x&&x.id);
  const CHUNK=450;
  for(let i=0;i<arr.length;i+=CHUNK){
    const batch=db.batch();
    arr.slice(i,i+CHUNK).forEach(item=>{
      const clean={...item};
      const id=clean.id;
      delete clean.id;
      clean.updated_at=firebase.firestore.FieldValue.serverTimestamp();
      batch.set(db.collection(col).doc(id),clean);
    });
    await batch.commit();
  }
}
async function fbDel(col,id){
  if(['lancamentos','agenda_financeira'].includes(col)){const r=finExpected(col,id);if(!r)throw new Error('Registro não encontrado.');return col==='agenda_financeira'?agDeleteReceipts([r]):finDeleteMany(col,[r]);}
  finAssertReady([col]);await db.collection(col).doc(id).delete();
}

async function fbBatch(col, items){
  finAssertReady([col]);
  const CHUNK=499;
  for(let i=0;i<items.length;i+=CHUNK){
    const batch=db.batch();
    items.slice(i,i+CHUNK).forEach(item=>{
      const d={...item};delete d.id;
      d.updated_at=firebase.firestore.FieldValue.serverTimestamp();
      const ref=db.collection(col).doc(item.id||lancMakeId('import'));
      batch.set(ref,d);
    });
    await batch.commit();
    console.log(`Batch ${i/CHUNK+1} ok`);
  }
}

function lancNormText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');}
function lancDateKey(v){return agDateKey?agDateKey(v):String(v||'').slice(0,10);}
function lancMoneyKey(v){return (Math.round((+v||0)*100)/100).toFixed(2);}
function lancMakeId(prefix='lanc'){
  const rand=Math.random().toString(36).slice(2,9);
  return (prefix+'_'+Date.now().toString(36)+'_'+rand).replace(/[^a-zA-Z0-9_\-]/g,'_');
}
function lancRoundMoney(v){return Math.round((Number(v)||0)*100)/100;}
function lancSplitInstallments(total,count){
  const n=Math.max(1,parseInt(count,10)||1);
  const cents=Math.round((Number(total)||0)*100);
  const base=Math.floor(cents/n);
  let extra=cents-(base*n);
  return Array.from({length:n},()=>{
    const value=base+(extra>0?1:0);
    if(extra>0) extra--;
    return value/100;
  });
}
function lancBuildSeries(d,type,count,gid){
  const n=Math.max(1,parseInt(count,10)||1);
  const baseDate=lancDateKey(d?.data_vencimento);
  const baseCompetence=lancDateKey(d?.data_competencia);
  if(!finValidDate(baseDate)||!finValidDate(baseCompetence)) throw new Error('Informe competência e vencimento válidos.');
  const baseDesc=(d.descricao_base||d.descricao||d.categoria||'Lançamento').trim();
  const originalTotal=lancRoundMoney(d.valor);
  const values=type==='parcelada'
    ? lancSplitInstallments(originalTotal,n)
    : Array.from({length:n},()=>originalTotal);

  return Array.from({length:n},(_,i)=>{
    const data=addMonths(baseDate,i);
    const idx=i+1;
    const common={
      ...d,
      status:i===0?(d.status||'Pendente'):'Pendente',
      data_efetivacao:i===0&&d.status==='Concluído'?(d.data_efetivacao||today()):null,
      id:`lanc_${gid}_${String(idx).padStart(3,'0')}`,
      valor:values[i],
      data_competencia:addMonths(baseCompetence,i),
      data_vencimento:data,
      creation_batch_id:gid,
      serie_tipo:type,
      serie_total:n,
      serie_indice:idx,
      serie_base_vencimento:baseDate,
      serie_base_competencia:baseCompetence,
      descricao_base:baseDesc
    };
    if(type==='parcelada') return {
      ...common,
      descricao:`${baseDesc} (${idx}/${n})`,
      parcela_info:`${idx}/${n}`,
      parcelamento_id:gid,
      recorrente:false,
      recorrencia_id:null,
      serie_valor_total:originalTotal,
      serie_valor_unitario:null
    };
    return {
      ...common,
      descricao:baseDesc,
      recorrente:true,
      recorrencia_id:gid,
      parcelamento_id:null,
      parcela_info:null,
      serie_valor_total:null,
      serie_valor_unitario:originalTotal
    };
  });
}

function lancSeriesId(r){return r?.parcelamento_id||r?.recorrencia_id||r?.creation_batch_id||'';}
function lancManagedSeriesMeta(rows){
  const lista=(rows||[]).filter(Boolean);
  const seed=lista.find(r=>r.serie_total&&r.serie_base_vencimento&&r.serie_tipo);
  if(!seed) return null;
  const total=Math.max(1,parseInt(seed.serie_total,10)||1);
  const type=seed.serie_tipo;
  const gid=lancSeriesId(seed);
  if(!gid || !['parcelada','recorrente'].includes(type) || total<2 || total>60) return null;
  const baseDate=lancDateKey(seed.serie_base_vencimento);
  const baseCompetence=lancDateKey(seed.serie_base_competencia||baseDate);
  if(!finValidDate(baseDate)||!finValidDate(baseCompetence)) return null;
  const originalValue=type==='parcelada'
    ? lancRoundMoney(seed.serie_valor_total)
    : lancRoundMoney(seed.serie_valor_unitario||seed.valor);
  if(!(originalValue>0)) return null;
  const base={...seed};
  delete base.id; delete base.updated_at; delete base.parcela_info;
  delete base.parcelamento_id; delete base.recorrencia_id; delete base.recorrente;
  delete base.creation_batch_id; delete base.serie_tipo; delete base.serie_total;
  delete base.serie_indice; delete base.serie_base_vencimento; delete base.serie_valor_total;
  delete base.serie_valor_unitario; delete base.serie_base_competencia;
  delete base._series_edit_plan; delete base._series_history; delete base._series_index;
  base.status='Pendente';base.data_efetivacao=null;delete base._deleted;
  base.valor=originalValue;
  base.data_vencimento=baseDate;
  base.data_competencia=baseCompetence;
  base.descricao=seed.descricao_base||seed.descricao||seed.categoria||'Lançamento';
  base.descricao_base=seed.descricao_base||base.descricao;
  return {gid,type,total,base};
}



let lancSaveInProgress=false;
function lancSetSaveBusy(busy){

    else if(btn.dataset.originalText){btn.textContent=btn.dataset.originalText;delete btn.dataset.originalText;}
  });
}
function lancSignature(r){
  if(!r) return '';
  return [
    lancDateKey(r.data_competencia), lancDateKey(r.data_vencimento), lancDateKey(r.data_efetivacao),
    lancNormText(r.rec_desp), lancNormText(r.forma_pagamento), lancNormText(r.categoria), lancNormText(r.subcategoria),
    lancNormText(r.descricao), lancMoneyKey(r.valor), lancNormText(r.status), lancNormText(r.parcela_info),
    lancNormText(r.parcelamento_id), lancNormText(r.recorrencia_id), r.recorrente?'recorrente':''
  ].join('|');
}
function lancTs(r){
  const v=r?.updated_at||r?.atualizado_em||r?.created_at||r?.criado_em||'';
  if(v&&typeof v.toMillis==='function') return v.toMillis();
  if(v&&typeof v.seconds==='number') return v.seconds*1000;
  const t=Date.parse(v); return Number.isFinite(t)?t:0;
}

function lancVencimentoMes(r){return finValidDate(r?.data_vencimento)?r.data_vencimento.slice(0,7):'sem-vencimento';}
function lancMesesDisponiveis(){
  const meses=[...new Set((store.lancamentos||[]).map(lancVencimentoMes))];
  const atual=today().slice(0,7);if(!meses.includes(atual))meses.push(atual);
  return meses.sort();
}

window.shiftLancMes=delta=>{
  const hoje=today().slice(0,7);
  const meses=lancMesesDisponiveis();
  if(!meses.includes(hoje)) meses.push(hoje);
  meses.sort();
  if(!lancMesSel || !meses.includes(lancMesSel)) lancMesSel=meses.includes(hoje)?hoje:(meses[meses.length-1]||hoje);
  const idx=meses.indexOf(lancMesSel);
  const next=Math.max(0,Math.min(meses.length-1,idx+delta));
  lancMesSel=meses[next]||lancMesSel||hoje;
  CP=1;
  rLanc();
};

// Edição explícita de séries: calendário independente, plano para reposição e escrita atômica.
let financeSeriesBaseline=null;
const LANC_SERIES_FIELDS=['rec_desp','data_competencia','data_vencimento','valor','forma_pagamento','categoria_id','categoria','subcategoria_id','subcategoria','descricao','descricao_base','referencia'];
function lancSeriesDeleted(r){return !!(r?._deleted||r?.deleted||r?.deleted_at);}
function lancLinkedSeriesId(r){return r?.parcelamento_id||r?.recorrencia_id||'';}
function lancCaptureSeries(id){
  const anchor=finExpected('lancamentos',id),gid=lancLinkedSeriesId(anchor);
  if(!gid)return null;
  return {anchorId:id,gid,rows:(financeRaw.lancamentos||[]).filter(r=>lancLinkedSeriesId(r)===gid).map(r=>({...r}))};
}
function lancSeriesMonthOffset(date,base){
  if(!finValidDate(date)||!finValidDate(base))return null;
  return (+date.slice(0,4)- +base.slice(0,4))*12+(+date.slice(5,7)- +base.slice(5,7));
}
function lancSeriesOrder(r,rows){
  const direct=Number(r.serie_indice||r._series_index||String(r.parcela_info||'').match(/^(\d+)\s*\//)?.[1]);
  if(Number.isInteger(direct)&&direct>0)return direct;
  const base=r.serie_base_vencimento||(rows||[]).map(x=>x.data_vencimento).filter(finValidDate).sort()[0];
  const offset=lancSeriesMonthOffset(r.data_vencimento,base);
  return offset!==null&&offset>=0?offset+1:null;
}
function lancSeriesPlan(rows){
  const active=(rows||[]).filter(r=>!lancSeriesDeleted(r));
  const plans=active.map(r=>r._series_edit_plan||null);
  if(plans.some(p=>finVersion(p)!==finVersion(plans[0])))throw Error('A série mudou. Feche a edição e abra novamente para atualizar os meses.');
  return plans[0]||null;
}
function lancApplySeriesPlan(rows,sourceRows){
  const plan=lancSeriesPlan(sourceRows);
  return (rows||[]).map(r=>{
    if(!plan)return r;
    const saved=plan.byId?.[r.id]||{};
    const patch=Object.fromEntries(LANC_SERIES_FIELDS.filter(k=>Object.hasOwn(saved,k)).map(k=>[k,saved[k]]));
    const next={...r,...patch,_series_edit_plan:plan,_series_index:r.serie_indice||r._series_index||null};
    if(!finValidDate(next.data_competencia)||!finValidDate(next.data_vencimento)||!Number.isFinite(next.valor)||next.valor<=0)throw Error('Confira as datas e os valores da série antes de repor ocorrências.');
    return next;
  });
}
function lancSeriesMissingValue(rows,missing){
  const meta=lancManagedSeriesMeta(rows);if(!meta)return 0;
  return lancApplySeriesPlan(lancBuildSeries(meta.base,meta.type,meta.total,meta.gid),rows).filter(r=>missing.includes(r.serie_indice)).reduce((s,r)=>s+r.valor,0);
}
function lancSeriesBaseDescription(text,anchor){
  const info=String(anchor.parcela_info||((anchor.serie_indice&&anchor.serie_total)?anchor.serie_indice+'/'+anchor.serie_total:'')).match(/^(\d+)\s*\/\s*(\d+)$/);
  if(!info)return String(text||'').trim();
  return String(text||'').trim().replace(new RegExp('\\s*(?:\\(\\s*'+info[1]+'\\s*/\\s*'+info[2]+'\\s*\\)|'+info[1]+'\\s*/\\s*'+info[2]+')\\s*$'),'').trim();
}
function lancSeriesDescription(base,r){
  const info=r.parcela_info||((r.parcelamento_id&&r.serie_indice&&r.serie_total)?r.serie_indice+'/'+r.serie_total:'');
  return info?`${base} (${info})`:base;
}
function lancSeriesEditModel(context,data,scope='all'){
  if(!context||!['one','future','all'].includes(scope))throw Error('Selecione o alcance da alteração.');
  const rows=context.rows,anchor=rows.find(r=>r.id===context.anchorId&&!lancSeriesDeleted(r));
  if(!anchor)throw Error('Lançamento removido. Reabra a série.');
  if(!data.categoria||!Number.isFinite(data.valor)||Math.round(data.valor*100)<1||!Number.isSafeInteger(Math.round(data.valor*100)))throw Error('Informe categoria e valor positivo.');
  if(!finValidDate(data.data_competencia)||!finValidDate(data.data_vencimento))throw Error('Informe competência e vencimento válidos.');
  if(!['Pendente','Concluído'].includes(data.status))throw Error('Selecione um status válido.');
  const currentPlan=lancSeriesPlan(rows),meta=lancManagedSeriesMeta(rows);
  const generated=meta?lancApplySeriesPlan(lancBuildSeries(meta.base,meta.type,meta.total,meta.gid),rows):[];
  const all=new Map(generated.map(r=>[r.id,r]));rows.forEach(r=>all.set(r.id,r));
  const index=lancSeriesOrder(anchor,rows);
  const targets=[...all.values()].filter(r=>{
    if(lancSeriesDeleted(r))return false;
    if(scope==='one')return r.id===anchor.id;
    if(scope==='all')return true;
    const order=lancSeriesOrder(r,rows);
    if(index===null||order===null)throw Error('Confira a ordem dos meses desta série ou escolha “Toda a série”.');
    return order>=index;
  });
  const equal=(a,b)=>String(a??'').trim()===String(b??'').trim();
  const changed=LANC_SERIES_FIELDS.filter(k=>k!=='descricao_base'&&k!=='descricao'&&Object.hasOwn(data,k)&&(k==='valor'?Math.round(data[k]*100)!==Math.round(anchor[k]*100):!equal(data[k],anchor[k])));
  const baseDescription=lancSeriesBaseDescription(data.descricao,anchor);
  const descriptionChanged=baseDescription!==lancSeriesBaseDescription(anchor.descricao,anchor);
  const patches=new Map();
  for(const r of targets){
    const patch={};
    for(const key of changed){
      if(key==='data_competencia'||key==='data_vencimento'){
        const offset=lancSeriesMonthOffset(r[key],anchor[key])??((index!==null&&lancSeriesOrder(r,rows)!==null)?lancSeriesOrder(r,rows)-index:null);
        if(offset===null)throw Error('Confira as datas desta série antes de alterar todos os meses.');
        patch[key]=addMonths(data[key],offset);
        if(!finValidDate(patch[key]))throw Error('A alteração produz uma data inválida em outro mês. Confira as datas.');
      }else patch[key]=key==='valor'?lancRoundMoney(data[key]):data[key];
    }
    if(descriptionChanged){patch.descricao_base=baseDescription;patch.descricao=lancSeriesDescription(baseDescription,r);}
    if(r.id===anchor.id&&!equal(data.status,anchor.status)){
      patch.status=data.status;
      patch.data_efetivacao=data.status==='Concluído'?(anchor.data_efetivacao||today()):null;
    }
    for(const k of Object.keys(patch))if(equal(patch[k],r[k]))delete patch[k];
    if(Object.keys(patch).length)patches.set(r.id,patch);
  }
  const byId={...(currentPlan?.byId||{})};
  for(const [id,r] of all){
    const next={...r,...(patches.get(id)||{})};
    byId[id]=Object.fromEntries(LANC_SERIES_FIELDS.filter(k=>Object.hasOwn(next,k)).map(k=>[k,next[k]]));
  }
  const selected=targets.filter(r=>rows.some(x=>x.id===r.id));
  const affected=selected.filter(r=>patches.has(r.id));
  return {anchor,scope,rows,selected,affected,patches,byId,currentPlan,index,
    before:selected.reduce((s,r)=>s+Math.round(r.valor*100),0)/100,
    after:selected.reduce((s,r)=>s+Math.round((patches.get(r.id)?.valor??r.valor)*100),0)/100};
}
async function lancSaveSeriesEdit(context,data,scope='all'){
  finAssertReady(['lancamentos']);
  const model=lancSeriesEditModel(context,data,scope);
  if(!model.patches.size)return {changed:0};
  const active=context.rows.filter(r=>!lancSeriesDeleted(r));
  if(context.rows.length>200)throw Error('Esta série excede o limite de edição conjunta. Nenhuma alteração foi gravada.');
  const operation={id:lancMakeId('serie_edit'),at:new Date().toISOString(),scope,anchorId:context.anchorId};
  const plan={version:1,revision:(model.currentPlan?.revision||0)+1,editId:operation.id,byId:model.byId};
  const updates=active.map(r=>{
    const delta=model.patches.get(r.id)||{};
    const patch={...delta,_series_edit_plan:plan,_series_index:lancSeriesOrder(r,context.rows)};
    if(Object.keys(delta).length){
      const before=Object.fromEntries(Object.keys(delta).map(k=>[k,r[k]??null]));
      patch._series_history=[...(r._series_history||[]),{...operation,before,after:delta}];
    }
    return {id:r.id,patch};
  });
  if(new TextEncoder().encode(JSON.stringify(updates)).length>8*1024*1024)throw Error('Esta alteração excede o tamanho permitido. Nenhuma alteração foi gravada.');
  await finTransaction(async tx=>{
    const refs=context.rows.map(r=>db.collection('lancamentos').doc(r.id));
    const snaps=await Promise.all(refs.map(ref=>tx.get(ref)));
    for(let i=0;i<snaps.length;i++)if(!snaps[i].exists||finVersion(snaps[i].data())!==finVersion(context.rows[i]))throw Error('Outro computador alterou esta série. Feche e reabra a edição para conferir os valores atuais.');
    const actual=new Map(snaps.map((snap,i)=>[context.rows[i].id,snap]));
    for(const change of updates){const snap=actual.get(change.id);tx.update(snap.ref,{...finClean(change.patch),_rev:(snap.data()._rev||0)+1,updated_at:firebase.firestore.FieldValue.serverTimestamp()});}
  });
  return {changed:model.affected.length};
}

window.previewDatas=()=>{
  const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const tp=$('f-rec')?$('f-rec').value:'unica';
  const dv=($('f-dv')||{value:''}).value;
  const dc=($('f-dc')||{value:''}).value;
  const vl=parseFloat(($('f-vl')||{value:0}).value)||0;

  if(tp==='parcelada'){
    const np=parseInt(($('f-np')||{value:2}).value)||2;
    const valores=lancSplitInstallments(vl,np);
    const pc=$('parc-valor-calc');
    if(pc){
      if(!vl) pc.textContent='—';
      else{
        const min=Math.min(...valores), max=Math.max(...valores);
        pc.textContent=min===max?fmt(min):`${fmt(min)} a ${fmt(max)}`;
      }
    }
    const prev=$('preview-parc');
    if(!prev) return;
    if(!dv){ prev.innerHTML='<span style="color:var(--wa)">⚠️ Informe a data de vencimento para ver as datas</span>'; return; }
    const datas=[];
    for(let i=0;i<Math.min(np,6);i++){
      const date=addMonths(dv,i);
      const [yy,mm,dd]=date.split('-');
      datas.push(`${dd}/${MN[+mm-1]}/${yy}`);
    }
    const extra=np>6?' + '+(np-6)+' mais…':'';
    prev.innerHTML='<strong>Parcelas geradas:</strong> '+datas.join(' · ')+extra;
  }

  if(tp==='recorrente'){
    const nm=parseInt(($('f-nm')||{value:12}).value)||12;
    const prev=$('preview-recorr');
    if(!prev) return;
    const base=dv||dc;
    if(!base){ prev.innerHTML='<span style="color:var(--wa)">⚠️ Informe a data de vencimento para ver as datas</span>'; return; }
    const datas=[];
    for(let i=0;i<Math.min(nm,6);i++){
      const date=addMonths(base,i);
      const [yy,mm,dd]=date.split('-');
      datas.push(`${dd}/${MN[+mm-1]}/${yy}`);
    }
    const extra=nm>6?' + '+(nm-6)+' mais…':'';
    prev.innerHTML='<strong>'+nm+' lançamentos:</strong> '+datas.join(' · ')+extra;
  }
};

const DRE_CLASS=[
  {id:'rec_bruta',lbl:'Receita Bruta'},
  {id:'ded',lbl:'Deduções da Receita'},
  {id:'custos',lbl:'Custo dos Produtos'},
  {id:'desp_op',lbl:'Despesas Operacionais'},

  {id:'fora',lbl:'Fora do DRE'}
];
function dreClassLabel(id){return (DRE_CLASS.find(x=>x.id===id)||{}).lbl||'Sem classificação';}
function dreInferClass(cat){
  const n=ccNorm(cat);
  if(['receita com produtos e mercadorias','outras receitas operacionais','vendas','a receber'].includes(n)) return 'rec_bruta';
  if(['impostos sobre a receita','outras deducoes','taxas de cartao','taxas ifood','taxas i food','taxas'].includes(n)) return 'ded';
  if(n==='custo dos produtos') return 'custos';
  if(n==='despesas com pessoal') return 'desp_pes';
  if(n==='outras despesas operacionais') return 'outras';
  if(n==='depreciacao') return 'depreciacao';
  if(['transferencia entre contas','transferências entre contas','aporte dos socios','aporte dos sócios','distribuicao de lucros','distribuição de lucros','aquisicao de bens','aquisição de bens'].includes(n)) return 'fora';
  if(n==='despesas operacionais') return 'desp_op';
  return 'desp_op';
}
function dreClassForPlanRow(r){return r?.dre_id||r?.dre_classificacao||dreInferClass(r?.categoria||'');}
function dreClassForGroup(g){
  const rows=ccRows(g?.id||g?.nome||g)||[];
  const explicit=rows.find(r=>r.dre_id||r.dre_classificacao);
  return explicit?(explicit.dre_id||explicit.dre_classificacao):dreInferClass(g?.nome||g||'');
}
function dreClassForLanc(r){
  if(r?.dre_id||r?.dre_classificacao) return r.dre_id||r.dre_classificacao;
  const g=ccGroupByAny(r?.categoria_id||r?.categoria);
  if(g) return dreClassForGroup(g);
  return dreInferClass(r?.categoria||'');
}
function dreLancMatchesPlan(l,row){
  const gid=ccRowGroupId(row), sid=ccRowSubId(row);
  const gm=gid?((l.categoria_id&&l.categoria_id===gid)||ccNorm(l.categoria)===ccNorm(row.categoria)):ccNorm(l.categoria)===ccNorm(row.categoria);
  if(!gm) return false;
  if(row.subcategoria&&sid) return (l.subcategoria_id&&l.subcategoria_id===sid)||ccNorm(l.subcategoria)===ccNorm(row.subcategoria);
  if(row.subcategoria) return ccNorm(l.subcategoria)===ccNorm(row.subcategoria);
  return true;
}

  return finValidDate(d)||/^\d{4}-(0[1-9]|1[0-2])$/.test(d)?d.slice(0,7):'';
}
function dreIsReceitaLanc(r){
  const rd=ccNorm(r?.rec_desp||r?.tipo||r?.natureza||'');
  const cat=ccNorm(r?.categoria||r?.grupo||'');
  const sub=ccNorm(r?.subcategoria||'');
  if(rd.includes('receber')||rd.includes('receita')||rd.includes('entrada')||rd==='vendas') return true;
  if(['vendas','a receber','receita com produtos e mercadorias','outras receitas operacionais'].includes(cat)) return true;
  if(['vendas','ifood','i food','cartao credito','cartão crédito','cartao debito','cartão débito','pix','dinheiro'].includes(sub)) return true;
  return false;
}
function dreClassForLancFast(r){
  if(dreIsReceitaLanc(r)) return 'rec_bruta';
  return dreClassForLanc(r);
}
function dreSignForClass(id){return id==='rec_bruta'?1:-1;}
function dreEmptyVals(){
  const vals={};
  DRE_STRUCT.forEach(row=>{ vals[row.id]=0; });
  return vals;
}
function dreFinalize(vals){
  DRE_STRUCT.forEach(row=>{
    if(row.tipo==='tot') vals[row.id]=row.deps.reduce((s,d)=>s+(vals[d]||0),0);
  });
  return vals;
}
function calcDRE(lancs){
  const vals=dreEmptyVals();
  (lancs||[]).forEach(r=>{
    const cls=dreClassForLancFast(r);
    if(!vals.hasOwnProperty(cls) || cls==='fora') return;
    const v=Math.abs(Number(r.valor)||0);
    vals[cls]+=v*dreSignForClass(cls);
  });
  return dreFinalize(vals);
}
function rDRE(){
  const mn=$('month-nav'); if(mn){ mn.classList.remove('show'); mn.innerHTML=''; }
  const content=$('content');
  if(!content) return;
  const currentYear=new Date().getFullYear().toString();
  const rawLanc=(store.lancamentos||[]);
  let anos=[...new Set(rawLanc.map(r=>dreDateKey(r).slice(0,4)).filter(Boolean))].sort().reverse();
  if(!anos.includes(currentYear)) anos.unshift(currentYear);
  anos=[...new Set(anos.map(String))];
  if(!dreAnoSel) dreAnoSel=currentYear;
  const fAno=String(dreAnoSel||currentYear);

  const lancAno=[];
  const mesesSet=new Set();
  rawLanc.forEach(r=>{
    const ym=dreDateKey(r);
    if(!ym || !ym.startsWith(fAno+'-')) return;
    lancAno.push(r);
    mesesSet.add(ym.slice(5,7));
  });
  const mesesDisp=[...mesesSet].sort();

  if(!mesesDisp.length){
    const yearBtns=anos.map(ano=>`<button class="m-tab${String(fAno)===String(ano)?' act':''}" onclick="setDreAno('${ccSafe(String(ano))}')">${ccSafe(String(ano))}</button>`).join('');
    content.innerHTML=`<div class="dre-page" data-versao="DRE-API-DESIGN-2026-06-06"><div class="dre-yearbar">${yearBtns}</div><div class="es"><div class="em">📈</div><h3>Sem dados para ${ccSafe(fAno)}</h3></div></div>`;
    return;
  }

  const dreM={};
  mesesDisp.forEach(m=>{ dreM[m]=dreEmptyVals(); });
  const dreTotal=dreEmptyVals();
  const planTotals={};

  function planKeyFromLanc(l){return `${ccNorm(l?.categoria_id||l?.categoria||'')}|${ccNorm(l?.subcategoria_id||l?.subcategoria||'')}`;}
  function planKeyFromRow(r){return `${ccNorm(r?.grupo_id||r?.categoria_id||r?.categoria||'')}|${ccNorm(r?.subcategoria_id||r?.sub_id||r?.subcategoria||'')}`;}

  const planRows=(store.centrocusto||[])
    .filter(c=>c&&c.subcategoria&&dreClassForPlanRow(c)!=='fora')
    .map(c=>({...c,_dre:dreClassForPlanRow(c),_key:planKeyFromRow(c)}));
  const planKeySet=new Set(planRows.map(r=>r._key));

  lancAno.forEach(r=>{
    const ym=dreDateKey(r); const m=ym.slice(5,7);
    const cls=dreClassForLancFast(r);
    if(!dreTotal.hasOwnProperty(cls) || cls==='fora') return;
    const val=(Math.abs(Number(r.valor)||0))*dreSignForClass(cls);
    dreTotal[cls]+=val;
    if(dreM[m]) dreM[m][cls]+=val;

    const pk=planKeyFromLanc(r);
    if(planKeySet.has(pk)){
      if(!planTotals[pk]) planTotals[pk]={total:0,mes:{}};
      planTotals[pk].total+=val;
      planTotals[pk].mes[m]=(planTotals[pk].mes[m]||0)+val;
    }
  });
  dreFinalize(dreTotal); mesesDisp.forEach(m=>dreFinalize(dreM[m]));

  const thM=mesesDisp.map(m=>`<th class="dv">${MES_NM[+m-1]}</th>`).join('');
  const colCnt=mesesDisp.length+3;

  function bkRow(vals){
    const rb=vals['rec_bruta']||0;
    const cv=Math.abs(vals['custos']||0);
    const cf=Math.abs((vals['desp_op']||0)+(vals['desp_pes']||0)+(vals['outras']||0));
    const mc=rb-cv; const mcPct=rb?mc/rb:0;
    const bep=mcPct>0?cf/mcPct:null;
    const marg=rb?((vals['resultado']||0)/rb*100):0;
    return{bep,marg,mc,mcPct:mcPct*100};
  }
  const bkTotal=bkRow(dreTotal);
  const bkM={}; mesesDisp.forEach(m=>{ bkM[m]=bkRow(dreM[m]); });
  const recBruta=Math.abs(dreTotal['rec_bruta']||1);
  function valCls(v){return v>0?'dp':v<0?'dn':'dc';}
  function dreCleanSubLabel(v){
    let t=String(v||'Sem subcategoria').trim();
    if(t.includes('›')) t=t.split('›').pop().trim();
    if(t.includes('>')) t=t.split('>').pop().trim();
    return t||'Sem subcategoria';
  }

  let rowsHtml='';
  DRE_STRUCT.forEach(row=>{
    const va=dreTotal[row.id]||0;
    const pct=recBruta?Math.abs(va)/recBruta*100:0;
    const mCols=mesesDisp.map(m=>{const v=dreM[m][row.id]||0;return`<td class="dv ${valCls(v)}">${v===0?'—':fmtN(v)}</td>`;}).join('');
    if(row.tipo==='g'){
      const cls=row.hi?'dre-hi':'dre-cat';
      rowsHtml+=`<tr class="${cls}"><td>${row.lbl}</td>${mCols}<td class="dv ${valCls(va)}">${fmtN(va)}</td><td class="dv dc">${pct.toFixed(1)}%</td></tr>`;
      const subRows=planRows.filter(pr=>pr._dre===row.id && Math.abs((planTotals[pr._key]||{}).total||0)>0).slice(0,120);
      subRows.forEach(pr=>{
        const pt=planTotals[pr._key]||{total:0,mes:{}};
        const sCols=mesesDisp.map(m=>{const v=pt.mes[m]||0;return`<td class="dv dc">${v?fmtN(v):'—'}</td>`;}).join('');
        rowsHtml+=`<tr class="dre-sub"><td>└ ${ccSafe(dreCleanSubLabel(pr.subcategoria||pr.categoria||'Sem subcategoria'))}</td>${sCols}<td class="dv dc">${fmtN(pt.total)}</td><td></td></tr>`;
      });
      const totalSub=planRows.filter(pr=>pr._dre===row.id && Math.abs((planTotals[pr._key]||{}).total||0)>0).length;
      if(totalSub>120) rowsHtml+=`<tr class="dre-sub"><td>└ + ${totalSub-120} subcategorias ocultas para manter a tela leve</td><td colspan="${colCnt-1}"></td></tr>`;
    }else{
      const cls=row.hi?'dre-hi':'dre-tot';
      rowsHtml+=`<tr class="${cls}"><td>${row.lbl}</td>${mCols}<td class="dv ${valCls(va)}">${fmtN(va)}</td><td class="dv dc">${pct.toFixed(1)}%</td></tr>`;
      rowsHtml+=`<tr class="dre-sep"><td colspan="${colCnt}"></td></tr>`;
    }
  });

  const margTotal=bkTotal.marg;
  const margCols=mesesDisp.map(m=>{const v=bkM[m].marg;return`<td class="dv ${v>=0?'dp':'dn'}">${v.toFixed(1)}%</td>`;}).join('');
  rowsHtml+=`<tr class="dre-bk"><td>📊 Margem de Lucro</td>${margCols}<td class="dv ${margTotal>=0?'dp':'dn'}">${margTotal.toFixed(1)}%</td><td></td></tr>`;
  const bepTotal=bkTotal.bep;
  const bepCols=mesesDisp.map(m=>{const v=bkM[m].bep;return`<td class="dv dc">${v!==null?fmt(v):'N/D'}</td>`;}).join('');
  rowsHtml+=`<tr class="dre-bk"><td>🎯 Breakeven</td>${bepCols}<td class="dv dc">${bepTotal!==null?fmt(bepTotal):'N/D'}</td><td></td></tr>`;
  const mcTot=bkTotal.mcPct;
  const mcCols=mesesDisp.map(m=>{const v=bkM[m].mcPct;return`<td class="dv dc">${v.toFixed(1)}%</td>`;}).join('');
  rowsHtml+=`<tr class="dre-bk"><td>📐 Margem de Contribuição</td>${mcCols}<td class="dv dc">${mcTot.toFixed(1)}%</td><td></td></tr>`;

  const yearBtns=anos.map(ano=>`<button class="m-tab${String(fAno)===String(ano)?' act':''}" onclick="setDreAno('${ccSafe(String(ano))}')">${ccSafe(String(ano))}</button>`).join('');
  content.innerHTML=`
    <div class="dre-page" data-versao="DRE-API-DESIGN-2026-06-06">
      <div class="dre-yearbar">${yearBtns}</div>
      <div class="dre-info">DRE ${ccSafe(fAno)} · Regime de Competência · ${lancAno.length} lançamentos · ${mesesDisp.length} meses</div>
      <div class="dre-table-shell">
        <table class="dre-t">
          <colgroup><col class="dre-col-item">${mesesDisp.map(()=>'<col class="dre-col-mes">').join('')}<col class="dre-col-total"><col class="dre-col-pct"></colgroup>
          <thead><tr><th style="text-align:left">Item</th>${thM}<th class="dv" style="color:var(--acc)">Total ${ccSafe(fAno)}</th><th class="dv">% Rec.</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>`;
}
window.rDRE=rDRE;

  const catMap={};alvo.forEach(r=>{catMap[r.categoria||'—']=(catMap[r.categoria||'—']||0)+r.valor;});

  const maxCat=topCats[0]?topCats[0][1]:1;

  const subMap={};alvo.forEach(r=>{const k=r.subcategoria||'—';subMap[k]=(subMap[k]||0)+r.valor;});
  const topSubs=Object.entries(subMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxSub=topSubs[0]?topSubs[0][1]:1;

  const margemRows=fluxo.map(d=>{

  const pend=store.lancamentos.filter(r=>r.status==='Pendente');

  const varE=entA?((entM-entA)/entA*100):0,varS=saiA?((saiM-saiA)/saiA*100):0;

  // Últimos 6 meses
  const m6=Array.from({length:6},(_,i)=>addMonths(mes+'-01',i-5).slice(0,7));
  const maxV=Math.max(...m6.map(m=>{const l=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(m));return Math.max(l.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0),l.filter(r=>r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0));}),1);
  const bars6=m6.map(m=>{
    const l=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(m));
    const e=l.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const s=l.filter(r=>r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const res=e-s;
    return`<div class="chart-col"><div class="chart-area"><div class="chart-b" style="height:${Math.round(e/maxV*110)}px;background:var(--ok)" title="${fmt(e)}"></div><div class="chart-b" style="height:${Math.round(s/maxV*110)}px;background:var(--er)" title="${fmt(s)}"></div></div><div style="font-size:10px;color:var(--tx2)">${mesLbl(m)}</div><div style="font-size:10px;color:${res>=0?'var(--ok)':'var(--er)'}">${res>=0?'+':''}${(res/1000).toFixed(0)}k</div></div>`;
  }).join('');

  // Top despesas do mês
  const catM={};lM.filter(r=>r.rec_desp!=='Contas a receber').forEach(r=>{catM[r.categoria||'—']=(catM[r.categoria||'—']||0)+r.valor;});
  const topCat=Object.entries(catM).sort((a,b)=>b[1]-a[1]).slice(0,5);

function rVG(){
  const mes=selMes||new Date().toISOString().slice(0,7);
  const ano=mes.slice(0,4);
  const mesesAno=[...new Set(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(ano)).map(r=>(r.data_competencia||'').slice(0,7)).filter(Boolean))].sort();

  const linhas=mesesAno.map(m=>{
    const l=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(m));
    const receita=l.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const cv=l.filter(r=>r.categoria==='Custo dos produtos').reduce((s,r)=>s+r.valor,0);
    const cf=l.filter(r=>['Despesas Operacionais','Despesas com pessoal','Outras despesas operacionais'].includes(r.categoria)).reduce((s,r)=>s+r.valor,0);
    const mc=receita-cv;const mcPct=receita?mc/receita:0;
    const bep=mcPct>0?cf/mcPct:null;
    const resultado=receita-cv-cf-l.filter(r=>!['Custo dos produtos','Despesas Operacionais','Despesas com pessoal','Outras despesas operacionais'].includes(r.categoria)&&r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const clientes=store.clientes_mes[m]||0;
    const tm=clientes?receita/clientes:0;
    return{m,receita,cv,cf,mc,mcPct,bep,resultado,clientes,tm};
  });

  // KPIs do mês selecionado
  const atual=linhas.find(l=>l.m===mes)||linhas[linhas.length-1]||{};
  const totAno=linhas.reduce((s,l)=>s+l.receita,0);
  const bepMedia=linhas.filter(l=>l.bep).reduce((s,l)=>s+l.bep,0)/(linhas.filter(l=>l.bep).length||1);

  const inputsClientes=mesesAno.map(m=>{
    const l=linhas.find(x=>x.m===m)||{};
    return`<div class="input-row">
      <label>${mesLbl(m)}<span style="margin-left:8px;color:var(--tx3)">Receita: ${fmt(l.receita||0)}</span></label>
      <input class="clientes-input" data-mes="${m}" type="text" inputmode="numeric" autocomplete="off" value="${store.clientes_mes[m]||''}" placeholder="Nº clientes"
        oninput="clientesMesDigitado(this,'${m}')" onblur="clientesMesFechar('${m}',this)" onkeydown="if(event.key==='Enter'){this.blur()}">
    </div>`;
  }).join('');

  const tabelaRows=linhas.map(l=>{
    const diffBep=l.bep?l.receita-l.bep:null;
    return`<tr>
      <td>${mesLbl(l.m)}</td>
      <td class="tr vin">+ ${fmtN(l.receita)}</td>
      <td class="tr vout">− ${fmtN(l.cv)}</td>
      <td class="tr" style="color:var(--tx2)">− ${fmtN(l.cf)}</td>
      <td class="tr mono" style="color:var(--in)">${l.mcPct?(l.mcPct*100).toFixed(1)+'%':'—'}</td>
      <td class="tr mono" style="color:var(--acc)">${l.bep?fmt(l.bep):'N/D'}</td>
      <td class="tr" style="color:${diffBep===null?'var(--tx3)':diffBep>=0?'var(--ok)':'var(--er)'}">${diffBep!==null?(diffBep>=0?'+':'')+fmtN(diffBep):'—'}</td>
      <td class="tr mono" style="color:var(--pu)">${l.clientes||'—'}</td>
      <td class="tr mono" style="color:var(--acc)">${l.tm?fmt(l.tm):'—'}</td>
    </tr>`;
  }).join('');

  const maxBEP=Math.max(...linhas.filter(l=>l.bep).map(l=>Math.max(l.receita,l.bep)),1);
  const bepBars=linhas.filter(l=>l.receita||l.bep).map(l=>`<div class="chart-col">
    <div class="chart-area" style="position:relative;height:110px;align-items:flex-end;gap:2px">
      <div class="chart-b" style="height:${Math.round((l.receita/maxBEP)*100)}px;background:var(--ok)" title="Receita: ${fmt(l.receita)}"></div>
      ${l.bep?`<div class="chart-b" style="height:${Math.round((l.bep/maxBEP)*100)}px;background:var(--in);opacity:.7" title="BEP: ${fmt(l.bep)}"></div>`:''}
    </div>
    <div style="font-size:9px;color:var(--tx2)">${mesLbl(l.m)}</div>
  </div>`).join('');

  $('content').innerHTML=`
    <div class="kpis">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Receita — ${mesLbl(mes)}</div><div class="kpi-v">${fmt(atual.receita||0)}</div></div>
      <div class="kpi" style="--kc:var(--in)"><div class="kpi-l">Breakeven — ${mesLbl(mes)}</div><div class="kpi-v" style="color:var(--in)">${atual.bep?fmt(atual.bep):'N/D'}</div><div class="kpi-s">${atual.bep&&atual.receita?(atual.receita>=atual.bep?'✅ Atingido':'⚠️ '+fmt(atual.bep-atual.receita)+' a cobrir'):'—'}</div></div>
      <div class="kpi" style="--kc:var(--acc)"><div class="kpi-l">Ticket Médio — ${mesLbl(mes)}</div><div class="kpi-v" style="color:var(--acc)">${atual.tm?fmt(atual.tm):'Informe clientes'}</div><div class="kpi-s">${atual.clientes?atual.clientes+' clientes':'Informe ao lado →'}</div></div>
      <div class="kpi" style="--kc:var(--pu)"><div class="kpi-l">BEP Médio ${ano}</div><div class="kpi-v" style="color:var(--pu)">${fmt(bepMedia)}</div><div class="kpi-s">média ${mesesAno.length} meses</div></div>
    </div>

    <div style="display:grid;grid-template-columns:3fr 1fr;gap:12px;margin-bottom:12px">
      <div class="bi-card">
        <div class="sh">Receita vs Breakeven <span>${ano} — barras = mês</span></div>
        <div style="display:flex;align-items:flex-end;gap:4px;min-height:120px">${bepBars||'<span style="color:var(--tx3)">Sem dados</span>'}</div>
        <div style="display:flex;gap:12px;margin-top:7px;font-size:10px;color:var(--tx2)"><span><i style="display:inline-block;width:8px;height:8px;background:var(--ok);border-radius:2px;margin-right:3px"></i>Receita</span><span><i style="display:inline-block;width:8px;height:8px;background:var(--in);border-radius:2px;margin-right:3px"></i>Breakeven</span></div>
      </div>
      <div class="bi-card">
        <div class="sh">Clientes Atendidos <span>informe por mês</span></div>
        ${inputsClientes||'<span style="color:var(--tx3);font-size:12px">Sem meses</span>'}
      </div>
    </div>

    <div class="bi-card">
      <div class="sh">Análise Mensal ${ano} <span>BEP · Margem Contribuição · Ticket Médio</span></div>
      <div style="overflow-x:auto"><div class="tw" style="border:none"><table>
        <thead><tr>
          <th>Mês</th><th class="tr">Receita</th><th class="tr">Custo Var.</th><th class="tr">Custo Fix.</th>
          <th class="tr">MC%</th><th class="tr">Breakeven</th><th class="tr">Rec. − BEP</th>
          <th class="tr">Clientes</th><th class="tr">TM</th>
        </tr></thead>
        <tbody>${tabelaRows||'<tr><td colspan="9" style="text-align:center;color:var(--tx3);padding:20px">Sem dados</td></tr>'}</tbody>
      </table></div></div>
    </div>`;
}

let ccSel='';
function ccCats(){return ccGroups().map(g=>g.nome);}
function ccRows(cat){const g=ccGroupByAny(cat);return g?g.rows:[];}
function ccSubs(cat){return ccSubsByAny(cat);}
function ccLancCount(cat,sub=''){
  const g=ccGroupByAny(cat); const subObj=sub?ccSubByAny(g?.id||cat,sub):null;
  return (store.lancamentos||[]).filter(l=>{
    const gMatch=g?((l.categoria_id&&l.categoria_id===g.id)||ccNorm(l.categoria)===ccNorm(g.nome)):false;
    if(!sub)return gMatch;
    return gMatch && (subObj?((l.subcategoria_id&&l.subcategoria_id===ccRowSubId(subObj))||ccNorm(l.subcategoria)===ccNorm(subObj.subcategoria)):ccNorm(l.subcategoria)===ccNorm(sub));
  }).length;
}
function ccAgendaCount(cat,sub=''){
  const g=ccGroupByAny(cat); const subObj=sub?ccSubByAny(g?.id||cat,sub):null;
  return (store.agenda||[]).filter(a=>{
    const gMatch=g?((a.categoria_id&&a.categoria_id===g.id)||ccNorm(a.categoria)===ccNorm(g.nome)):false;
    if(!sub)return gMatch;
    return gMatch && (subObj?((a.subcategoria_id&&a.subcategoria_id===ccRowSubId(subObj))||ccNorm(a.subcategoria)===ccNorm(subObj.subcategoria)):ccNorm(a.subcategoria)===ccNorm(sub));
  }).length;
}
function ccSafe(v){return agEsc(v||'');}
function ccSortStore(){
  store.centrocusto=(store.centrocusto||[]).sort((a,b)=>{
    const c=(a.categoria||'').localeCompare((b.categoria||''),'pt-BR',{sensitivity:'base'});
    if(c)return c;
    const sa=(a.subcategoria||'').trim(), sb=(b.subcategoria||'').trim();
    if(!sa&&sb)return -1;
    if(sa&&!sb)return 1;
    return sa.localeCompare(sb,'pt-BR',{sensitivity:'base'});
  });
}
async function ccPersistRefs(changedLanc,changedAgenda){
  try{
    const jobs=[];
    changedLanc.forEach(r=>{if(r.id)jobs.push(fbSet('lancamentos',r.id,{...r}));});
    changedAgenda.forEach(r=>{if(r.id)jobs.push(fbSet('agenda_financeira',r.id,{...r}));});
    for(let i=0;i<jobs.length;i+=80){await Promise.all(jobs.slice(i,i+80));}
  }catch(e){console.warn('Falha ao atualizar referências do plano de contas:',e);}
}
async function ccRenameRefs(oldCat,newCat,oldSub=null,newSub=null,ids={}){
  const groupId=ids.groupId||''; const subId=ids.subId||'';
  const changedLanc=[],changedAgenda=[];
  const apply=(r,arr)=>{
    const gMatch=groupId?(r.categoria_id===groupId||ccNorm(r.categoria)===ccNorm(oldCat)):ccNorm(r.categoria)===ccNorm(oldCat);
    if(!gMatch)return;
    const sMatch=oldSub===null?true:(subId?(r.subcategoria_id===subId||ccNorm(r.subcategoria)===ccNorm(oldSub)):ccNorm(r.subcategoria)===ccNorm(oldSub));
    if(!sMatch)return;
    r.categoria=newCat; if(groupId)r.categoria_id=groupId;
    if(newSub!==null){r.subcategoria=newSub; if(subId)r.subcategoria_id=subId;}
    arr.push(r);
  };
  (store.lancamentos||[]).forEach(r=>apply(r,changedLanc));
  (store.agenda||[]).forEach(r=>apply(r,changedAgenda));
  await ccPersistRefs(changedLanc,changedAgenda);
}

function calcDep(r){if(!r.valor_aquisicao||!r.vida_util_anos)return{m:0,ac:0,at:+r.valor_aquisicao||0,pct:0};const mn=(+r.valor_aquisicao)/(+r.vida_util_anos*12);const s=r.data_aquisicao?new Date(r.data_aquisicao):new Date();const e=r.data_baixa?new Date(r.data_baixa):new Date();const ms=Math.max(0,(e.getFullYear()-s.getFullYear())*12+e.getMonth()-s.getMonth());const ac=Math.min(mn*ms,+r.valor_aquisicao);return{m:mn,ac,at:+r.valor_aquisicao-ac,pct:+r.valor_aquisicao?ac/+r.valor_aquisicao*100:0};}
