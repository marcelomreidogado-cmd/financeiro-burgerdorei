let fluxoMes=today().slice(0,7);
function fDate(d){return d?new Date(d+'T12:00:00'):null;}
function isDone(r){const s=String(r.status||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return ['concluido','baixado','pago'].includes(s);}
function isReceber(r){return r.rec_desp==='Contas a receber'||r.tipo==='receber';}
function moneyInput(v){return Number(String(v||'').replace(/\./g,'').replace(',','.'))||0;}
function mesDias(mes){const y=+mes.slice(0,4),m=+mes.slice(5,7);return new Date(y,m,0).getDate();}
function addDia(data,n){const d=new Date(data+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fluxoItems(mes=fluxoMes){
  // Fluxo diário: pagamentos vêm dos Lançamentos por vencimento.
  // Recebidos vêm somente da Agenda Financeira manual, para não misturar vendas brutas do fechamento mensal.
  const lanc=(store.lancamentos||[]).filter(r=>r.rec_desp!=='Contas a receber'&&(r.data_vencimento||r.data_competencia||'').startsWith(mes)).map(r=>({
    id:r.id,source:'lancamento',tipo:'pagar',data:r.data_vencimento||r.data_competencia,descricao:r.descricao||r.categoria||'Lançamento',valor:+r.valor||0,status:isDone(r)?'Baixado':'Aberto',categoria:r.categoria||'',subcategoria:r.subcategoria||'',origem:'Lançamentos'
  }));
  const man=(store.agenda||[]).filter(r=>(r.data||'').startsWith(mes)&&(r.tipo||'receber')!=='pagar').map(r=>({
    id:r.id,source:'manual',tipo:'receber',data:r.data,descricao:r.origem||r.forma||r.descricao||'Recebimento manual',valor:+r.valor||0,status:'Baixado',categoria:r.categoria||'',subcategoria:r.subcategoria||'',origem:'Agenda Financeira'
  }));
  return [...lanc,...man].filter(x=>x.data).sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a.tipo||'').localeCompare(b.tipo||''));
}
function setFluxoMes(delta){fluxoMes=agAddMes(fluxoMes,delta);rFluxo();}

function rFluxo(){
  const itens=fluxoItems(fluxoMes);

  const pagReal=itens.filter(x=>x.tipo==='pagar'&&x.status==='Baixado').reduce((s,x)=>s+x.valor,0);
  const abertoPagar=itens.filter(x=>x.tipo==='pagar'&&x.status!=='Baixado').reduce((s,x)=>s+x.valor,0);
  const fim=saldoInicial+recebido-pagPrev;
  const realizado=saldoInicial+recebido-pagReal;
  const hj=today(); const ate7=addDia(hj,7);
  const vencidos=itens.filter(x=>x.tipo==='pagar'&&x.status!=='Baixado'&&x.data<hj).reduce((s,x)=>s+x.valor,0);
  const prox7=itens.filter(x=>x.status!=='Baixado'&&x.data>=hj&&x.data<=ate7);
  let saldo=saldoInicial, pior={data:fluxoMes+'-01',saldo:saldoInicial};
  let rows='';
  for(let d=1;d<=mesDias(fluxoMes);d++){
    const data=`${fluxoMes}-${String(d).padStart(2,'0')}`;
    const dia=itens.filter(x=>x.data===data);
    const recDia=dia.filter(x=>x.tipo==='receber').reduce((s,x)=>s+x.valor,0);
    const pagar=dia.filter(x=>x.tipo==='pagar').reduce((s,x)=>s+x.valor,0);
    const pago=dia.filter(x=>x.tipo==='pagar'&&x.status==='Baixado').reduce((s,x)=>s+x.valor,0);
    saldo+=recDia-pagar;
    if(saldo<pior.saldo)pior={data,saldo};
    const cls=saldo<0?'fx-row-bad':(recDia||pagar)?'fx-row-good':'';
    if(recDia||pagar||data===hj){
      rows+=`<tr class="${cls}"><td class="mono">${fmtD(data)}</td><td class="tr vin">${recDia?fmt(recDia):'—'}</td><td class="tr vout">${pagar?fmt(pagar):'—'}</td><td class="tr">${pago?fmt(pago):'—'}</td><td class="tr ${saldo>=0?'vin':'vout'}">${fmt(saldo)}</td><td>${dia.length?dia.length+' item(ns)':(data===hj?'Hoje':'')}</td></tr>`;
    }
  }
  $('content').innerHTML=`<div>
    <div class="fx-top">
      <div class="fx-card">
        <div class="fx-title">Fluxo de Caixa Corrente</div>
        <div class="fx-sub">Recebidos vêm da Agenda Financeira manual. Pagamentos vêm dos Lançamentos pela data de vencimento. As vendas brutas lançadas no fechamento do mês não entram neste fluxo diário.</div>
        <div class="fx-controls">
          <button class="btn bs" onclick="setFluxoMes(-1)">‹</button><div class="fx-month">${agMesExtenso(fluxoMes)}</div><button class="btn bs" onclick="setFluxoMes(1)">›</button><button class="btn bs" onclick="fluxoHoje()">Hoje</button>
          <div class="fgi"><label class="fl">Saldo inicial do mês</label><input id="fx-saldo" class="fv" inputmode="decimal" value="${saldoInicial?fmtN(saldoInicial):''}" placeholder="0,00"></div><button class="btn bp" onclick="salvarSaldoInicialFluxo()">Salvar saldo</button>
        </div>
      </div>
      <div class="fx-card ${vencidos>0?'fx-warn':'fx-ok'}">
        <div class="fx-title">Leitura executiva</div>
        <div class="fx-sub">Vencidos em aberto: <strong class="vout">${fmt(vencidos)}</strong> · Próximos 7 dias a pagar: <strong>${fmt(prox7.reduce((s,x)=>s-x.valor,0))}</strong> · Pior saldo projetado: <strong class="${pior.saldo>=0?'vin':'vout'}">${fmt(pior.saldo)}</strong> em ${fmtD(pior.data)}</div>
      </div>
    </div>
    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(165px,1fr))">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Recebido</div><div class="kpi-v">${fmt(recebido)}</div><div class="kpi-s">Agenda manual: iFood, Crédito, Débito e Pix</div></div>
      <div class="kpi" style="--kc:var(--er)"><div class="kpi-l">Pagamento do mês</div><div class="kpi-v">${fmt(pagPrev)}</div><div class="kpi-s">Pago: ${fmt(pagReal)} · A pagar: ${fmt(abertoPagar)}</div></div>
      <div class="kpi" style="--kc:var(--wa)"><div class="kpi-l">A pagar</div><div class="kpi-v" style="color:var(--wa)">${fmt(abertoPagar)}</div><div class="kpi-s">pendente por vencimento</div></div>
      <div class="kpi" style="--kc:${fim>=0?'var(--ok)':'var(--er)'}"><div class="kpi-l">Saldo projetado</div><div class="kpi-v" style="color:${fim>=0?'var(--ok)':'var(--er)'}">${fmt(fim)}</div><div class="kpi-s">saldo inicial + recebido − pagamentos</div></div>
      <div class="kpi" style="--kc:${realizado>=0?'var(--ok)':'var(--er)'}"><div class="kpi-l">Saldo realizado</div><div class="kpi-v" style="color:${realizado>=0?'var(--ok)':'var(--er)'}">${fmt(realizado)}</div><div class="kpi-s">saldo inicial + recebido − pago</div></div>
    </div>
    <div class="tw"><table><thead><tr><th>Dia</th><th class="tr">Recebido</th><th class="tr">Pagamento</th><th class="tr">Pago</th><th class="tr">Saldo projetado</th><th>Obs.</th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="es"><div class="em">💸</div><h3>Sem fluxo nesse mês</h3><p>Inclua recebimentos manuais na Agenda Financeira ou cadastre vencimentos nos lançamentos.</p></div></td></tr>'}</tbody></table></div>
  </div>`;
}

function auditoriaPlanoSet(){ccEnsureIds();return {ids:new Set((store.centrocusto||[]).filter(c=>c.subcategoria).map(c=>ccRowSubId(c)).filter(Boolean)),pairs:new Set((store.centrocusto||[]).filter(c=>c.categoria&&c.subcategoria).map(c=>(c.categoria+'|||'+c.subcategoria).toLowerCase()))};}
function auditoriaNoPlano(r,plano){if(r.subcategoria_id&&plano.ids.has(r.subcategoria_id))return true;return plano.pairs.has((r.categoria+'|||'+r.subcategoria).toLowerCase());}
function auditoriaItens(){
  const hoje=today(); const plano=auditoriaPlanoSet(); const out=[]; const dup={};
  (store.lancamentos||[]).forEach(r=>{
    const chave=[r.rec_desp,r.data_competencia,r.data_vencimento,Math.round((+r.valor||0)*100),String(r.descricao||'').trim().toLowerCase()].join('|');
    dup[chave]=(dup[chave]||[]).concat(r);
    const faltas=[];
    if(!r.data_competencia)faltas.push('competência'); if(!r.data_vencimento)faltas.push('vencimento'); if(!r.descricao)faltas.push('descrição'); if(!r.categoria)faltas.push('categoria'); if(!r.subcategoria)faltas.push('subcategoria'); if(!r.forma_pagamento)faltas.push('forma pgto'); if(!(+r.valor>0))faltas.push('valor');
    if(faltas.length) out.push({sev:'Alta',tipo:'Campos obrigatórios ausentes',msg:`${r.descricao||r.categoria||'Lançamento sem descrição'} está sem ${faltas.join(', ')}.`,meta:[fmt(r.valor),fmtD(r.data_vencimento),r.status||'—'],id:r.id,source:'lancamento'});
    if(r.categoria&&r.subcategoria&&!auditoriaNoPlano(r,plano)) out.push({sev:'Média',tipo:'Fora do plano de contas',msg:`${r.categoria} › ${r.subcategoria} não está cadastrado no Plano de Contas atual.`,meta:[r.descricao||'—',fmt(r.valor)],id:r.id,source:'lancamento'});
    if(r.categoria==='TRANSFERÊNCIA ENTRE CONTAS' && r.rec_desp==='Contas a receber') out.push({sev:'Alta',tipo:'Transferência tratada como venda',msg:'Transferência entre contas foi encontrada como Vendas. Ela fica fora da Receita Bruta do DRE, mas precisa ser conferida para não inflar análise de caixa.',meta:[r.descricao||'—',fmt(r.valor),fmtD(r.data_competencia)],id:r.id,source:'lancamento'});
    if(!isDone(r)&&r.data_vencimento&&r.data_vencimento<hoje) out.push({sev:'Alta',tipo:'Vencido em aberto',msg:`Pagamento/recebimento vencido em ${fmtD(r.data_vencimento)} ainda está aberto.`,meta:[r.rec_desp||'—',r.descricao||'—',fmt(r.valor)],id:r.id,source:'lancamento'});
    if(r.data_competencia&&r.data_vencimento){const dc=r.data_competencia.slice(0,7),dv=r.data_vencimento.slice(0,7); if(dc!==dv) out.push({sev:'Baixa',tipo:'Competência diferente do vencimento',msg:`Competência ${mesLbl(dc)} e vencimento ${mesLbl(dv)}. Está certo se for intencional, mas deve ser conferido.`,meta:[r.descricao||'—',fmt(r.valor)],id:r.id,source:'lancamento'});}
  });
  Object.values(dup).filter(a=>a.length>1).forEach(a=>out.push({sev:'Média',tipo:'Possível duplicidade',msg:`${a.length} lançamentos parecem iguais: ${a[0].descricao||a[0].categoria||'sem descrição'}.`,meta:[fmt(a[0].valor),fmtD(a[0].data_vencimento),'IDs internos ocultos'],id:a[0].id,source:'lancamento'}));
  (store.agenda||[]).forEach(r=>{ if(!r.data||!r.descricao||!(+r.valor>0)) out.push({sev:'Média',tipo:'Agenda manual incompleta',msg:`Item manual da agenda com data, descrição ou valor faltando.`,meta:[r.descricao||'—',fmt(r.valor),fmtD(r.data)],id:r.id,source:'agenda'}); });
  return out.sort((a,b)=>({Alta:0,Média:1,Baixa:2}[a.sev]-({Alta:0,Média:1,Baixa:2}[b.sev])));
}
function rAuditoria(){

  const tipoResumo=[...new Set(all.map(x=>x.tipo))].map(t=>[t,all.filter(x=>x.tipo===t).length]).sort((a,b)=>b[1]-a[1]);
  const rows=all.slice(0,220).map(x=>{

    return `<div class="audit-item audit-click" onclick='corrigirAuditoria(${src},${xid})' title="Clique para abrir e corrigir"><h4>${x.sev==='Alta'?'🔴':x.sev==='Média'?'🟠':'🔵'} ${agEsc(x.tipo)} <span class="audit-chip ${x.sev==='Alta'?'bad':x.sev==='Média'?'warn':'ok'}">${x.sev}</span></h4><p>${agEsc(x.msg)}</p><div class="audit-meta">${(x.meta||[]).map(m=>`<span>${agEsc(m)}</span>`).join('')}</div><div class="audit-foot"><span class="audit-tip">Corrija o lançamento ou exclua quando não fizer sentido manter.</span><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn bp btn-s audit-open" onclick='event.stopPropagation();corrigirAuditoria(${src},${xid})'>✏️ ${acao}</button>${excluir}</div></div></div>`;
  }).join('');
  $('content').innerHTML=`<div>
    <div class="audit-grid">
      <div class="audit-card"><div class="audit-title">Risco alto</div><div class="kpi-v" style="color:var(--er);font-size:22px">${alt}</div><div class="audit-sub">corrigir primeiro: vencidos, transferências, campos críticos</div></div>
      <div class="audit-card"><div class="audit-title">Risco médio</div><div class="kpi-v" style="color:var(--wa);font-size:22px">${med}</div><div class="audit-sub">plano de contas, possíveis duplicidades e agenda manual</div></div>
      <div class="audit-card"><div class="audit-title">Observações</div><div class="kpi-v" style="font-size:22px">${bai}</div><div class="audit-sub">pontos que podem estar corretos, mas merecem revisão</div></div>
      <div class="audit-card"><div class="audit-title">Base auditada</div><div class="audit-sub">${store.lancamentos.length} lançamentos · ${(store.centrocusto||[]).length} itens do plano · ${(store.agenda||[]).length} manuais da agenda</div><div style="margin-top:8px">${tipoResumo.slice(0,4).map(([t,n])=>`<span class="audit-chip">${agEsc(t)}: ${n}</span>`).join('')}</div></div>
    </div>
    <div class="tb" style="margin-bottom:12px"><button class="btn bs" onclick="rAuditoria()">↻ Reanalisar</button><button class="btn bp" onclick="exportarAuditoriaCSV()">⬇️ Exportar auditoria CSV</button><span style="font-size:11px;color:var(--tx2)">Mostrando até 220 apontamentos. Corrija os altos primeiro.</span></div>
    <div class="audit-list">${rows||'<div class="es"><div class="em">✅</div><h3>Nenhum problema crítico encontrado</h3><p>Mesmo assim, faça conciliação bancária antes de decisões finais.</p></div>'}</div>
  </div>`;
}
window.corrigirAuditoria=function(source,id){
  if(source==='agenda'){
    const r=(store.agenda||[]).find(x=>x.id===id);
    if(!r){toast('Item da agenda não encontrado. Reanalise a auditoria.','er');return;}

  }
  const r=(store.lancamentos||[]).find(x=>x.id===id);

window.excluirAuditoriaLancamento=function(id){
  const r=(store.lancamentos||[]).find(x=>x.id===id);
  if(!r){toast('Lançamento não encontrado. Reanalise a auditoria.','er');return;}
  const resumo=[r.descricao||r.categoria||'Sem descrição',fmt(r.valor),fmtD(r.data_vencimento||r.data_competencia)].filter(Boolean).join(' · ');
  confirm_('Excluir lançamento',`Excluir definitivamente este lançamento?<br><br><strong>${agEsc(resumo)}</strong><br><br>Use esta opção para lançamentos sem valor, duplicados ou registros que não fazem sentido manter.`,async()=>{
    store.lancamentos=store.lancamentos.filter(x=>x.id!==id);
    rAuditoria();
    toast('Lançamento excluído. Auditoria reanalisada ✅','ok');
    try{await fbDel('lancamentos',id);lsSave();}catch(e){lsSave();}
  });
};

window.receberBackupArquivo=async function(el){
  const file=el.files&&el.files[0]; if(!file)return;
  const txt=await file.text(); let data=null; try{data=JSON.parse(txt);}catch(e){toast('Arquivo inválido','er');return;}
  if(!data.store||!data.store.lancamentos){toast('Backup não reconhecido','er');return;}
  confirm_('Importar backup JSON','Isso vai substituir a base atual no Firebase pelas informações do backup selecionado. Gere outro backup antes de continuar.',async()=>{
    const ok=prompt('Digite IMPORTAR para confirmar a substituição da base.'); if(ok!=='IMPORTAR'){toast('Importação cancelada','in');return;}
    if(!fbOk){Object.assign(store,data.store);lsSave();render(CM);toast('Backup aplicado localmente','ok');return;}
    const cols=['lancamentos','centrocusto','patrimonio','agenda_financeira','clientes_mes'];
    for(const col of cols){const snap=await db.collection(col).get(); for(let i=0;i<snap.docs.length;i+=450){const batch=db.batch();snap.docs.slice(i,i+450).forEach(d=>batch.delete(d.ref));await batch.commit();}}
    await fbBatch('lancamentos',(data.store.lancamentos||[])); await fbBatch('centrocusto',(data.store.centrocusto||[])); await fbBatch('patrimonio',(data.store.patrimonio||[])); await fbBatch('agenda_financeira',(data.store.agenda||[]));
    const batch=db.batch(); Object.entries(data.store.clientes_mes||{}).forEach(([k,v])=>batch.set(db.collection('clientes_mes').doc(k),{count:v})); await batch.commit();
    await db.collection('config').doc('main').set(data.store.cfg||{}, {merge:true}); await loadAll(); render(CM); toast('Backup importado','ok');
  });
};

window.abreBaixa=function(id){
  const r=store.lancamentos.find(x=>x.id===id);
  if(!r) return;
  const fpO=store.cfg.fps.map(f=>`<option value="${f}" ${r.forma_pagamento===f?'selected':''}>${f}</option>`).join('');
  oM('💰 Dar Baixa — '+( r.descricao||r.categoria||'Lançamento'),
  `<div style="background:var(--s2);border-radius:8px;padding:14px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
    <div><span style="color:var(--tx2);font-size:11px">CATEGORIA</span><div style="margin-top:3px">${r.categoria||'—'}</div></div>
    <div><span style="color:var(--tx2);font-size:11px">SUBCATEGORIA</span><div style="margin-top:3px">${r.subcategoria||'—'}</div></div>
    <div><span style="color:var(--tx2);font-size:11px">VENCIMENTO</span><div style="margin-top:3px;color:var(--wa)">${fmtD(r.data_vencimento)}</div></div>
    <div><span style="color:var(--tx2);font-size:11px">VALOR</span><div style="margin-top:3px;color:var(--er);font-family:'DM Mono',monospace;font-size:15px;font-weight:700">${fmt(r.valor)}</div></div>
    <div style="grid-column:1/-1"><span style="color:var(--tx2);font-size:11px">DESCRIÇÃO</span><div style="margin-top:3px">${r.descricao||'—'}</div></div>
  </div>
  <div class="fg">
    <div class="fgi"><label class="fl">Data de Efetivação <span class="rq">*</span></label>
      <input id="bx-de" type="date" class="fv" value="${today()}"></div>
    <div class="fgi"><label class="fl">Forma de Pagamento</label>
      <select id="bx-fp" class="fv"><option value="">— Selecione —</option>${fpO}</select></div>
    <div class="fgi full"><label class="fl">Observação</label>
      <input id="bx-obs" type="text" class="fv" value="${r.descricao||''}" placeholder="Confirmar ou alterar descrição"></div>
  </div>`,
  `<button class="btn bs" onclick="cM()">Cancelar</button>
   <button class="btn bp" onclick="confirmarBaixa('${id}')">✅ Confirmar Baixa</button>`);
};

// Delegação de click para cards vencidos (gerados dinamicamente)
document.addEventListener('click', function(e){
  const item = e.target.closest('.vencido-item');
  if(item) abreBaixa(item.dataset.id);
});

window.confirmarBaixa=async function(id){
  const de=$('bx-de').value;
  if(!de){toast('Informe a data de efetivação','er');return;}
  const i=store.lancamentos.findIndex(x=>x.id===id);
  if(i>=0){
    store.lancamentos[i].status='Concluído';
    store.lancamentos[i].data_efetivacao=de;
    store.lancamentos[i].forma_pagamento=$('bx-fp').value||store.lancamentos[i].forma_pagamento;
    store.lancamentos[i].descricao=$('bx-obs').value.trim()||store.lancamentos[i].descricao;
  }
  // Fechar e atualizar tela IMEDIATAMENTE — não espera o Firebase
  cM();
  render(CM);
  toast('Baixa realizada! ✅','ok');
  // Salvar no Firebase em segundo plano
  try {
    const updated = store.lancamentos.find(x=>x.id===id);
    if(updated) await fbSet('lancamentos', id, updated);
    lsSave();
  } catch(e) {
    console.warn('Erro ao salvar baixa no Firebase:', e.message);
    lsSave();
  }
};

window.selRow=function(tr,id){
  // Seleção visual apenas. Removido scrollIntoView e baixa automática para não travar nem puxar a tabela para a esquerda.
  document.querySelectorAll('.tw tbody tr.sel').forEach(r=>r.classList.remove('sel'));
  if(tr) tr.classList.add('sel');
};

// AGENDA FINANCEIRA — recebimentos manuais + pagamentos automáticos dos lançamentos
// ══════════════════════════════════════════════
let agendaMes=today().slice(0,7);
let agHideBaixados=false;
const agTipoLbl=t=>t==='pagar'?'Pagamento':'Recebimento';
const agTipoClass=t=>t==='pagar'?'pag':'rec';
const agPagoLbl=t=>t==='pagar'?'Pago':'Recebido';
const agAbertoLbl=t=>t==='pagar'?'A pagar':'Recebido';
function agAddMes(m,delta){const d=new Date(m+'-01T12:00:00');d.setMonth(d.getMonth()+delta);return d.toISOString().slice(0,7);}
function agMesExtenso(m){const d=new Date(m+'-01T12:00:00');const s=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);}
function agEsc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function agLancData(r){return r.data_vencimento||r.data_competencia||r.data_efetivacao||'';}
function agSort(a,b){return (a.data||'').localeCompare(b.data||'') || (a.tipo||'').localeCompare(b.tipo||'') || (a.descricao||'').localeCompare(b.descricao||'');}
function agSum(arr,fn){return arr.filter(fn).reduce((s,x)=>s+(+x.valor||0),0);}
function agManualMesItems(mes=agendaMes){
  return (store.agenda||[]).filter(r=>(r.data||'').startsWith(mes)&&(r.tipo||'receber')!=='pagar').map(r=>({
    ...r,
    id:r.id,
    source:'manual',
    tipo:'receber',
    descricao:r.origem||r.forma||r.descricao||'Recebimento manual',
    forma:r.origem||r.forma||'',
    status:'Baixado',
    valor:+r.valor||0,
    origem:'Manual'
  })).sort(agSort);
}
function agLancMesItems(mes=agendaMes){
  return (store.lancamentos||[]).filter(r=>r.rec_desp!=='Contas a receber'&&agLancData(r).startsWith(mes)).map(r=>({
    id:'l_'+r.id,
    lancId:r.id,
    source:'lancamento',
    tipo:'pagar',
    data:agLancData(r),
    descricao:r.descricao||r.categoria||'Lançamento',
    valor:+r.valor||0,
    status:r.status==='Concluído'?'Baixado':'Aberto',
    forma:r.forma_pagamento||'',
    conta:r.instituicao||'',
    categoria:r.categoria||'',
    subcategoria:r.subcategoria||'',
    data_baixa:r.data_efetivacao||'',
    origem:'Automático · Lançamentos'
  })).filter(x=>x.data).sort(agSort);
}
function agAllMesItems(mes=agendaMes){return [...agManualMesItems(mes),...agLancMesItems(mes)].sort(agSort);}
function agMesItems(){const all=agAllMesItems();return agHideBaixados?all.filter(x=>x.status!=='Baixado'):all;}
window.agSetMes=function(delta){agendaMes=agAddMes(agendaMes,delta);rAgenda();};
window.agHoje=function(){agendaMes=today().slice(0,7);rAgenda();};
window.agToggleBaixados=function(){agHideBaixados=!agHideBaixados;rAgenda();};

function agendaForm(r={},presetTipo='',presetData=''){
  const data=r.data||presetData||today();
  const origem=(r.origem||r.forma||r.descricao||'').trim();
  const origens=['iFood','Crédito','Débito','Pix'];
  return `<div class="fg">
    <div class="fgi">
      <label class="fl">Data do recebimento <span class="rq">*</span></label>

    </div>
    <div class="fgi full">
      <label class="fl">Origem <span class="rq">*</span></label>
      <div class="ag-origin-grid">
        ${origens.map((x,i)=>`<input type="radio" name="ag-origem" id="ag-origem-${i}" value="${agEsc(x)}" ${origem===x||(!origem&&i===0)?'checked':''}><label class="ag-origin-card" for="ag-origem-${i}">${agEsc(x)}</label>`).join('')}

function getAgendaD(){

  return{

window.nAgenda=function(tipo='receber',data=''){
  oM('Novo recebimento manual',agendaForm({},'receber',data),`<button class="btn bs" onclick="cM()">Cancelar</button><button class="btn bp" onclick="svAgenda(null)">💾 Salvar recebimento</button>`,true);
};
window.eAgenda=function(id){const r=(store.agenda||[]).find(x=>x.id===id);if(!r)return;oM('Editar recebimento manual',agendaForm(r),`<button class="btn bs" onclick="cM()">Cancelar</button><button class="btn bp" onclick="svAgenda('${id}')">💾 Atualizar</button>`,true);};
window.svAgenda=async function(id){
  const d=getAgendaD();
  if(!d.data||!d.origem||!d.valor){toast('Preencha data, origem e valor','er');return;}
  if(id){
    const i=store.agenda.findIndex(x=>x.id===id);
    if(i>=0) store.agenda[i]={...store.agenda[i],...d};
    cM(); if(CM==='auditoria') rAuditoria(); else rAgenda(); toast('Agenda atualizada! ✅','ok');
    try{await fbSet('agenda_financeira',id,{...d});lsSave();}catch(e){lsSave();}
  }else{
    const nid=uid();
    const item={id:nid,...d,criado_em:new Date().toISOString()};
    store.agenda.push(item);agendaMes=d.data.slice(0,7);
    cM(); if(CM==='auditoria') rAuditoria(); else rAgenda(); toast('Item manual incluído na agenda! ✅','ok');
    try{await fbSet('agenda_financeira',nid,{...item});lsSave();}catch(e){lsSave();}
  }
};
window.dAgenda=function(id){
  const r=(store.agenda||[]).find(x=>x.id===id);if(!r)return;
  confirm_('Excluir item manual da agenda',`Excluir ${r.descricao||'este item'} de ${fmtD(r.data)}?`,async()=>{
    store.agenda=store.agenda.filter(x=>x.id!==id); if(CM==='auditoria') rAuditoria(); else rAgenda(); toast('Item manual excluído','ok');
    try{await fbDel('agenda_financeira',id);lsSave();}catch(e){lsSave();}
  });
};
window.baixaAgenda=function(id){
  const r=(store.agenda||[]).find(x=>x.id===id);if(!r)return;
  const novo=r.status==='Baixado'?'Aberto':'Baixado';
  r.status=novo;r.data_baixa=novo==='Baixado'?today():null;
  rAgenda();toast(novo==='Baixado'?'Baixado! ✅':'Voltou para aberto','ok');
  try{fbSet('agenda_financeira',id,{...r}).then(lsSave).catch(lsSave);}catch(e){lsSave();}
};
window.baixaLancAgenda=function(id){
  const r=(store.lancamentos||[]).find(x=>x.id===id);if(!r)return;
  if(r.status==='Concluído'){toast('Este lançamento já está pago/baixado','in');return;}
  abreBaixa(id);
};
window.estornarLancAgenda=function(id){
  const r=(store.lancamentos||[]).find(x=>x.id===id);if(!r)return;
  confirm_('Voltar lançamento para aberto',`Voltar "${r.descricao||r.categoria||'lançamento'}" para Pendente?`,async()=>{
    r.status='Pendente';
    r.data_efetivacao=null;
    rAgenda();toast('Lançamento voltou para aberto','ok');
    try{await fbSet('lancamentos',id,{...r});lsSave();}catch(e){lsSave();}
  });
};
window.baixaAgendaDia=function(data){
  const manuais=(store.agenda||[]).filter(x=>x.data===data&&x.status!=='Baixado');
  const lancs=(store.lancamentos||[]).filter(x=>agLancData(x)===data&&x.status!=='Concluído');
  const total=manuais.length+lancs.length;
  if(!total){toast('Não há itens em aberto nesse dia','in');return;}
  confirm_('Baixar dia inteiro',`Marcar ${total} item(ns) de ${fmtD(data)} como baixado/pago?`,async()=>{
    manuais.forEach(x=>{x.status='Baixado';x.data_baixa=today();});
    lancs.forEach(x=>{x.status='Concluído';x.data_efetivacao=today();});
    rAgenda();toast('Dia baixado! ✅','ok');
    try{
      for(const x of manuais){await fbSet('agenda_financeira',x.id,{...x});}
      for(const x of lancs){await fbSet('lancamentos',x.id,{...x});}
      lsSave();
    }catch(e){lsSave();}
  });
};
window.limparAgendaMesBaixados=function(){
  const itens=agManualMesItems().filter(x=>x.status==='Baixado');
  if(!itens.length){toast('Não há baixados manuais para apagar neste mês','in');return;}
  confirm_('Apagar baixados manuais do mês',`Vai apagar ${itens.length} item(ns) manual(is) já baixado(s) de ${agMesExtenso(agendaMes)}. Lançamentos automáticos continuam preservados.`,async()=>{
    const ids=new Set(itens.map(x=>x.id));store.agenda=store.agenda.filter(x=>!ids.has(x.id));rAgenda();toast('Baixados manuais apagados ✅','ok');
    try{for(const x of itens){await fbDel('agenda_financeira',x.id);}lsSave();}catch(e){lsSave();}
  });
};
window.excluirAgendaMes=function(){
  const itens=agManualMesItems();
  if(!itens.length){toast('Mês sem itens manuais','in');return;}
  confirm_('Excluir agenda manual do mês',`Vai apagar TODOS os ${itens.length} item(ns) manuais de ${agMesExtenso(agendaMes)}. Os pagamentos automáticos dos lançamentos não serão apagados.`,async()=>{
    const ids=new Set(itens.map(x=>x.id));store.agenda=store.agenda.filter(x=>!ids.has(x.id));rAgenda();toast('Mês manual apagado da agenda','ok');
    try{for(const x of itens){await fbDel('agenda_financeira',x.id);}lsSave();}catch(e){lsSave();}
  });
};

function agActions(x){
  if(x.source==='lancamento'){
    return `<button class="btn bs btn-s btn-i" title="${x.status==='Baixado'?'Voltar para aberto':'Dar baixa'}" onclick="${x.status==='Baixado'?`estornarLancAgenda('${x.lancId}')`:`baixaLancAgenda('${x.lancId}')`}">${x.status==='Baixado'?'↩️':'✅'}</button>
      <button class="btn bs btn-s btn-i" title="Editar lançamento" onclick="eL('${x.lancId}')">✏️</button>`;
  }
  return `<button class="btn bs btn-s btn-i" title="Editar recebimento" onclick="eAgenda('${x.id}')">✏️</button>
    <button class="btn bd2 btn-s btn-i" title="Excluir" onclick="dAgenda('${x.id}')">🗑️</button>`;
}
function agRow(x){
  const src=x.source==='lancamento'?'Automático · Lançamentos':'Manual · Agenda';

  return `<div class="ag-item">

    <div class="ra hide-sm">${agActions(x)}</div>
  </div>`;
}
function agSection(title,sub,items,emptyIcon='📭'){
  const total=items.reduce((s,x)=>s+(+x.valor||0),0);
  return `<div class="ag-list" style="margin-top:12px">
    <div class="ag-list-head"><div class="sh" style="margin:0">${title} <span>${items.length} item(ns)</span></div><div class="ag-muted">Total: ${fmt(total)} ${sub?`· ${sub}`:''}</div></div>
    ${items.length?items.map(agRow).join(''):`<div class="es"><div class="em">${emptyIcon}</div><h3>Nenhum item</h3><p>Não há valores nesta seção para o mês selecionado.</p></div>`}
  </div>`;
}

window.verAgendaDia=function(data){
  const itens=agAllMesItems().filter(x=>x.data===data).sort(agSort);
  const rec=agSum(itens,x=>x.tipo!=='pagar');
  const pag=agSum(itens,x=>x.tipo==='pagar');
  const pago=agSum(itens,x=>x.tipo==='pagar'&&x.status==='Baixado');
  const aPagar=agSum(itens,x=>x.tipo==='pagar'&&x.status!=='Baixado');
  const aberto=itens.filter(x=>x.status!=='Baixado');
  const rows=itens.map(x=>`<div class="ag-detail-row">
    <div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap"><span class="ag-pill ${agTipoClass(x.tipo)}">${agTipoLbl(x.tipo)}</span><span class="ag-pill ${x.source==='lancamento'?'open':'done'}">${x.source==='lancamento'?'Automático':'Manual'}</span><strong>${agEsc(x.descricao)}</strong></div>
      <div class="ag-muted">${agEsc([x.forma||'—',x.categoria||'',x.subcategoria||'',x.conta||'',x.obs||''].filter(Boolean).join(' · '))}</div>
    </div>
    <div class="tr ${x.tipo==='pagar'?'vout':'vin'}">${x.tipo==='pagar'?'−':'+'} ${fmtN(x.valor)}</div>
    <div><span class="ag-pill ${x.status==='Baixado'?'done':'open'}">${x.status==='Baixado'?agPagoLbl(x.tipo):agAbertoLbl(x.tipo)}</span></div>
    <div class="ra">${agActions(x)}</div>
  </div>`).join('');
  oM('Agenda de '+fmtD(data),`<div class="ag-day-detail">
    <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:2px">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Recebimento no dia</div><div class="kpi-v">${fmt(rec)}</div></div>
      <div class="kpi" style="--kc:var(--er)"><div class="kpi-l">Pagamento no dia</div><div class="kpi-v">${fmt(pag)}</div></div>
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Pago no dia</div><div class="kpi-v">${fmt(pago)}</div></div>
      <div class="kpi" style="--kc:var(--wa)"><div class="kpi-l">A pagar no dia</div><div class="kpi-v" style="color:var(--wa)">${fmt(aPagar)}</div></div>

  </div>`, `<button class="btn bs" onclick="nAgenda('receber','${data}')">＋ Receber manual</button>${aberto.length?`<button class="btn bp" onclick="baixaAgendaDia('${data}')">✅ Baixar dia</button>`:''}<button class="btn bs" onclick="cM()">Fechar</button>`, true);
};

function rAgenda(){
  store.agenda=store.agenda||[];
  const todos=agAllMesItems();
  const itens=agMesItems();
  const rec=agSum(todos,x=>x.tipo!=='pagar');
  const pag=agSum(todos,x=>x.tipo==='pagar');
  const recAberto=agSum(todos,x=>x.tipo!=='pagar'&&x.status!=='Baixado');
  const recBaixado=agSum(todos,x=>x.tipo!=='pagar'&&x.status==='Baixado');
  const pagAberto=agSum(todos,x=>x.tipo==='pagar'&&x.status!=='Baixado');
  const pagBaixado=agSum(todos,x=>x.tipo==='pagar'&&x.status==='Baixado');
  const autoPag=agLancMesItems().filter(x=>x.tipo==='pagar').length;
  const manualCount=agManualMesItems().length;
  const y=+agendaMes.slice(0,4),m=+agendaMes.slice(5,7);
  const first=new Date(`${agendaMes}-01T12:00:00`);
  const lastDay=new Date(y,m,0).getDate();
  const pad=(first.getDay()+6)%7;
  const totalCells=Math.ceil((pad+lastDay)/7)*7;
  let cells='';
  for(let i=0;i<totalCells;i++){
    const dia=i-pad+1;
    if(dia<1||dia>lastDay){cells+='<div class="ag-day empty"></div>';continue;}
    const data=`${agendaMes}-${String(dia).padStart(2,'0')}`;
    const dsAll=todos.filter(x=>x.data===data);
    const ds=itens.filter(x=>x.data===data);
    const dr=ds.filter(x=>x.tipo!=='pagar');
    const dp=ds.filter(x=>x.tipo==='pagar');
    const drA=agSum(ds,x=>x.tipo!=='pagar'&&x.status!=='Baixado');
    const dpA=agSum(ds,x=>x.tipo==='pagar'&&x.status!=='Baixado');
    const dpB=agSum(ds,x=>x.tipo==='pagar'&&x.status==='Baixado');
    const recDia=agSum(ds,x=>x.tipo!=='pagar');
    const pagDia=agSum(ds,x=>x.tipo==='pagar');
    const saldoA=drA-dpA;
    const allDone=dsAll.length&&dsAll.every(x=>x.status==='Baixado');
    const cls=ds.length?(dr.length&&dp.length?'mix':dr.length?'rec':'pag'):'';
    cells+=`<div class="ag-day ${ds.length?'has':''} ${cls} ${allDone?'done':''} ${data===today()?'today':''}" onclick="verAgendaDia('${data}')">
      <div class="ag-num"><span>${dia}</span>${allDone?'<span class="ag-check">✓</span>':''}</div>
      ${ds.length?`<div class="ag-total ${saldoA>0?'pos':saldoA<0?'neg':'zero'}">${fmt(saldoA)}</div>
      <div class="ag-lines">
        ${recDia?`<div class="ag-line"><span>Recebimento</span><strong class="vin">${fmtN(recDia)}</strong></div>`:''}
        ${pagDia?`<div class="ag-line"><span>Pagamento</span><strong class="vout">${fmtN(pagDia)}</strong></div>`:''}
        ${dpA?`<div class="ag-line"><span>A pagar</span><strong class="vout">${fmtN(dpA)}</strong></div>`:''}
        ${dpB?`<div class="ag-line"><span>Pago</span><strong class="vin">${fmtN(dpB)}</strong></div>`:''}
      </div>`:'<div class="ag-muted" style="margin-top:auto">Clique para incluir</div>'}
    </div>`;
  }
  const aPagar=todos.filter(x=>x.tipo==='pagar'&&x.status!=='Baixado').sort(agSort);
  const pagos=todos.filter(x=>x.tipo==='pagar'&&x.status==='Baixado').sort(agSort);
  const recebimentos=todos.filter(x=>x.tipo!=='pagar').sort(agSort);

  $('content').innerHTML=`<div class="ag-shell">
    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(185px,1fr))">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Recebimento do mês</div><div class="kpi-v">${fmt(rec)}</div><div class="kpi-s">Recebido: ${fmt(recBaixado)} · Aberto: ${fmt(recAberto)}</div></div>
      <div class="kpi" style="--kc:var(--er)"><div class="kpi-l">Total pagamento do mês</div><div class="kpi-v">${fmt(pag)}</div><div class="kpi-s">Automático dos lançamentos: ${autoPag} item(ns)</div></div>
      <div class="kpi" style="--kc:var(--wa)"><div class="kpi-l">A pagar</div><div class="kpi-v" style="color:var(--wa)">${fmt(pagAberto)}</div><div class="kpi-s">Pendentes por vencimento</div></div>
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Pago</div><div class="kpi-v">${fmt(pagBaixado)}</div><div class="kpi-s">Lançamentos concluídos + manuais baixados</div></div>
      <div class="kpi" style="--kc:${rec-pag>=0?'var(--ok)':'var(--er)'}"><div class="kpi-l">Saldo previsto</div><div class="kpi-v" style="color:${rec-pag>=0?'var(--ok)':'var(--er)'}">${fmt(rec-pag)}</div><div class="kpi-s">Recebimento − pagamento</div></div>
      <div class="kpi" style="--kc:${recAberto-pagAberto>=0?'var(--ok)':'var(--er)'}"><div class="kpi-l">Fluxo aberto</div><div class="kpi-v" style="color:${recAberto-pagAberto>=0?'var(--ok)':'var(--er)'}">${fmt(recAberto-pagAberto)}</div><div class="kpi-s">Receber aberto − pagar aberto</div></div>
    </div>
    <div class="ag-top">
      <div class="ag-title"><button class="ag-navbtn" onclick="agSetMes(-1)">‹</button><span>${agMesExtenso(agendaMes)}</span><button class="ag-navbtn" onclick="agSetMes(1)">›</button></div>
      <div class="ag-actions">
        <button class="btn bs" onclick="agHoje()">Hoje</button>
        <button class="btn bs" onclick="agToggleBaixados()">${agHideBaixados?'👁️ Mostrar pagos':'🙈 Ocultar pagos'}</button>
        <button class="btn bp" onclick="nAgenda('receber')">＋ Recebimento manual</button>
        <button class="btn bpu" onclick="limparAgendaMesBaixados()">🧹 Apagar baixados manuais</button>
        <button class="btn bd2" onclick="excluirAgendaMes()">🗑️ Excluir manuais do mês</button>
      </div>
    </div>
    <div style="font-size:11px;color:var(--tx2);margin:-6px 0 10px 2px">Pagamentos aparecem automaticamente pelos <strong>Lançamentos</strong> na <strong>data de vencimento</strong>. Recebimentos manuais ficam apenas na Agenda/Fluxo e não criam lançamento.</div>
    <div class="ag-cal">
      <div class="ag-week">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(d=>`<div class="ag-dow">${d}</div>`).join('')}</div>
      <div class="ag-grid">${cells}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;color:var(--tx2);font-size:11px">
        <span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(34,197,94,.22);margin-right:5px"></i>Recebimentos</span>
        <span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(239,68,68,.22);margin-right:5px"></i>Pagamentos</span>
        <span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;border:2px solid var(--acc);margin-right:5px"></i>Hoje</span>
        <span>✅ todos os itens do dia baixados</span>
        <span>${manualCount} manual(is) no mês</span>
      </div>
    </div>
    ${agSection('A pagar do mês','pendente',aPagar,'⏳')}
    ${!agHideBaixados?agSection('Pagos no mês','já baixados',pagos,'✅'):''}
    ${agSection('Recebimentos do mês','recebimentos manuais',recebimentos,'💰')}
  </div>`;
}

window.render=function(m){
  CM=m;window.debouncR=()=>{clearTimeout(DT);DT=setTimeout(()=>render(m),230);};
  // Evita que atualizações em tempo real recriem a tela enquanto alguém está digitando Clientes Atendidos.
  if(m==='visaogeral' && clienteInputAtivo()) return;
  buildMonthNav();
  ({visaogeral:rVG,dashboard:rDash,lancamentos:rLanc,agenda:rAgenda,fluxocaixa:rFluxo,dre:rDRE,auditoria:rAuditoria,bi:rBI,centrocusto:rCC,patrimonio:rPat,config:rCfg}[m]||rVG)();
};

// ── INIT ────────────────────────────────────────────────
(async function(){
  initFirebase();
  let ok=false;
  if(fbOk){
    ok = await loadAll();
  } else {
    ok = lsLoad();
    setStatus(ok?'● '+store.lancamentos.length+' lanç. | local':'● local sem dados','var(--wa)');
  }
  if(!ok && !(store.lancamentos||[]).length){
    $('content').innerHTML=`<div class="es"><div class="em">⚠️</div><h3>Firebase indisponível</h3><p>Não foi importado seed antigo. Aguarde a quota voltar ou abra em um computador que já tenha cache local.</p></div>`;
    return;
  }
  render('visaogeral');
})();
</script>
</body>
</html>
