<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Financeiro — Burger do Rei</title>

<!-- Identidade leve sem PWA pesado -->
<meta name="theme-color" content="#0c0e14">
<meta name="description" content="Sistema financeiro Burger do Rei">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e14;--s1:#131620;--s2:#1a1f2e;--s3:#222840;
  --bd:#252b3b;--bd2:#2e3650;
  --acc:#f97316;--acc2:#fb923c;--acc3:rgba(249,115,22,.12);
  --ok:#22c55e;--ok2:rgba(34,197,94,.12);
  --er:#ef4444;--er2:rgba(239,68,68,.12);
  --wa:#eab308;--wa2:rgba(234,179,8,.12);
  --in:#3b82f6;--in2:rgba(59,130,246,.12);
  --pu:#a855f7;--pu2:rgba(168,85,247,.12);
  --tx:#e2e8f0;--tx2:#7d8ba8;--tx3:#3f4a63;
  --r:10px;--sw:218px;--hh:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
#app{display:flex;height:100vh}

/* SIDEBAR */
#sb{width:var(--sw);min-width:var(--sw);background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:width .22s ease;z-index:20;overflow:hidden}
#sb.col{width:52px;min-width:52px}
.sb-logo{height:var(--hh);display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-ico{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#c2410c);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;letter-spacing:-1px}
.sb-nm{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;white-space:nowrap;transition:opacity .15s}
#sb.col .sb-nm{opacity:0;pointer-events:none}
#sb.col #sb-logo-img{height:28px}
.sb-sec{padding:10px 8px 3px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;white-space:nowrap;overflow:hidden;flex-shrink:0;transition:opacity .15s}
#sb.col .sb-sec{opacity:0}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:1px 5px;border-radius:8px;cursor:pointer;transition:background .12s;white-space:nowrap;overflow:hidden;flex-shrink:0}
.ni:hover{background:var(--s2)}.ni.act{background:var(--acc3);color:var(--acc)}
.ni .ic{font-size:14px;flex-shrink:0;width:20px;text-align:center}
.ni .lb{font-size:13px;font-weight:500;transition:opacity .15s;overflow:hidden;text-overflow:ellipsis}
#sb.col .lb{opacity:0;pointer-events:none}
.sb-tog{margin-top:auto;height:42px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--bd);cursor:pointer;color:var(--tx2);font-size:15px;transition:color .12s;flex-shrink:0}
.sb-tog:hover{color:var(--acc)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:var(--hh);min-height:var(--hh);background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0}
#topbar h1{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;flex:1}
.chip{background:var(--s2);border:1px solid var(--bd);padding:3px 9px;border-radius:20px;font-size:11px;color:var(--tx2);font-family:'DM Mono',monospace}

/* MONTH TABS */
#month-nav{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 18px;display:none;flex-shrink:0;overflow-x:auto}
#month-nav.show{display:flex;align-items:center;gap:2px}
.yr-group{display:flex;align-items:center;gap:2px;flex-shrink:0;padding:6px 0}
.yr-lbl{font-size:11px;font-weight:600;color:var(--tx3);padding:0 6px;flex-shrink:0}
.m-tab{padding:4px 10px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;color:var(--tx2);transition:all .12s;flex-shrink:0;border:1px solid transparent}
.m-tab:hover{color:var(--tx);background:var(--s2)}
.m-tab.act{background:var(--acc3);color:var(--acc);border-color:rgba(249,115,22,.3)}
.m-tab.all{background:var(--s2);color:var(--tx2)}
.m-tab.all.act{background:var(--acc3);color:var(--acc)}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:16px 18px}

/* KPIS */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--acc))}
.kpi-l{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--tx2);text-transform:uppercase;margin-bottom:4px}
.kpi-v{font-family:'Syne',sans-serif;font-weight:700;font-size:19px}
.kpi-s{font-size:11px;color:var(--tx3);margin-top:2px}

/* TOOLBAR */
.tb{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:9px 11px;display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.sw-wrap{position:relative;flex:1;min-width:140px}
.sw-wrap input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:7px 9px 7px 29px;color:var(--tx);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.sw-wrap input:focus{border-color:var(--acc)}
.sw-wrap .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:13px}
select.fc,input.fc{background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;color:var(--tx);font-size:13px;outline:none;font-family:inherit;cursor:pointer;transition:border-color .15s}
select.fc:focus,input.fc:focus{border-color:var(--acc)}
.mf{position:relative;min-width:148px}
.mf summary{list-style:none;background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;color:var(--tx);font-size:13px;cursor:pointer;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.mf summary::-webkit-details-marker{display:none}
.mf[open] summary{border-color:var(--acc)}
.mf-menu{position:absolute;z-index:50;top:38px;left:0;background:var(--s1);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);padding:8px;min-width:220px;max-height:270px;overflow:auto}
.mf-menu label{display:flex;gap:7px;align-items:center;padding:6px 5px;font-size:12px;color:var(--tx2);border-radius:6px;cursor:pointer}
.mf-menu label:hover{background:var(--s2);color:var(--tx)}
.mf-actions{display:flex;gap:6px;padding:6px 4px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.mf-actions button{font-size:10px;padding:4px 6px}
.lim-note{font-size:11px;color:var(--wa);margin-top:8px;text-align:right}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;border:none;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .12s;white-space:nowrap}
.bp{background:var(--acc);color:#fff}.bp:hover{background:var(--acc2)}
.bs{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}.bs:hover{border-color:var(--acc);color:var(--acc)}
.bd2{background:var(--er2);color:var(--er);border:1px solid rgba(239,68,68,.2)}.bd2:hover{background:rgba(239,68,68,.25)}
.bpu{background:var(--pu2);color:var(--pu);border:1px solid rgba(168,85,247,.2)}
.btn-s{padding:5px 9px;font-size:12px}.btn-i{padding:5px;width:28px;height:28px;justify-content:center}

/* TABLE */
.tw{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.tw table{width:100%;border-collapse:collapse}
.tw thead tr{background:var(--s2);border-bottom:1px solid var(--bd)}
.tw th{padding:8px 11px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--tx2);text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none}
.tw th:hover{color:var(--tx)}.tw th.srt{color:var(--acc)}
.tw td{padding:8px 11px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle}
.tw tr:last-child td{border-bottom:none}
.tw tbody tr:hover{background:rgba(255,255,255,.022)}
.tw tbody tr.sel{background:rgba(249,115,22,.1);outline:1px solid rgba(249,115,22,.35);outline-offset:-1px}
.tw tbody tr.sel:hover{background:rgba(249,115,22,.14)}
.tw tbody tr.sel td{color:var(--tx)}
.vencido-item:hover{background:rgba(239,68,68,.08)!important}
.pend-item:hover{background:rgba(249,115,22,.06)!important}
.tr{text-align:right}.tc{text-align:center}
.mono{font-family:'DM Mono',monospace}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* BADGES */
.bg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bgreen{background:var(--ok2);color:var(--ok)}.bred{background:var(--er2);color:var(--er)}
.byel{background:var(--wa2);color:var(--wa)}.bblue{background:var(--in2);color:var(--in)}
.bgray{background:var(--s2);color:var(--tx2)}.borange{background:var(--acc3);color:var(--acc)}
.bpu2{background:var(--pu2);color:var(--pu)}

.vin{color:var(--ok);font-family:'DM Mono',monospace}
.vout{color:var(--er);font-family:'DM Mono',monospace}

/* MODAL */
.mb{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mb.op{display:flex;animation:fi .15s ease}
@keyframes fi{from{opacity:0}}
.mo{background:var(--s1);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:580px;max-height:92vh;display:flex;flex-direction:column;animation:su .18s ease}
.mo-lg{max-width:720px}
@keyframes su{from{transform:translateY(16px);opacity:0}}
.mh{padding:15px 17px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:9px}
.mt{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;flex:1}
.mbody{padding:17px;overflow-y:auto;flex:1}
.mf{padding:11px 17px;border-top:1px solid var(--bd);display:flex;gap:7px;justify-content:flex-end}

/* FORM */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fgi{display:flex;flex-direction:column;gap:4px}
.fgi.full{grid-column:1/-1}
.fl{font-size:11px;font-weight:600;color:var(--tx2);letter-spacing:.04em}
.fl .rq{color:var(--acc)}
.fv{background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;color:var(--tx);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.fv:focus{border-color:var(--acc)}
.fv::placeholder{color:var(--tx3)}
select.fv option{background:var(--s1)}
.fv-hint{font-size:11px;color:var(--tx3);margin-top:2px}
hr.fsep{border:none;border-top:1px solid var(--bd);grid-column:1/-1;margin:2px 0}

/* CONFIRM */
#cfbg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center}
#cfbg.op{display:flex}
#cfbox{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:22px 20px;max-width:320px;width:90%;text-align:center}
#cfbox h3{font-family:'Syne',sans-serif;font-size:14px;margin-bottom:7px}
#cfbox p{color:var(--tx2);font-size:12px;margin-bottom:16px}
.cfb{display:flex;gap:8px;justify-content:center}

/* TOAST */
#ta{position:fixed;bottom:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:6px}
.tos{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:10px 13px;display:flex;align-items:center;gap:8px;font-size:13px;min-width:210px;max-width:290px;animation:ti .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tos.rem{animation:to .2s ease forwards}
@keyframes ti{from{transform:translateX(14px);opacity:0}}
@keyframes to{to{transform:translateX(14px);opacity:0}}
.tos-ok{border-left:3px solid var(--ok)}.tos-er{border-left:3px solid var(--er)}.tos-in{border-left:3px solid var(--in)}

/* CHARTS */
.bi-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.bi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.bi-grid.g3{grid-template-columns:1fr 1fr 1fr}
.bi-card.full{grid-column:1/-1}
.sh{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.sh span{color:var(--tx2);font-size:11px;font-weight:400;font-family:'DM Sans',sans-serif}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.bar-lbl{font-size:11px;width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-wrap{flex:1;height:13px;background:var(--s2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s}
.bar-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx2);width:88px;text-align:right;flex-shrink:0}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.chart-area{height:120px;display:flex;align-items:flex-end;gap:2px;position:relative}
.chart-b{border-radius:3px 3px 0 0;opacity:.85;cursor:default;min-width:7px;transition:opacity .15s}
.chart-b:hover{opacity:1}

/* DRE */
.dre-t{width:100%;border-collapse:collapse;font-size:12px}
.dre-t td,.dre-t th{padding:5px 10px;border-bottom:1px solid var(--bd)}
.dre-t thead th{background:var(--s2);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx2);text-align:right;white-space:nowrap}
.dre-t thead th:first-child{text-align:left;position:sticky;left:0;background:var(--s2);min-width:200px}
.dre-t td:first-child{position:sticky;left:0;background:var(--s1);z-index:1}
.dre-cat td{font-weight:600;color:var(--tx);background:var(--s2)}
.dre-cat td:first-child{background:var(--s2)}
.dre-sub td{color:var(--tx2);padding-left:22px;font-size:11px}
.dre-sub td:first-child{background:var(--s1)}
.dre-tot{font-weight:700}
.dre-tot td{background:rgba(249,115,22,.06);color:var(--acc);border-top:2px solid var(--bd2)}
.dre-tot td:first-child{background:rgba(249,115,22,.06)}
.dre-sep td{height:6px;background:var(--bg);border:none}
.dre-hi td{background:rgba(34,197,94,.06);color:var(--ok);font-weight:700;border-top:2px solid var(--bd2)}
.dre-hi td:first-child{background:rgba(34,197,94,.06)}
.dre-bk td{background:rgba(59,130,246,.06);color:var(--in);font-weight:600}
.dre-bk td:first-child{background:rgba(59,130,246,.06)}
.dv{text-align:right;font-family:'DM Mono',monospace}
.dp{color:var(--ok)}.dn{color:var(--er)}.dc{color:var(--tx2);font-size:11px}

/* VISÃO GERAL */
.vg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.vg-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:15px}
.vg-card.span2{grid-column:span 2}
.input-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.input-row label{flex:1;font-size:12px;color:var(--tx2)}
.input-row input{width:100px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;color:var(--tx);font-size:12px;font-family:'DM Mono',monospace;outline:none;text-align:right}
.input-row input:focus{border-color:var(--acc)}

/* PAGINATION */
.pag{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:9px}
.pb{width:27px;height:27px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--bd);color:var(--tx2);font-size:12px;cursor:pointer;transition:all .12s}
.pb:hover,.pb.act{border-color:var(--acc);color:var(--acc)}
.pi{font-size:11px;color:var(--tx2);margin:0 4px}

.es{text-align:center;padding:45px 20px;color:var(--tx3)}
.es .em{font-size:30px;margin-bottom:8px}
.es h3{color:var(--tx2);font-size:13px;margin-bottom:4px}
.ra{display:flex;gap:3px;justify-content:flex-end}


/* PRODUTOS VENDIDOS */
.prod-note{border:1px solid var(--bd);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border-radius:14px;padding:12px;color:var(--tx2);font-size:12px;line-height:1.45;margin-bottom:12px}
.prod-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}
.prod-card{border:1px solid var(--bd);background:var(--s1);border-radius:14px;padding:12px;min-width:0}
.prod-card h3{font-size:14px;margin:0 0 9px;color:var(--tx);font-family:'Syne',sans-serif}
.prod-bar{height:7px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:5px}
.prod-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#2f7cff);border-radius:99px}
.prod-upload{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prod-file{max-width:310px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;color:var(--tx2);padding:8px;font-size:12px}

.prod-toolbar{display:grid;gap:10px;margin-bottom:12px}
.prod-topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prod-periods{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prod-tag{border:1px solid var(--bd);background:var(--s1);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--tx2);display:inline-flex;align-items:center;gap:6px}
.prod-tag strong{color:var(--tx)}
.prod-filters{border:1px solid var(--bd);background:rgba(255,255,255,.025);border-radius:14px;padding:10px;display:grid;gap:9px}
.prod-filter-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.prod-filter-title{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-right:2px;min-width:74px}
.prod-chip{border:1px solid var(--bd);background:var(--s1);color:var(--tx2);border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer;user-select:none;transition:.15s;display:inline-flex;align-items:center;gap:6px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-chip:hover{border-color:rgba(255,110,31,.6);color:var(--tx)}
.prod-chip.act{background:rgba(255,110,31,.16);border-color:var(--acc);color:var(--tx)}
.prod-chip.mini{font-size:11px;padding:5px 8px}
.prod-chip.clear{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.35);color:#fecaca}
.prod-chip.all{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25)}
.prod-mini-panel{border:1px dashed var(--bd);border-radius:12px;padding:8px;display:grid;gap:7px;background:rgba(255,255,255,.015)}
.prod-selected{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prod-searchline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prod-searchline .sw-wrap{min-width:260px;flex:1}
.prod-card .tw tr{cursor:pointer}
.prod-card .tw tr.sel{background:rgba(255,110,31,.12)!important;outline:1px solid rgba(255,110,31,.45)}
.prod-card .tw tr.cat-sel{background:rgba(47,124,255,.10)!important;outline:1px solid rgba(47,124,255,.35)}
.prod-help{font-size:11px;color:var(--tx3);margin-top:3px}
@media(max-width:900px){.prod-topline{align-items:flex-start}.prod-filter-title{min-width:100%}.prod-searchline .sw-wrap{min-width:100%}}

@media(max-width:900px){.prod-grid{grid-template-columns:1fr}}

@media(max-width:768px){.kpis{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr}.bi-grid{grid-template-columns:1fr}.vg-grid{grid-template-columns:1fr}}

function mkPag(c,t,fn){
  if(t<=1)return'';
  let h='<div class="pag">';
  h+=`<div class="pb" onclick="${fn}(${Math.max(1,c-1)})">‹</div>`;
  const rng=[...new Set([1,Math.max(1,c-1),c,Math.min(t,c+1),t])].filter(p=>p>=1&&p<=t).sort((a,b)=>a-b);
  let lp=0;rng.forEach(p=>{if(lp&&p-lp>1)h+='<span class="pi">…</span>';h+=`<div class="pb${p===c?' act':''}" onclick="${fn}(${p})">${p}</div>`;lp=p;});
  h+=`<div class="pb" onclick="${fn}(${Math.min(t,c+1)})">›</div><span class="pi">${c}/${t}</span></div>`;return h;
}

let db = null;

// ── Fallback localStorage ──────────────────────────────
const LS_KEY = 'bdr_data_v1';
function lsSave(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      lancamentos:store.lancamentos, centrocusto:store.centrocusto,
      patrimonio:store.patrimonio, produtos:store.produtos, clientes_mes:store.clientes_mes, cfg:store.cfg
    }));
  } catch(e){}
}
function lsLoad(){
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(d && d.lancamentos && d.lancamentos.length){
      Object.assign(store, {
        lancamentos:d.lancamentos, centrocusto:d.centrocusto||store.centrocusto,
        patrimonio:d.patrimonio||[], produtos:d.produtos||[], clientes_mes:d.clientes_mes||{}, cfg:d.cfg||store.cfg
      });
      return true;
    }
  } catch(e){}
  return false;
}

// ── Status UI ─────────────────────────────────────────
function setStatus(txt, color){
  const el=$('dbs');
  if(el){el.textContent=txt;el.style.color=color;}
}

// ── Carregar tudo do Firestore ────────────────────────
function withTimeout(promise, ms=9000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))
  ]);
}
async function loadAll(){
  setStatus('● Conectando…','var(--wa)');
  try {
    const [lSnap,ccSnap,patSnap,prodSnap,cfgSnap,cmSnap] = await withTimeout(Promise.all([
      db.collection('lancamentos').orderBy('data_competencia','desc').get(),
      db.collection('centrocusto').get(),
      db.collection('patrimonio').get(),
      db.collection('produtos_vendidos').get(),
      db.collection('config').get(),
      db.collection('clientes_mes').get()
    ]), 9000);
    store.lancamentos  = lSnap.docs.map(d=>({id:d.id,...d.data()}));
    store.centrocusto  = ccSnap.docs.map(d=>({id:d.id,...d.data()}));
    store.patrimonio   = patSnap.docs.map(d=>({id:d.id,...d.data()}));
    store.produtos     = prodSnap.docs.map(d=>({id:d.id,...d.data()}));
    store.clientes_mes = {};
    cmSnap.docs.forEach(d=>{ store.clientes_mes[d.id]=d.data().count||0; });
    if(cfgSnap.docs.length) store.cfg = {...store.cfg,...cfgSnap.docs[0].data()};
    lsSave();
    setStatus('● '+store.lancamentos.length+' lanç. | online','var(--ok)');
    setupRealtimeSync();
    return true;
  } catch(e){
    setStatus('● offline','var(--er)');
    toast('Firebase offline — usando dados locais','in');
    return false;
  }
}

// ── Sync em tempo real (multi-usuário) ────────────────
function setupRealtimeSync(){
  unsubListeners.forEach(u=>u());
  unsubListeners = [];
  // lancamentos
  const unsub = db.collection('lancamentos')
    .orderBy('data_competencia','desc')
    .onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{
        const d={id:ch.doc.id,...ch.doc.data()};
        if(ch.type==='added'||ch.type==='modified'){
          const i=store.lancamentos.findIndex(x=>x.id===d.id);
          if(i>=0) store.lancamentos[i]=d; else store.lancamentos.unshift(d);
        } else if(ch.type==='removed'){
          store.lancamentos=store.lancamentos.filter(x=>x.id!==ch.doc.id);
        }
      });
      lsSave();
      setStatus('● '+store.lancamentos.length+' lanç. | online','var(--ok)');
      safeRender();
    }, err=>{ setStatus('● offline','var(--er)'); });
  unsubListeners.push(unsub);

  // produtos vendidos
  const unsubProd = db.collection('produtos_vendidos')
    .onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{
        const d={id:ch.doc.id,...ch.doc.data()};
        if(ch.type==='added'||ch.type==='modified'){
          const i=store.produtos.findIndex(x=>x.id===d.id);
          if(i>=0) store.produtos[i]=d; else store.produtos.push(d);
        } else if(ch.type==='removed'){
          store.produtos=store.produtos.filter(x=>x.id!==ch.doc.id);
        }
      });
      lsSave();
      if(CM==='produtos') safeRender();
    }, err=>{ console.warn('Sync produtos falhou:',err.message); });
  unsubListeners.push(unsubProd);
}

// ── CRUD Firestore ─────────────────────────────────────
async function fbAdd(col, data){
  if(!fbOk) return null;
  delete data.id;
  data.updated_at = firebase.firestore.FieldValue.serverTimestamp();
  const ref = await db.collection(col).add(data);
  return ref.id;
}
async function fbSet(col, id, data){
  if(!fbOk) return;
  delete data.id;
  data.updated_at = firebase.firestore.FieldValue.serverTimestamp();
  await db.collection(col).doc(id).set(data, {merge:true});
}
async function fbDel(col, id){
  if(!fbOk) return;
  await db.collection(col).doc(id).delete();
}
async function fbBatch(col, items){
  if(!fbOk) return;
  const CHUNK=499;
  for(let i=0;i<items.length;i+=CHUNK){
    const batch=db.batch();
    items.slice(i,i+CHUNK).forEach(item=>{
      const d={...item};delete d.id;
      d.updated_at=firebase.firestore.FieldValue.serverTimestamp();
      const ref=db.collection(col).doc();
      batch.set(ref,d);
    });
    await batch.commit();
    console.log(`Batch ${i/CHUNK+1} ok`);
  }
}

let sortKey='data_competencia',sortDir='desc';

function chkVals(id){return [...document.querySelectorAll(`#${id} input[type=checkbox]:checked`)].map(i=>i.value);}
function mfClear(id){document.querySelectorAll(`#${id} input[type=checkbox]`).forEach(i=>i.checked=false);CP=1;rLanc();}
function mfBox(id,label,items,sel=[],fmt=x=>x){

function mesJanela(baseMes){
  const b=(baseMes||today().slice(0,7))+'-01';
  return [addMonths(b,-1).slice(0,7),b.slice(0,7),addMonths(b,1).slice(0,7)];
}
function rLanc(){
  const sw=($('sw-l')||{value:''}).value.toLowerCase().trim();
  const fS=chkVals('fst');
  const fT=chkVals('ftp');
  const fMc=chkVals('fmc');
  const fMv=chkVals('fmv');
  const fC=chkVals('fcat');
  const fFP=chkVals('ffp');
  const fSub=chkVals('fsub');

  const cats=[...new Set(store.lancamentos.map(r=>r.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const subs=[...new Set(store.lancamentos.filter(r=>!fC.length||fC.includes(r.categoria)).map(r=>r.subcategoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const meses=[...new Set(store.lancamentos.map(r=>(r.data_competencia||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const mesesV=[...new Set(store.lancamentos.map(r=>(r.data_vencimento||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const fps=[...new Set(store.lancamentos.map(r=>r.forma_pagamento).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const tipos=['Contas a receber','Contas a pagar'];
  const sts=['Concluído','Pendente'];

  const janela=mesJanela(selMes||today().slice(0,7));
  const temFiltro=fS.length||fT.length||fMc.length||fMv.length||fC.length||fFP.length||fSub.length||sw;

  let data=store.lancamentos.filter(r=>{
    if(fS.length&&!fS.includes(r.status))return false;
    if(fT.length&&!fT.includes(r.rec_desp))return false;
    if(fC.length&&!fC.includes(r.categoria))return false;
    if(fSub.length&&!fSub.includes(r.subcategoria))return false;
    if(fFP.length&&!fFP.includes(r.forma_pagamento))return false;
    const mc=(r.data_competencia||'').slice(0,7), mv=(r.data_vencimento||'').slice(0,7);
    if(fMc.length&&!fMc.includes(mc))return false;
    if(fMv.length&&!fMv.includes(mv))return false;
    if(!temFiltro){
      const semVenc=!r.data_vencimento;
      if(!(janela.includes(mc)||janela.includes(mv)||semVenc)) return false;
    }
    if(sw){const s=`${r.descricao||''} ${r.categoria||''} ${r.subcategoria||''} ${r.forma_pagamento||''}`.toLowerCase();if(!s.includes(sw))return false;}
    return true;
  });

  data.sort((a,b)=>{
    const va=a[sortKey]||'',vb=b[sortKey]||'';
    if(sortKey==='valor'){return sortDir==='asc'?+va- +vb:+vb- +va;}
    return sortDir==='asc'?(va>vb?1:-1):(va<vb?1:-1);
  });

  const tIn=data.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+(+r.valor||0),0);
  const tOut=data.filter(r=>r.rec_desp!=='Contas a receber').reduce((s,r)=>s+(+r.valor||0),0);
  const thC=(k,lbl)=>`<th class="${sortKey===k?'srt':''}" onclick="sortL('${k}')">${lbl}${sortKey===k?(sortDir==='asc'?' ↑':' ↓'):''}</th>`;

  const MAX_ROWS=700;
  const dataRows=data.slice(0,MAX_ROWS);
  const rows=dataRows.map(r=>{
    const isIn=r.rec_desp==='Contas a receber';
    const parcTag=r.parcela_info?`<span class="bg bpu2" style="font-size:10px;margin-left:4px">${hEsc(r.parcela_info)}</span>`:'';
    const recTag=r.recorrente?`<span class="bg bblue" style="font-size:10px;margin-left:4px">↻</span>`:'';
    return`<tr onclick="selRow(this,'${r.id}')" ondblclick="eL('${r.id}')" style="cursor:pointer" title="Dois cliques para editar">
      <td class="mono" style="font-size:12px">${fmtD(r.data_competencia)}</td>
      <td class="mono" style="font-size:12px;color:var(--tx2)">${fmtD(r.data_vencimento)}</td>
      <td><span style="font-size:12px;color:var(--tx2)">${hEsc(r.forma_pagamento||'—')}</span></td>
      <td style="font-size:12px;color:var(--tx2)">${hEsc(r.categoria||'—')}</td>
      <td style="font-size:12px;color:var(--tx3)">${hEsc(r.subcategoria||'—')}</td>
      <td class="trunc" title="${hEsc(r.descricao||'')}" style="max-width:170px">${hEsc(r.descricao||'—')}${parcTag}${recTag}</td>
      <td class="tr"><span class="${isIn?'vin':'vout'}">${isIn?'+':'−'} ${fmtN(r.valor)}</span></td>
      <td><span class="bg ${r.status==='Concluído'?'bgreen':'byel'}">${r.status==='Concluído'?'✓':'⏳'}</span></td>
      <td><div class="ra">
        <button class="btn bs btn-s btn-i" title="Editar" onclick="event.stopPropagation();eL('${r.id}')">✏️</button>
        <button class="btn bd2 btn-s btn-i" title="Excluir" onclick="event.stopPropagation();dL('${r.id}')">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');

  const filtroTxt=temFiltro?'Filtro aplicado':'Automático: mês anterior + mês atual + próximo mês + sem vencimento';
  $('content').innerHTML=`
    <div class="kpis">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Entradas (filtro)</div><div class="kpi-v">${fmt(tIn)}</div><div class="kpi-s">${data.filter(r=>r.rec_desp==='Contas a receber').length} registros</div></div>
      <div class="kpi" style="--kc:var(--er)"><div class="kpi-l">Saídas (filtro)</div><div class="kpi-v">${fmt(tOut)}</div><div class="kpi-s">${data.filter(r=>r.rec_desp!=='Contas a receber').length} registros</div></div>
      <div class="kpi" style="--kc:${tIn-tOut>=0?'var(--ok)':'var(--er)'}"><div class="kpi-l">Resultado</div><div class="kpi-v" style="color:${tIn-tOut>=0?'var(--ok)':'var(--er)'}">${fmt(tIn-tOut)}</div></div>
      <div class="kpi" style="--kc:var(--wa)"><div class="kpi-l">Pendentes</div><div class="kpi-v" style="color:var(--wa)">${data.filter(r=>r.status==='Pendente').length}</div></div>
    </div>
    <div class="tb">
      <div class="sw-wrap"><span class="si">🔍</span><input id="sw-l" type="text" placeholder="Buscar em todo histórico…" value="${hEsc(sw)}" oninput="debouncR()"></div>
      ${mfBox('ftp','Tipo',tipos,fT,v=>v==='Contas a receber'?'↑ Vendas':'↓ Pagar')}
      ${mfBox('fst','Status',sts,fS)}
      ${mfBox('fmc','Competência',meses,fMc,mesLbl)}
      ${mfBox('fmv','Vencimento',mesesV,fMv,mesLbl)}
      ${mfBox('fcat','Categoria',cats,fC)}
      ${mfBox('fsub','Subcategoria',subs,fSub)}
      ${mfBox('ffp','Forma Pgto',fps,fFP)}
      <button class="btn bp" onclick="nL()">＋ Novo</button>
    </div>
    <div style="font-size:11px;color:var(--tx3);margin:4px 0 8px">${filtroTxt}</div>
    <div class="tw"><table>
      <thead><tr>
        ${thC('data_competencia','Competência')}
        ${thC('data_vencimento','Vencimento')}
        <th>Forma Pgto</th>
        ${thC('categoria','Categoria')}
        ${thC('subcategoria','Subcategoria')}
        <th>Descrição</th>
        ${thC('valor','Valor')}
        <th>Status</th><th style="width:68px"></th>
      </tr></thead>
      <tbody>${rows||`<tr><td colspan="9"><div class="es"><div class="em">📭</div><h3>Sem resultados</h3></div></td></tr>`}</tbody>
    </table></div>
    <div class="${data.length>MAX_ROWS?'lim-note':''}">${data.length>MAX_ROWS?`Mostrando ${MAX_ROWS} de ${data.length} registros. Use filtros ou busca para afinar.`:`${data.length} registros`}</div>`;
}

window.previewDatas=()=>{
  const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const tp=$('f-rec')?$('f-rec').value:'unica';
  const dv=($('f-dv')||{value:''}).value;
  const dc=($('f-dc')||{value:''}).value;
  const vl=parseFloat(($('f-vl')||{value:0}).value)||0;

  if(tp==='parcelada'){
    const np=parseInt(($('f-np')||{value:2}).value)||2;
    const valParc=vl/np;
    const pc=$('parc-valor-calc');
    if(pc) pc.textContent=vl?('R$ '+valParc.toFixed(2).replace('.',',')):'—';
    const prev=$('preview-parc');
    if(!prev) return;
    if(!dv){ prev.innerHTML='<span style="color:var(--wa)">⚠️ Informe a data de vencimento para ver as datas</span>'; return; }
    const datas=[];
    for(let i=0;i<Math.min(np,6);i++){
      const d=new Date(dv+'T12:00:00');d.setMonth(d.getMonth()+i);
      datas.push(d.getDate().toString().padStart(2,'0')+'/'+MN[d.getMonth()]+'/'+d.getFullYear());
    }
    const extra=np>6?' + '+(np-6)+' mais…':'';
    prev.innerHTML='<strong>Parcelas geradas:</strong> '+datas.join(' · ')+extra;
  }

  if(tp==='recorrente'){
    const nm=parseInt(($('f-nm')||{value:12}).value)||12;
    const prev=$('preview-recorr');
    if(!prev) return;
    const base=dv||dc;
    if(!base){ prev.innerHTML='<span style="color:var(--wa)">⚠️ Informe a data de vencimento para ver as datas</span>'; return; }
    const datas=[];
    for(let i=0;i<Math.min(nm,6);i++){
      const d=new Date(base+'T12:00:00');d.setMonth(d.getMonth()+i);
      datas.push(d.getDate().toString().padStart(2,'0')+'/'+MN[d.getMonth()]+'/'+d.getFullYear());
    }
    const extra=nm>6?' + '+(nm-6)+' mais…':'';
    prev.innerHTML='<strong>'+nm+' lançamentos:</strong> '+datas.join(' · ')+extra;
  }
};

window.svL=async function(id){
  const d=getLancD();
  if(!d.data_competencia||!d.valor||!d.categoria){toast('Preencha campos obrigatórios','er');return;}
  if(id){
    const i=store.lancamentos.findIndex(x=>x.id===id);
    if(i>=0) store.lancamentos[i]={...store.lancamentos[i],...d};
    cM(); render(CM); toast('Atualizado! ✅','ok');
    try{ if(i>=0) await fbSet('lancamentos',id,d); lsSave(); }catch(e){ lsSave(); }
  } else {
    const rec=$('f-rec')?$('f-rec').value:'unica';
    if(rec==='parcelada'){
      const np=parseInt(($('f-np')||{value:2}).value)||2;
      const gid=uid();
      for(let i=0;i<np;i++){
        const dc=addMonths(d.data_competencia,i);
        const dv=d.data_vencimento?addMonths(d.data_vencimento,i):null;
        store.lancamentos.unshift({id:uid(),...d,data_competencia:dc,data_vencimento:dv,descricao:`${d.descricao||d.categoria} (${i+1}/${np})`,parcela_info:`${i+1}/${np}`,parcelamento_id:gid});
      }
      for(const l of store.lancamentos.slice(0,np)){await fbAdd('lancamentos',{...l});}
      lsSave();
      toast(`${np} parcelas criadas!`,'ok');
    } else if(rec==='recorrente'){
      const nm=parseInt(($('f-nm')||{value:12}).value)||12;
      const gid=uid();
      for(let i=0;i<nm;i++){
        const dc=addMonths(d.data_competencia,i);
        const dv=d.data_vencimento?addMonths(d.data_vencimento,i):null;
        store.lancamentos.unshift({id:uid(),...d,data_competencia:dc,data_vencimento:dv,recorrente:true,recorrencia_id:gid});
      }
      for(const l of store.lancamentos.slice(0,nm)){await fbAdd('lancamentos',{...l});}
      lsSave();
      toast(`${nm} meses recorrentes criados!`,'ok');
    } else {
      const tmpId = uid();
      store.lancamentos.unshift({id:tmpId,...d});
      cM(); render(CM); toast('Criado! ✅','ok');
      try{
        const newId = await fbAdd('lancamentos',{...d});
        if(newId){ const idx=store.lancamentos.findIndex(x=>x.id===tmpId); if(idx>=0) store.lancamentos[idx].id=newId; }
        lsSave();
      }catch(e){ lsSave(); }
    }
  }
  cM();rLanc();
};
window.dL=async function(id){

const DRE_STRUCT=[
  {id:'rec_bruta', lbl:'(+) Receita Bruta',       cats:['Receita com produtos e mercadorias','Outras receitas operacionais','TRANSFERÊNCIA ENTRE CONTAS'], sinal:1, tipo:'g'},
  {id:'ded',       lbl:'(−) Deduções da Receita',  cats:['Impostos sobre a receita','Outras deduções'], sinal:-1, tipo:'g'},
  {id:'rec_liq',   lbl:'= Receita Líquida',        tipo:'tot', deps:['rec_bruta','ded']},
  {id:'custos',    lbl:'(−) Custo dos Produtos',   cats:['Custo dos produtos'], sinal:-1, tipo:'g'},
  {id:'lbr',       lbl:'= Lucro Bruto',             tipo:'tot', deps:['rec_liq','custos']},
  {id:'desp_op',   lbl:'(−) Despesas Operacionais',cats:['Despesas Operacionais'], sinal:-1, tipo:'g'},
  {id:'desp_pes',  lbl:'(−) Despesas com Pessoal', cats:['Despesas com pessoal'], sinal:-1, tipo:'g'},
  {id:'outras',    lbl:'(−) Outras Despesas',       cats:['Outras despesas operacionais'], sinal:-1, tipo:'g'},
  {id:'depreciacao',lbl:'(−) Depreciação',          cats:['Depreciação'], sinal:-1, tipo:'g'},
  {id:'res_op',    lbl:'= Resultado Operacional',   tipo:'tot', deps:['lbr','desp_op','desp_pes','outras','depreciacao']},
  {id:'resultado', lbl:'= Resultado Líquido',        tipo:'tot', deps:['res_op'], hi:true},
];

function calcDRE(lancs){
  const catS={};
  lancs.forEach(r=>{
    const k=r.categoria||'';
    const isIn=r.rec_desp==='Contas a receber';
    if(isIn) catS[k]=(catS[k]||0)+r.valor;
    else     catS[k]=(catS[k]||0)+r.valor;
  });
  const vals={};
  DRE_STRUCT.forEach(row=>{
    if(row.tipo==='g'){
      const v=row.cats.reduce((s,c)=>{
        const lancsC=lancs.filter(r=>r.categoria===c);
        const isRec=row.sinal===1;
        const sum=lancsC.reduce((ss,r)=>ss+r.valor,0);
        return s+sum*Math.abs(row.sinal);
      },0)*Math.sign(row.sinal);
      // recompute correctly
      vals[row.id]=row.cats.reduce((s,c)=>{
        const sum=lancs.filter(r=>r.categoria===c).reduce((ss,r)=>ss+r.valor,0);
        return s+sum;
      },0)*row.sinal;
    } else {
      vals[row.id]=row.deps.reduce((s,d)=>s+(vals[d]||0),0);
    }
  });
  return vals;
}

function rDRE(){
  const fAno=($('dre-ano')||{value:new Date().getFullYear().toString()}).value||new Date().getFullYear().toString();
  const anos=[...new Set(store.lancamentos.map(r=>(r.data_competencia||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const mesesDisp=[...new Set(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-')).map(r=>(r.data_competencia||'').slice(5,7)).filter(Boolean))].sort();

  if(!mesesDisp.length){$('content').innerHTML=`<div class="es"><div class="em">📈</div><h3>Sem dados para ${fAno}</h3></div>`;return;}

  const dreM={};mesesDisp.forEach(m=>{dreM[m]=calcDRE(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-'+m)));});
  const dreTotal=calcDRE(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-')));

  const thM=mesesDisp.map(m=>`<th class="dv">${MES_NM[+m-1]}</th>`).join('');
  const colCnt=mesesDisp.length+3;

  // Breakeven: custos fixos / margem contribuição
  // Custos fixos = pessoal + desp_op + outras
  // Custos variáveis = custo dos produtos
  // MC% = (Receita - CV) / Receita * 100
  // BEP = CF / MC%

  function bkRow(m,vals){
    const rb=vals['rec_bruta']||0;const cv=Math.abs(vals['custos']||0);
    const cf=Math.abs((vals['desp_op']||0)+(vals['desp_pes']||0)+(vals['outras']||0));
    const mc=rb-cv;const mcPct=rb?mc/rb:0;
    const bep=mcPct>0?cf/mcPct:null;
    const marg=rb?((vals['resultado']||0)/rb*100):0;
    return{bep,marg,mc,mcPct:mcPct*100};
  }

  const bkTotal=bkRow('total',dreTotal);
  const bkM={};mesesDisp.forEach(m=>{bkM[m]=bkRow(m,dreM[m]);});

  const recBruta=Math.abs(dreTotal['rec_bruta']||1);

  function valCls(v){return v>0?'dp':v<0?'dn':'dc';}

  const buildRows=()=>{
    let h='';
    DRE_STRUCT.forEach(row=>{
      const va=dreTotal[row.id]||0;
      const pct=recBruta?Math.abs(va)/recBruta*100:0;
      const mCols=mesesDisp.map(m=>{const v=dreM[m][row.id]||0;return`<td class="dv ${valCls(v)}">${v===0?'—':fmtN(v)}</td>`;}).join('');
      if(row.tipo==='g'){
        const cls=row.hi?'dre-hi':'dre-cat';
        h+=`<tr class="${cls}"><td>${row.lbl}</td>${mCols}<td class="dv ${valCls(va)}">${fmtN(va)}</td><td class="dv dc">${pct.toFixed(1)}%</td></tr>`;
        row.cats.forEach(cat=>{
          const subCats=[...new Set(store.centrocusto.filter(c=>c.categoria===cat&&c.subcategoria).map(c=>c.subcategoria))];
          subCats.forEach(sc=>{
            const tots=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-')&&r.categoria===cat&&r.subcategoria===sc).reduce((s,r)=>s+r.valor,0);
            if(tots>0){
              const sCols=mesesDisp.map(m=>{const v=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-'+m)&&r.categoria===cat&&r.subcategoria===sc).reduce((s,r)=>s+r.valor,0);return`<td class="dv dc">${v?fmtN(v):'—'}</td>`;}).join('');
              h+=`<tr class="dre-sub"><td>└ ${sc}</td>${sCols}<td class="dv dc">${fmtN(tots)}</td><td></td></tr>`;
            }
          });
        });
      } else {
        const cls=row.hi?'dre-hi':'dre-tot';
        h+=`<tr class="${cls}"><td>${row.lbl}</td>${mCols}<td class="dv ${valCls(va)}">${fmtN(va)}</td><td class="dv dc">${pct.toFixed(1)}%</td></tr>`;
        h+=`<tr class="dre-sep"><td colspan="${colCnt}"></td></tr>`;
      }
    });

    // Margem de Lucro
    const margTotal=bkTotal.marg;
    const margCols=mesesDisp.map(m=>{const v=bkM[m].marg;return`<td class="dv ${v>=0?'dp':'dn'}">${v.toFixed(1)}%</td>`;}).join('');
    h+=`<tr class="dre-bk"><td>📊 Margem de Lucro</td>${margCols}<td class="dv ${margTotal>=0?'dp':'dn'}">${margTotal.toFixed(1)}%</td><td></td></tr>`;

    // Breakeven
    const bepTotal=bkTotal.bep;
    const bepCols=mesesDisp.map(m=>{const v=bkM[m].bep;return`<td class="dv dc">${v!==null?fmt(v):'N/D'}</td>`;}).join('');
    h+=`<tr class="dre-bk"><td>🎯 Breakeven</td>${bepCols}<td class="dv dc">${bepTotal!==null?fmt(bepTotal):'N/D'}</td><td></td></tr>`;

    // Margem Contribuição
    const mcTot=bkTotal.mcPct;
    const mcCols=mesesDisp.map(m=>{const v=bkM[m].mcPct;return`<td class="dv dc">${v.toFixed(1)}%</td>`;}).join('');
    h+=`<tr class="dre-bk"><td>📐 Margem de Contribuição</td>${mcCols}<td class="dv dc">${mcTot.toFixed(1)}%</td><td></td></tr>`;

    return h;
  };

  $('content').innerHTML=`
    <div class="tb" style="margin-bottom:12px">
      <span style="font-size:13px;font-weight:600;color:var(--tx2)">Ano:</span>
      <select id="dre-ano" class="fc" onchange="rDRE()">${anos.map(a=>`<option value="${a}" ${a===fAno?'selected':''}>${a}</option>`).join('')}</select>
      <span style="font-size:11px;color:var(--tx3);margin-left:6px">Regime de Competência · ${mesesDisp.length} meses</span>
    </div>
    <div style="overflow-x:auto"><div class="tw">
      <table class="dre-t">
        <thead><tr><th style="text-align:left;min-width:210px">Item</th>${thM}<th class="dv" style="color:var(--acc)">Total ${fAno}</th><th class="dv">% Rec.</th></tr></thead>
        <tbody>${buildRows()}</tbody>
      </table>
    </div></div>`;
}
window.rDRE=rDRE;

function rBI(){
  const fAno=($('bi-ano')||{value:new Date().getFullYear().toString()}).value||new Date().getFullYear().toString();
  const fMes=($('bi-mes')||{value:''}).value;
  const fTp=($('bi-tp')||{value:'pagar'}).value;
  const anos=[...new Set(store.lancamentos.map(r=>(r.data_competencia||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const mesesAno=[...new Set(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-')).map(r=>(r.data_competencia||'').slice(0,7)).filter(Boolean))].sort().reverse();

  const lancsBase=fMes?store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fMes)):store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-'));
  const pagar=lancsBase.filter(r=>r.rec_desp!=='Contas a receber');
  const receber=lancsBase.filter(r=>r.rec_desp==='Contas a receber');
  const alvo=fTp==='pagar'?pagar:receber;
  const tRec=receber.reduce((s,r)=>s+r.valor,0),tPag=pagar.reduce((s,r)=>s+r.valor,0);

  // Fluxo por mês
  const meses=['01','02','03','04','05','06','07','08','09','10','11','12'];
  const fluxo=meses.map((m,i)=>{
    const key=fAno+'-'+m;
    const e=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(key)&&r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const s=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(key)&&r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const rl=e-s;const clientes=store.clientes_mes[key]||0;
    return{m:MES_NM[i],key,e,s,rl,clientes,tm:clientes?e/clientes:0};
  }).filter(d=>d.e||d.s);

  const maxV=Math.max(...fluxo.map(d=>Math.max(d.e,d.s)),1);
  const barFlx=fluxo.map(d=>`<div class="chart-col">
    <div class="chart-area">
      <div class="chart-b" style="height:${Math.round(d.e/maxV*110)}px;background:var(--ok)" title="Ent: ${fmt(d.e)}"></div>
      <div class="chart-b" style="height:${Math.round(d.s/maxV*110)}px;background:var(--er)" title="Saí: ${fmt(d.s)}"></div>
    </div>
    <div style="font-size:10px;color:var(--tx2)">${d.m}</div>
    <div style="font-size:10px;color:${d.rl>=0?'var(--ok)':'var(--er)'}">${d.rl>=0?'+':''}${(d.rl/1000).toFixed(0)}k</div>
  </div>`).join('');

  const catMap={};alvo.forEach(r=>{catMap[r.categoria||'—']=(catMap[r.categoria||'—']||0)+r.valor;});
  const topCats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const maxCat=topCats[0]?topCats[0][1]:1;

  const subMap={};alvo.forEach(r=>{const k=r.subcategoria||'—';subMap[k]=(subMap[k]||0)+r.valor;});
  const topSubs=Object.entries(subMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxSub=topSubs[0]?topSubs[0][1]:1;

  const margemRows=fluxo.map(d=>{
    const mg=d.e?(d.rl/d.e*100):0;
    return`<tr>
      <td>${d.m}/${fAno.slice(2)}</td>
      <td class="tr vin">+ ${fmtN(d.e)}</td>
      <td class="tr vout">− ${fmtN(d.s)}</td>
      <td class="tr ${d.rl>=0?'vin':'vout'}">${d.rl>=0?'+':''}${fmtN(d.rl)}</td>
      <td class="tr mono" style="color:${mg>=0?'var(--ok)':'var(--er)'}">${mg.toFixed(1)}%</td>
    </tr>`;
  }).join('');

  $('content').innerHTML=`
    <div class="tb" style="margin-bottom:12px">
      <span style="font-size:12px;font-weight:600;color:var(--tx2)">Ano:</span>
      <select id="bi-ano" class="fc" onchange="updBIMes()">${anos.map(a=>`<option value="${a}" ${a===fAno?'selected':''}>${a}</option>`).join('')}</select>
      <span style="font-size:12px;font-weight:600;color:var(--tx2)">Mês:</span>
      <select id="bi-mes" class="fc" onchange="rBI()"><option value="">Todos os meses</option>${mesesAno.map(m=>`<option value="${m}" ${fMes===m?'selected':''}>${mesLbl(m)}</option>`).join('')}</select>
      <span style="font-size:12px;font-weight:600;color:var(--tx2)">Analisar:</span>
      <select id="bi-tp" class="fc" onchange="rBI()"><option value="pagar" ${fTp==='pagar'?'selected':''}>Saídas</option><option value="receber" ${fTp==='receber'?'selected':''}>Entradas</option></select>
    </div>
    <div class="kpis">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Total Entradas</div><div class="kpi-v">${fmt(tRec)}</div></div>
      <div class="kpi" style="--kc:var(--er)"><div class="kpi-l">Total Saídas</div><div class="kpi-v">${fmt(tPag)}</div></div>
      <div class="kpi" style="--kc:${tRec-tPag>=0?'var(--ok)':'var(--er)'}"><div class="kpi-l">Resultado</div><div class="kpi-v" style="color:${tRec-tPag>=0?'var(--ok)':'var(--er)'}">${fmt(tRec-tPag)}</div></div>
      <div class="kpi" style="--kc:var(--acc)"><div class="kpi-l">Margem</div><div class="kpi-v">${tRec?((tRec-tPag)/tRec*100).toFixed(1):'0'}%</div></div>
    </div>
    <div class="bi-grid">
      <div class="bi-card full"><div class="sh">Resultado Mensal ${fAno} <span>entradas vs saídas</span></div>
        <div style="display:flex;align-items:flex-end;gap:5px;overflow-x:auto;min-height:130px">${barFlx||'<span style="color:var(--tx3)">Sem dados</span>'}</div>
        <div style="display:flex;gap:12px;margin-top:7px;font-size:10px;color:var(--tx2)"><span><i style="display:inline-block;width:8px;height:8px;background:var(--ok);border-radius:2px;margin-right:3px"></i>Entradas</span><span><i style="display:inline-block;width:8px;height:8px;background:var(--er);border-radius:2px;margin-right:3px"></i>Saídas</span></div>
      </div>
      <div class="bi-card"><div class="sh">Por Categoria <span>${fTp==='pagar'?'saídas':'entradas'}</span></div>
        ${topCats.map(([c,v])=>`<div class="bar-row"><div class="bar-lbl" title="${c}">${c}</div><div class="bar-wrap"><div class="bar-fill" style="width:${v/maxCat*100}%;background:${fTp==='pagar'?'var(--er)':'var(--ok)'}"></div></div><div class="bar-val">${fmt(v)}</div></div>`).join('')||'<span style="color:var(--tx3);font-size:12px">Sem dados</span>'}
      </div>
      <div class="bi-card"><div class="sh">Por Subcategoria <span>top 8</span></div>
        ${topSubs.map(([c,v])=>`<div class="bar-row"><div class="bar-lbl" title="${c}" style="color:var(--tx2)">${c}</div><div class="bar-wrap"><div class="bar-fill" style="width:${v/maxSub*100}%;background:var(--acc)"></div></div><div class="bar-val">${fmt(v)}</div></div>`).join('')||'<span style="color:var(--tx3);font-size:12px">Sem dados</span>'}
      </div>
      <div class="bi-card full"><div class="sh">Resultado Mensal <span>margem por mês</span></div>
        <div class="tw" style="border:none"><table>
          <thead><tr><th>Mês</th><th class="tr">Entradas</th><th class="tr">Saídas</th><th class="tr">Resultado</th><th class="tr">Margem</th></tr></thead>
          <tbody>${margemRows||'<tr><td colspan="5" style="color:var(--tx3);text-align:center;padding:20px">Sem dados</td></tr>'}</tbody>
        </table></div>
      </div>
    </div>`;
}

function rDash(){

  const lA=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(mesAnt));
  const entM=lM.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0);
  const saiM=lM.filter(r=>r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0);
  const entA=lA.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0);
  const saiA=lA.filter(r=>r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0);
  const pend=store.lancamentos.filter(r=>r.status==='Pendente');
  const tPend=pend.reduce((s,r)=>s+r.valor,0);
  const varE=entA?((entM-entA)/entA*100):0,varS=saiA?((saiM-saiA)/saiA*100):0;

  // Últimos 6 meses
  const m6=Array.from({length:6},(_,i)=>addMonths(mes+'-01',i-5).slice(0,7));
  const maxV=Math.max(...m6.map(m=>{const l=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(m));return Math.max(l.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0),l.filter(r=>r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0));}),1);
  const bars6=m6.map(m=>{
    const l=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(m));
    const e=l.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const s=l.filter(r=>r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const res=e-s;
    return`<div class="chart-col"><div class="chart-area"><div class="chart-b" style="height:${Math.round(e/maxV*110)}px;background:var(--ok)" title="${fmt(e)}"></div><div class="chart-b" style="height:${Math.round(s/maxV*110)}px;background:var(--er)" title="${fmt(s)}"></div></div><div style="font-size:10px;color:var(--tx2)">${mesLbl(m)}</div><div style="font-size:10px;color:${res>=0?'var(--ok)':'var(--er)'}">${res>=0?'+':''}${(res/1000).toFixed(0)}k</div></div>`;
  }).join('');

  // Top despesas do mês
  const catM={};lM.filter(r=>r.rec_desp!=='Contas a receber').forEach(r=>{catM[r.categoria||'—']=(catM[r.categoria||'—']||0)+r.valor;});
  const topCat=Object.entries(catM).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxCat=topCat[0]?topCat[0][1]:1;

  // Vencimentos hoje e D+1
  const hojeStr=today();const amanha=addMonths(hojeStr,0).split('-');
  const dt=new Date(hojeStr+'T12:00:00');dt.setDate(dt.getDate()+1);
  const amanhaStr=dt.toISOString().slice(0,10);
  const vencHoje=pend.filter(r=>r.data_vencimento===hojeStr);
  const vencAmanha=pend.filter(r=>r.data_vencimento===amanhaStr);
  const pendPrx=pend.filter(r=>r.data_vencimento&&r.data_vencimento>=hojeStr).sort((a,b)=>a.data_vencimento>b.data_vencimento?1:-1).slice(0,6);
  const vencidos=pend.filter(r=>r.data_vencimento&&r.data_vencimento<hojeStr).sort((a,b)=>a.data_vencimento<b.data_vencimento?1:-1);

  function pendCard(r){
    const isHj=r.data_vencimento===hojeStr;
    const isAmn=r.data_vencimento===amanhaStr;
    const tag=isHj?`<span class="bg bred" style="font-size:10px">HOJE</span>`:isAmn?`<span class="bg byel" style="font-size:10px">AMANHÃ</span>`:'';
    return`<div onclick="abreBaixa('${r.id}')" class="pend-item" style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .12s">
      <div><div style="font-size:13px;display:flex;align-items:center;gap:6px">${r.descricao||r.categoria||'—'} ${tag}</div><div style="font-size:11px;color:var(--tx2)">${r.categoria} · ${r.subcategoria||''} · Venc. ${fmtD(r.data_vencimento)}</div></div>
      <div style="text-align:right"><span class="vout">${fmt(r.valor)}</span><div style="font-size:10px;color:var(--tx3);margin-top:2px">clique p/ baixar</div></div>
    </div>`;
  }

  $('content').innerHTML=`
    <div class="kpis">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Entradas — ${mesLbl(mes)}</div><div class="kpi-v">${fmt(entM)}</div><div class="kpi-s" style="color:${varE>=0?'var(--ok)':'var(--er)'}">${varE>=0?'+':''}${varE.toFixed(1)}% vs mês ant.</div></div>
      <div class="kpi" style="--kc:var(--er)"><div class="kpi-l">Saídas — ${mesLbl(mes)}</div><div class="kpi-v">${fmt(saiM)}</div><div class="kpi-s" style="color:${varS<=0?'var(--ok)':'var(--er)'}">${varS>=0?'+':''}${varS.toFixed(1)}% vs mês ant.</div></div>
      <div class="kpi" style="--kc:${entM-saiM>=0?'var(--ok)':'var(--er)'}"><div class="kpi-l">Resultado — ${mesLbl(mes)}</div><div class="kpi-v" style="color:${entM-saiM>=0?'var(--ok)':'var(--er)'}">${fmt(entM-saiM)}</div><div class="kpi-s">${entM?((entM-saiM)/entM*100).toFixed(1):'0'}% margem</div></div>
      <div class="kpi" style="--kc:var(--wa)"><div class="kpi-l">Pendentes</div><div class="kpi-v" style="color:var(--wa)">${fmt(tPend)}</div><div class="kpi-s">${pend.length} títulos · ${vencHoje.length} vencem hoje</div></div>
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
      <div class="bi-card"><div class="sh">Fluxo de Caixa <span>últimos 6 meses</span></div>

        <div style="display:flex;gap:12px;margin-top:7px;font-size:10px;color:var(--tx2)"><span><i style="display:inline-block;width:8px;height:8px;background:var(--ok);border-radius:2px;margin-right:3px"></i>Entradas</span><span><i style="display:inline-block;width:8px;height:8px;background:var(--er);border-radius:2px;margin-right:3px"></i>Saídas</span></div>
      </div>
      <div class="bi-card"><div class="sh">Top Despesas <span>${mesLbl(mes)}</span></div>
        ${topCat.map(([c,v])=>'<div class="bar-row"><div class="bar-lbl" style="font-size:11px" title="'+c+'">'+c+'</div><div class="bar-wrap"><div class="bar-fill" style="width:'+Math.round(v/maxCat*100)+'%;background:var(--er)"></div></div><div class="bar-val" style="color:var(--er);font-size:11px">'+fmt(v)+'</div></div>').join('')||'<span style="color:var(--tx3);font-size:12px">Sem dados</span>'}
      </div>
    </div>

      </div>
      <div class="bi-card" id="card-vencidos">
        <div class="sh" style="color:var(--er)">🔴 Títulos Vencidos <span style="color:var(--tx3)">${vencidos.length} títulos · ${fmt(vencidos.reduce((s,r)=>s+r.valor,0))}</span></div>
        ${vencidos.length===0?'<div style="color:var(--tx3);font-size:13px;padding:10px 0">✅ Sem títulos em atraso</div>':vencidos.map(mkVencidoCard).join('')}
      </div>
    </div>`;
}

function rVG(){
  const mes=selMes||new Date().toISOString().slice(0,7);
  const ano=mes.slice(0,4);
  const mesesAno=[...new Set(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(ano)).map(r=>(r.data_competencia||'').slice(0,7)).filter(Boolean))].sort();

  const linhas=mesesAno.map(m=>{
    const l=store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(m));
    const receita=l.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const cv=l.filter(r=>r.categoria==='Custo dos produtos').reduce((s,r)=>s+r.valor,0);
    const cf=l.filter(r=>['Despesas Operacionais','Despesas com pessoal','Outras despesas operacionais'].includes(r.categoria)).reduce((s,r)=>s+r.valor,0);
    const mc=receita-cv;const mcPct=receita?mc/receita:0;
    const bep=mcPct>0?cf/mcPct:null;
    const resultado=receita-cv-cf-l.filter(r=>!['Custo dos produtos','Despesas Operacionais','Despesas com pessoal','Outras despesas operacionais'].includes(r.categoria)&&r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0);
    const clientes=store.clientes_mes[m]||0;
    const tm=clientes?receita/clientes:0;
    return{m,receita,cv,cf,mc,mcPct,bep,resultado,clientes,tm};
  });

  // KPIs do mês selecionado
  const atual=linhas.find(l=>l.m===mes)||linhas[linhas.length-1]||{};
  const totAno=linhas.reduce((s,l)=>s+l.receita,0);
  const bepMedia=linhas.filter(l=>l.bep).reduce((s,l)=>s+l.bep,0)/(linhas.filter(l=>l.bep).length||1);

  const inputsClientes=mesesAno.map(m=>{
    const l=linhas.find(x=>x.m===m)||{};
    return`<div class="input-row">
      <label>${mesLbl(m)}<span style="margin-left:8px;color:var(--tx3)">Receita: ${fmt(l.receita||0)}</span></label>
      <input type="number" min="0" value="${store.clientes_mes[m]||''}" placeholder="Nº clientes"
        oninput="store.clientes_mes['${m}']=parseInt(this.value)||0;saveClientesMes('${m}',parseInt(this.value)||0);rVG()">
    </div>`;
  }).join('');

  const tabelaRows=linhas.map(l=>{
    const diffBep=l.bep?l.receita-l.bep:null;
    return`<tr>
      <td>${mesLbl(l.m)}</td>
      <td class="tr vin">+ ${fmtN(l.receita)}</td>
      <td class="tr vout">− ${fmtN(l.cv)}</td>
      <td class="tr" style="color:var(--tx2)">− ${fmtN(l.cf)}</td>
      <td class="tr mono" style="color:var(--in)">${l.mcPct?(l.mcPct*100).toFixed(1)+'%':'—'}</td>
      <td class="tr mono" style="color:var(--acc)">${l.bep?fmt(l.bep):'N/D'}</td>
      <td class="tr" style="color:${diffBep===null?'var(--tx3)':diffBep>=0?'var(--ok)':'var(--er)'}">${diffBep!==null?(diffBep>=0?'+':'')+fmtN(diffBep):'—'}</td>
      <td class="tr mono" style="color:var(--pu)">${l.clientes||'—'}</td>
      <td class="tr mono" style="color:var(--acc)">${l.tm?fmt(l.tm):'—'}</td>
    </tr>`;
  }).join('');

  const maxBEP=Math.max(...linhas.filter(l=>l.bep).map(l=>Math.max(l.receita,l.bep)),1);
  const bepBars=linhas.filter(l=>l.receita||l.bep).map(l=>`<div class="chart-col">
    <div class="chart-area" style="position:relative;height:110px;align-items:flex-end;gap:2px">
      <div class="chart-b" style="height:${Math.round((l.receita/maxBEP)*100)}px;background:var(--ok)" title="Receita: ${fmt(l.receita)}"></div>
      ${l.bep?`<div class="chart-b" style="height:${Math.round((l.bep/maxBEP)*100)}px;background:var(--in);opacity:.7" title="BEP: ${fmt(l.bep)}"></div>`:''}
    </div>
    <div style="font-size:9px;color:var(--tx2)">${mesLbl(l.m)}</div>
  </div>`).join('');

  $('content').innerHTML=`
    <div class="kpis">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Receita — ${mesLbl(mes)}</div><div class="kpi-v">${fmt(atual.receita||0)}</div></div>
      <div class="kpi" style="--kc:var(--in)"><div class="kpi-l">Breakeven — ${mesLbl(mes)}</div><div class="kpi-v" style="color:var(--in)">${atual.bep?fmt(atual.bep):'N/D'}</div><div class="kpi-s">${atual.bep&&atual.receita?(atual.receita>=atual.bep?'✅ Atingido':'⚠️ '+fmt(atual.bep-atual.receita)+' a cobrir'):'—'}</div></div>
      <div class="kpi" style="--kc:var(--acc)"><div class="kpi-l">Ticket Médio — ${mesLbl(mes)}</div><div class="kpi-v" style="color:var(--acc)">${atual.tm?fmt(atual.tm):'Informe clientes'}</div><div class="kpi-s">${atual.clientes?atual.clientes+' clientes':'Informe ao lado →'}</div></div>
      <div class="kpi" style="--kc:var(--pu)"><div class="kpi-l">BEP Médio ${ano}</div><div class="kpi-v" style="color:var(--pu)">${fmt(bepMedia)}</div><div class="kpi-s">média ${mesesAno.length} meses</div></div>
    </div>

    <div style="display:grid;grid-template-columns:3fr 1fr;gap:12px;margin-bottom:12px">
      <div class="bi-card">
        <div class="sh">Receita vs Breakeven <span>${ano} — barras = mês</span></div>
        <div style="display:flex;align-items:flex-end;gap:4px;min-height:120px">${bepBars||'<span style="color:var(--tx3)">Sem dados</span>'}</div>
        <div style="display:flex;gap:12px;margin-top:7px;font-size:10px;color:var(--tx2)"><span><i style="display:inline-block;width:8px;height:8px;background:var(--ok);border-radius:2px;margin-right:3px"></i>Receita</span><span><i style="display:inline-block;width:8px;height:8px;background:var(--in);border-radius:2px;margin-right:3px"></i>Breakeven</span></div>
      </div>
      <div class="bi-card">
        <div class="sh">Clientes Atendidos <span>informe por mês</span></div>
        ${inputsClientes||'<span style="color:var(--tx3);font-size:12px">Sem meses</span>'}
      </div>
    </div>

    <div class="bi-card">
      <div class="sh">Análise Mensal ${ano} <span>BEP · Margem Contribuição · Ticket Médio</span></div>
      <div style="overflow-x:auto"><div class="tw" style="border:none"><table>
        <thead><tr>
          <th>Mês</th><th class="tr">Receita</th><th class="tr">Custo Var.</th><th class="tr">Custo Fix.</th>
          <th class="tr">MC%</th><th class="tr">Breakeven</th><th class="tr">Rec. − BEP</th>
          <th class="tr">Clientes</th><th class="tr">TM</th>
        </tr></thead>
        <tbody>${tabelaRows||'<tr><td colspan="9" style="text-align:center;color:var(--tx3);padding:20px">Sem dados</td></tr>'}</tbody>
      </table></div></div>
    </div>`;
}

function calcDep(r){if(!r.valor_aquisicao||!r.vida_util_anos)return{m:0,ac:0,at:+r.valor_aquisicao||0,pct:0};const mn=(+r.valor_aquisicao)/(+r.vida_util_anos*12);const s=r.data_aquisicao?new Date(r.data_aquisicao):new Date();const e=r.data_baixa?new Date(r.data_baixa):new Date();const ms=Math.max(0,(e.getFullYear()-s.getFullYear())*12+e.getMonth()-s.getMonth());const ac=Math.min(mn*ms,+r.valor_aquisicao);return{m:mn,ac,at:+r.valor_aquisicao-ac,pct:+r.valor_aquisicao?ac/+r.valor_aquisicao*100:0};}
function rPat(){
  const sw=($('sw-pat')||{value:''}).value.toLowerCase();
  let data=store.patrimonio.filter(r=>!sw||`${r.nome_bem||''}`.toLowerCase().includes(sw));
  const tv=data.reduce((s,r)=>s+(+r.valor_aquisicao||0),0),ta=data.reduce((s,r)=>s+calcDep(r).at,0);
  const tot=data.length,pgs=Math.ceil(tot/PS)||1;if(CP>pgs)CP=1;
  const sl=data.slice((CP-1)*PS,CP*PS);

window.confirmarBaixa=async function(id){
  const de=$('bx-de').value;
  if(!de){toast('Informe a data de efetivação','er');return;}
  const i=store.lancamentos.findIndex(x=>x.id===id);
  if(i>=0){
    store.lancamentos[i].status='Concluído';
    store.lancamentos[i].data_efetivacao=de;
    store.lancamentos[i].forma_pagamento=$('bx-fp').value||store.lancamentos[i].forma_pagamento;
    store.lancamentos[i].descricao=$('bx-obs').value.trim()||store.lancamentos[i].descricao;

  cM();

  }
