// FLUXO DE CAIXA CORRENTE + AUDITORIA + BACKUP
// ══════════════════════════════════════════════
let fluxoMes=today().slice(0,7);
function fDate(d){return d?new Date(d+'T12:00:00'):null;}
function isDone(r){const s=String(r.status||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return ['concluido','baixado','pago'].includes(s);}
function isReceber(r){return r.rec_desp==='Contas a receber'||r.tipo==='receber';}
function moneyInput(v){return Number(String(v||'').replace(/\./g,'').replace(',','.'))||0;}
function mesDias(mes){const y=+mes.slice(0,4),m=+mes.slice(5,7);return new Date(y,m,0).getDate();}
function addDia(data,n){const d=new Date(data+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fluxoItems(mes=fluxoMes){
  try{normalizeAgendaStore();}catch(_e){}
  // Fluxo diário: pagamentos vêm dos Lançamentos por vencimento.
  // Recebidos vêm somente da Agenda Financeira manual, para não misturar vendas brutas do fechamento mensal.
  const lanc=(store.lancamentos||[]).filter(r=>r.rec_desp!=='Contas a receber'&&agLancData(r).startsWith(mes)).map(r=>({
    id:r.id,source:'lancamento',tipo:'pagar',data:agLancData(r),descricao:r.descricao||r.categoria||'Lançamento',valor:+r.valor||0,status:isDone(r)?'Baixado':'Aberto',categoria:r.categoria||'',subcategoria:r.subcategoria||'',origem:'Lançamentos'
  }));
  const man=bkCombinedReceipts(mes).map(r=>({
    id:r.id,source:r.source,tipo:'receber',data:r.data,descricao:agOrigem(r)||'Recebimento manual',valor:+r.valor||0,status:'Baixado',categoria:r.categoria||'',subcategoria:r.subcategoria||'',origem:'Agenda Financeira'
  }));
  return [...lanc,...man].filter(x=>x.data).sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a.tipo||'').localeCompare(b.tipo||''));
}
function setFluxoMes(delta){fluxoMes=agAddMes(fluxoMes,delta);rFluxo();}
window.setFluxoMes=setFluxoMes;
window.fluxoHoje=function(){fluxoMes=today().slice(0,7);rFluxo();};
window.salvarSaldoInicialFluxo=async function(){
  const v=moneyInput(($('fx-saldo')||{}).value);
  store.cfg.saldoInicialMes=store.cfg.saldoInicialMes||{};
  store.cfg.saldoInicialMes[fluxoMes]=v;
  lsSave(); rFluxo(); toast('Saldo inicial salvo','ok');
  if(fbOk) try{await db.collection('config').doc('main').set({saldoInicialMes:store.cfg.saldoInicialMes},{merge:true});}catch(e){console.warn(e)}
};
function rFluxo(){
  const itens=fluxoItems(fluxoMes);
  const saldoInicial=Object.hasOwn(store.cfg?.saldoInicialMes||{},fluxoMes)?+store.cfg.saldoInicialMes[fluxoMes]:(bkOpeningBalance(fluxoMes)??0);
  const recebido=itens.filter(x=>x.tipo==='receber').reduce((s,x)=>s+x.valor,0);
  const pagPrev=itens.filter(x=>x.tipo==='pagar').reduce((s,x)=>s+x.valor,0);
  const pagReal=itens.filter(x=>x.tipo==='pagar'&&x.status==='Baixado').reduce((s,x)=>s+x.valor,0);
  const abertoPagar=itens.filter(x=>x.tipo==='pagar'&&x.status!=='Baixado').reduce((s,x)=>s+x.valor,0);
  const fim=saldoInicial+recebido-pagPrev;
  const realizado=saldoInicial+recebido-pagReal;
  const hj=today(); const ate7=addDia(hj,7);
  const vencidos=itens.filter(x=>x.tipo==='pagar'&&x.status!=='Baixado'&&x.data<hj).reduce((s,x)=>s+x.valor,0);
  const prox7=itens.filter(x=>x.status!=='Baixado'&&x.data>=hj&&x.data<=ate7);
  let saldo=saldoInicial, pior={data:fluxoMes+'-01',saldo:saldoInicial};
  let rows='';
  for(let d=1;d<=mesDias(fluxoMes);d++){
    const data=`${fluxoMes}-${String(d).padStart(2,'0')}`;
    const dia=itens.filter(x=>x.data===data);
    const recDia=dia.filter(x=>x.tipo==='receber').reduce((s,x)=>s+x.valor,0);
    const pagar=dia.filter(x=>x.tipo==='pagar').reduce((s,x)=>s+x.valor,0);
    const pago=dia.filter(x=>x.tipo==='pagar'&&x.status==='Baixado').reduce((s,x)=>s+x.valor,0);
    saldo+=recDia-pagar;
    if(saldo<pior.saldo)pior={data,saldo};
    const cls=saldo<0?'fx-row-bad':(recDia||pagar)?'fx-row-good':'';
    if(recDia||pagar||data===hj){
      rows+=`<tr class="${cls}"><td class="mono">${fmtD(data)}</td><td class="tr vin">${recDia?fmt(recDia):'—'}</td><td class="tr vout">${pagar?fmt(pagar):'—'}</td><td class="tr">${pago?fmt(pago):'—'}</td><td class="tr ${saldo>=0?'vin':'vout'}">${fmt(saldo)}</td><td>${dia.length?dia.length+' item(ns)':(data===hj?'Hoje':'')}</td></tr>`;
    }
  }
  $('content').innerHTML=`<div>
    <div class="fx-top">
      <div class="fx-card">
        <div class="fx-title">Fluxo de Caixa Corrente</div>
        
        <div class="fx-controls">
          <button class="btn bs" onclick="setFluxoMes(-1)">‹</button><div class="fx-month">${agMesExtenso(fluxoMes)}</div><button class="btn bs" onclick="setFluxoMes(1)">›</button><button class="btn bs" onclick="fluxoHoje()">Hoje</button>
          <div class="fgi"><label class="fl">Saldo inicial do mês</label><input id="fx-saldo" class="fv" inputmode="decimal" value="${saldoInicial?fmtN(saldoInicial):''}" placeholder="0,00"></div><button class="btn bp" onclick="salvarSaldoInicialFluxo()">Salvar saldo</button>
        </div>
      </div>

function auditoriaPlanoSet(){ccEnsureIds();return {ids:new Set((store.centrocusto||[]).filter(c=>c.subcategoria).map(c=>ccRowSubId(c)).filter(Boolean)),pairs:new Set((store.centrocusto||[]).filter(c=>c.categoria&&c.subcategoria).map(c=>(c.categoria+'|||'+c.subcategoria).toLowerCase()))};}
function auditoriaNoPlano(r,plano){if(r.subcategoria_id&&plano.ids.has(r.subcategoria_id))return true;return plano.pairs.has((r.categoria+'|||'+r.subcategoria).toLowerCase());}
function financeSeriesGroups(){
  const groups=new Map();
  (financeRaw.lancamentos||[]).forEach(r=>{const g=r.parcelamento_id||r.recorrencia_id;if(g){if(!groups.has(g))groups.set(g,[]);groups.get(g).push(r);}});
  return groups;
}
function financeSeriesMissing(rows){
  const meta=lancManagedSeriesMeta(rows);
  const parts=rows.map(r=>String(r.parcela_info||'').match(/^(\d+)\/(\d+)$/)).filter(Boolean);
  const total=meta?.total||(parts.length?Math.max(...parts.map(p=>+p[2])):0);
  if(total<2||total>60)return {meta,missing:[],unknown:!meta};
  const indexes=new Set(rows.map(r=>+r.serie_indice||+(String(r.parcela_info||'').split('/')[0])));
  const missing=Array.from({length:total},(_,i)=>i+1).filter(i=>!indexes.has(i));
  return {meta,missing,unknown:false};
}
function auditoriaItens(){
  const out=[],hoje=today(),plano=auditoriaPlanoSet(),byExpense=new Map(),byOccurrence=new Map();
  const add=(sev,tipo,msg,r,impacto=0,extra={})=>out.push({sev,tipo,msg,id:r?.id||'',source:'lancamento',impacto,meta:[r?.descricao||r?.categoria||'',impacto?fmt(impacto):'',r?.data_vencimento?fmtD(r.data_vencimento):''].filter(Boolean),...extra});
  for(const r of store.lancamentos||[]){
    const value=Number(r.valor)||0;
    if(value<=0)continue; // não polui a gestão com cadastros sem impacto financeiro.
    const expense=JSON.stringify([r.rec_desp,lancDateKey(r.data_vencimento),lancMoneyKey(value),...['categoria','subcategoria','forma_pagamento','referencia'].map(k=>lancNormText(r[k])),lancNormText(r.descricao_base||r.descricao)]);
    if(!byExpense.has(expense))byExpense.set(expense,[]);byExpense.get(expense).push(r);
    const group=r.parcelamento_id||r.recorrencia_id;
    const index=r.serie_indice||r.parcela_info||r.data_vencimento;
    const identity=group?group+'|'+index:r._creation_key;
    if(identity){if(!byOccurrence.has(identity))byOccurrence.set(identity,[]);byOccurrence.get(identity).push(r);}
    if(!isDone(r)&&finValidDate(r.data_vencimento)&&r.data_vencimento<hoje)add('Alta','Vencido em aberto','Vencimento ultrapassado sem baixa. Confira o pagamento e registre a efetivação.',r,value);
    if(!finValidDate(r.data_competencia)||!finValidDate(r.data_vencimento))add('Alta','Data financeira inválida','A data impede classificar corretamente o caixa/competência. Corrija o registro.',r,value);
    if(isDone(r)&&!finValidDate(r.data_efetivacao))add('Média','Baixa sem efetivação','Status concluído sem data válida de pagamento/recebimento. Confira o comprovante.',r,value);
    if(!isDone(r)&&r.data_efetivacao)add('Alta','Status incompatível com pagamento','Existe efetivação, mas o status continua aberto. Confira antes de pagar novamente.',r,value);
    if(r.categoria&&r.subcategoria&&!auditoriaNoPlano(r,plano))add('Média','Fora do plano de contas','Revise a classificação para evitar distorção dos indicadores.',r,value);
    if(!r.categoria)add('Média','Despesa sem classificação','Há valor financeiro sem categoria; classifique para compor os indicadores.',r,value);
  }
  const confirmed=new Set();
  for(const rows of byOccurrence.values())if(rows.length>1){
    rows.forEach(r=>confirmed.add(r.id));
    add('Alta','Duplicidade de identidade',`${rows.length} documentos representam a mesma ocorrência. Compare e mantenha o registro correto.`,rows[0],rows.slice(1).reduce((s,r)=>s+(+r.valor||0),0),{ids:rows.map(r=>r.id)});
  }
  for(const rows of byExpense.values())if(rows.length>1&&!rows.every(r=>confirmed.has(r.id)))add('Média','Possível despesa duplicada',`${rows.length} despesas têm descrição, categoria, cartão/forma, vencimento e valor iguais. Pode haver despesas legítimas distintas: compare referências antes de excluir.`,rows[0],rows.slice(1).reduce((s,r)=>s+(+r.valor||0),0),{ids:rows.map(r=>r.id)});
  for(const [gid,rows] of financeSeriesGroups()){
    if(rows.every(r=>r._deleted))continue;
    const {meta,missing,unknown}=financeSeriesMissing(rows),seed=rows.find(r=>!r._deleted);
    if(missing.length)add('Alta',seed.parcelamento_id?'Parcelas ausentes':'Recorrências ausentes',`Faltam ocorrências ${missing.join(', ')}. ${meta?'A reposição exige revisão e mantém as ocorrências já gravadas.':'Histórico sem metadados suficientes para reposição segura; confira o contrato.'}`,seed,meta?lancSeriesMissingValue(rows,missing):0,{gid,repairable:!!meta});
    if(unknown&&seed.recorrencia_id)add('Média','Série antiga sem prazo registrado','Não é possível comprovar o total de meses desta recorrência antiga. Confira o contrato; não foram inventadas ocorrências futuras.',seed,0);
  }
  const agendaGroups=new Map();
  for(const r of financeRaw.agenda_financeira||[]){if(r._deleted||(r.tipo||'receber')==='pagar')continue;const key=agManualKey(r);if(!key||!finValidDate(agDateKey(r.data))){if(+r.valor>0)add('Alta','Recebimento sem data/origem válida','Confira data e origem para classificar este valor na Agenda.',r,+r.valor,{source:'agenda'});continue;}if(!agendaGroups.has(key))agendaGroups.set(key,[]);agendaGroups.get(key).push(r);}
  for(const [key,rows] of agendaGroups){
    const r=agCanonicalRows(rows)[0];if(!r)continue;
    if(rows.length>1)add('Alta','Recebimento com cópias antigas',`${rows.length} registros na mesma data/origem. O total utiliza uma única origem; compare os valores antes de consolidar pelo botão Editar.`,r,Math.max(...rows.map(x=>+x.valor||0)),{source:'agenda',ids:rows.map(x=>x.id),meta:rows.map(x=>`${x.id}: ${fmt(x.valor)}`)});
    if((+r.valor||0)>0&&r.status!=='Baixado'&&finValidDate(r.data)&&r.data<hoje)add('Alta','Recebimento vencido em aberto','Recebimento previsto sem baixa. Confira o extrato.',r,+r.valor,{source:'agenda'});
  }
  if(!financeSync.ready||navigator.onLine===false||Object.values(financeSync.collections).some(s=>s.cached))add('Alta','Base sem confirmação atual','Diagnóstico parcial. Reconecte antes de interpretar os totais ou registrar alterações.',null,0,{source:'sistema'});
  for(const [col,state] of Object.entries(financeSync.collections))if(state.error)add('Alta','Falha de sincronização',`${col}: ${state.error}. Use Reconectar para restabelecer a leitura.`,null,0,{source:'sistema'});
  return out.sort((a,b)=>({Alta:0,Média:1,Baixa:2}[a.sev]-{Alta:0,Média:1,Baixa:2}[b.sev])||b.impacto-a.impacto);
}

async function lancRepairManagedSeries(gid){
  if(!gid)return []; // Nunca dispara escrita a partir de um snapshot/cache.
  finAssertReady(['lancamentos']);
  const rows=financeSeriesGroups().get(gid)||[],meta=lancManagedSeriesMeta(rows);
  if(!meta)throw new Error('Série sem metadados completos. Confira o contrato.');
  const anchor=rows.find(r=>!r._deleted);if(!anchor)throw new Error('Série excluída. Não há reposição autorizada.');
  const immutable=['serie_tipo','serie_total','serie_base_vencimento','serie_valor_total','serie_valor_unitario'];
  if(rows.some(r=>immutable.some(k=>JSON.stringify(r[k]??null)!==JSON.stringify(rows[0][k]??null))||(r.serie_base_competencia||r.serie_base_vencimento)!==(rows[0].serie_base_competencia||rows[0].serie_base_vencimento)))throw new Error('Metadados divergentes. Revise a série antes de repor.');
  const base={...meta.base,status:'Pendente',data_efetivacao:null};delete base._deleted;
  const missing=financeSeriesMissing(rows).missing;
  const candidates=lancApplySeriesPlan(lancBuildSeries(base,meta.type,meta.total,gid),rows).filter(r=>missing.includes(r.serie_indice));
  if(!candidates.length)return [];
  await finTransaction(async tx=>{
    const seedRef=db.collection('lancamentos').doc(anchor.id),seed=await tx.get(seedRef);
    const refs=candidates.map(r=>db.collection('lancamentos').doc(r.id));
    const snaps=await Promise.all(refs.map(ref=>tx.get(ref)));
    if(!seed.exists||finVersion(seed.data())!==finVersion(anchor))throw new Error('Série alterada em outro computador. Reanalise.');
    if(snaps.some(s=>!s.exists))tx.update(seedRef,{_rev:(seed.data()._rev||0)+1,updated_at:firebase.firestore.FieldValue.serverTimestamp()});
    candidates.forEach((r,i)=>{if(!snaps[i].exists)tx.set(refs[i],{...finClean(r),status:'Pendente',data_efetivacao:null,_rev:1,updated_at:firebase.firestore.FieldValue.serverTimestamp()});});
  });return candidates;
}

// ══════════════════════════════════════════════
let agendaMes=today().slice(0,7);
let agHideBaixados=false;
const agTipoLbl=t=>t==='pagar'?'Pagamento':'Recebimento';
const agTipoClass=t=>t==='pagar'?'pag':'rec';
const agPagoLbl=t=>t==='pagar'?'Pago':'Recebido';
const agAbertoLbl=t=>t==='pagar'?'A pagar':'Recebido';
function agAddMes(m,delta){const d=new Date(m+'-01T12:00:00');d.setMonth(d.getMonth()+delta);return d.toISOString().slice(0,7);}
function agMesExtenso(m){const d=new Date(m+'-01T12:00:00');const s=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);}
function agEsc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function agLancData(r){return finValidDate(r?.data_vencimento)?r.data_vencimento:'';}
function agSort(a,b){return (a.data||'').localeCompare(b.data||'') || (a.tipo||'').localeCompare(b.tipo||'') || (a.descricao||'').localeCompare(b.descricao||'');}
function agSum(arr,fn){return arr.filter(fn).reduce((s,x)=>s+(+x.valor||0),0);}

// Regra definitiva: recebimento manual é ÚNICO por DATA + ORIGEM.
// Ex.: 2026-06-24 + Pix sempre grava no mesmo documento e substitui o valor anterior.
// Também normaliza dados antigos onde origem veio como "Manual" e forma/descrição eram Pix/Crédito/Débito/iFood.
function agNorm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');}
function agSlug(v){return agNorm(v).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'recebimento';}
function agDateKey(v){
  if(!v) return '';
  try{
    if(typeof v.toDate==='function') return v.toDate().toISOString().slice(0,10);
    if(typeof v.seconds==='number') return new Date(v.seconds*1000).toISOString().slice(0,10);
    if(v instanceof Date) return v.toISOString().slice(0,10);
  }catch(_e){}
  const s=String(v||'').trim();
  const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const br=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(br) return `${br[3]}-${br[2]}-${br[1]}`;
  return s.slice(0,10);
}
function agTextPool(r){
  if(!r || typeof r!=='object') return String(r||'');
  return [r.origem_canonica,r.forma,r.descricao,r.origem,r.canal,r.meio,r.tipo_recebimento,r.forma_pagamento,r.bandeira,r.nome,r.titulo,r.observacao,r.obs]
    .map(v=>String(v||''))
    .join(' ');
}


function agOrigem(r){
  const canon=agCanonOrigem(r);
  if(canon) return canon;
  const vals=[r?.origem_canonica,r?.forma,r?.descricao,r?.origem,r?.canal,r?.meio,r?.tipo_recebimento,r?.forma_pagamento,r?.bandeira,r?.nome,r?.titulo];
  const proibidos=new Set(['','manual','agenda','agenda manual','recebimento manual','manual agenda','receber','recebimento']);
  return vals.map(v=>String(v||'').trim()).find(v=>v && !proibidos.has(agNorm(v)))||'';
}
function agManualKey(r){
  if(!r) return '';
  if((r.tipo||'receber')==='pagar') return '';
  const data=agDateKey(r.data||r.data_recebimento||r.data_vencimento||r.dt)||'';
  const origem=agCanonOrigem(r)||agOrigem(r);
  const origemKey=agSlug(agCanonOrigem(origem)||origem);
  return data&&origem&&origemKey ? data+'|'+origemKey : '';
}
function agStableId(d){
  const key=agManualKey(d);
  const [data,origem]=key.split('|');
  return 'receb_'+String(data||d.data||'').replace(/[^0-9]/g,'')+'_'+agSlug(origem||d.origem||d.forma||d.descricao);
}
function agPrepareManual(raw){
  const r={...(raw||{})};
  if((r.tipo||'receber')!=='pagar'){
    const data=agDateKey(r.data||r.data_recebimento||r.data_vencimento||r.dt);
    const origem=agOrigem(r);
    r.tipo='receber';
    if(data) r.data=data;
    r.origem=origem;
    r.forma=origem;
    r.descricao=origem||'Recebimento manual';
    r.origem_canonica=origem;
    r.status=r.status||'Baixado';
    r.manual_key=agManualKey(r);
    r.source_type='agenda_manual';
  }
  return r;
}


// Fonte única da Agenda: 1 documento por DATA + ORIGEM, com ID determinístico.
function agCanonicalIdFromKey(key){
  const [data,origem]=String(key||'').split('|');
  return 'receb_'+String(data||'').replace(/[^0-9]/g,'')+'_'+agSlug(origem||'recebimento');
}


function agTs(r){
  const v=r?.updated_at||r?.atualizado_em||r?.criado_em||r?.created_at||'';
  if(v&&typeof v.toMillis==='function') return v.toMillis();
  if(v&&typeof v.seconds==='number') return v.seconds*1000;
  const t=Date.parse(v); return Number.isFinite(t)?t:0;
}
function agCanonOrigem(v){
  const canon=value=>{
    const n=agNorm(value).replace(/[^a-z0-9]+/g,' ').trim();
    if(/\b99 ?food\b/.test(n))return '99Food';
    if(/\bi ?food\b/.test(n))return 'iFood';
    if(/\bpix\b/.test(n))return 'Pix';
    if(/\bcredito\b/.test(n))return 'Crédito';
    if(/\bdebito\b/.test(n))return 'Débito';
    return '';
  };
  if(!v||typeof v!=='object')return canon(v);
  // Campos estruturados têm precedência; observação/descrição nunca muda uma origem explícita.
  for(const field of ['origem_canonica','forma','origem','canal','meio','tipo_recebimento','forma_pagamento','bandeira','descricao','nome','titulo']){
    const c=canon(v[field]);if(c)return c;
  }
  return '';
}
function agCanonicalRows(rows){
  const groups=new Map(),other=[];
  for(const raw of rows||[]){
    if((raw.tipo||'receber')==='pagar'){if(!raw._deleted)other.push({...raw});continue;}
    const r=agPrepareManual(raw),key=agManualKey(r);
    if(!key){if(!raw._deleted)other.push(r);continue;}
    if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r);
  }
  for(const [key,list] of groups){
    const canonical=list.find(r=>r.id===agCanonicalIdFromKey(key));
    // Tombstone canônico impede que um registro legado reapareça depois de excluir/mover.
    if(canonical?._deleted)continue;
    const active=list.filter(r=>!r._deleted).sort((a,b)=>agTs(b)-agTs(a)||String(a.id).localeCompare(String(b.id)));
    const winner=canonical||active[0];if(!winner)continue;
    other.push({...winner,__source_ids:active.map(r=>r.id),manual_key:key});
  }
  return other.sort(agSort);
}
function normalizeAgendaStore(){store.agenda=agCanonicalRows(store.agenda||[]);return store.agenda;}
function agRecebimentosUnicos(rows,mes=''){return agCanonicalRows(rows).filter(r=>(r.tipo||'receber')!=='pagar'&&(!mes||String(r.data||'').startsWith(mes)));}
function agUnificarItensVisiveis(items){
  return [...agRecebimentosUnicos(items.filter(x=>x.source!=='lancamento'&&x.source!=='extrato'&&x.tipo!=='pagar')), ...items.filter(x=>x.source==='extrato'), ...items.filter(x=>x.source==='lancamento'||x.tipo==='pagar')].sort(agSort);
}
function agSnapshotRows(key){return (financeRaw.agenda_financeira||[]).filter(r=>agManualKey(r)===key);}
async function agPersistUniqueManual(raw,oldId='',expected=null){
  finAssertReady(['agenda_financeira','extratos_bancarios']);
  bkAssertManualDate(raw);
  const item=agPrepareManual(raw),key=agManualKey(item),stableId=agCanonicalIdFromKey(key);
  if(!finValidDate(item.data)||!agCanonOrigem(item)||!Number.isFinite(+item.valor)||+item.valor<=0)throw new Error('Data, origem ou valor inválido.');
  item.valor=lancRoundMoney(item.valor);if(item.valor<=0||!Number.isSafeInteger(Math.round(item.valor*100)))throw new Error('Valor inválido em centavos.');
  const old=oldId?(expected||finExpected('agenda_financeira',oldId)):null;
  if(oldId&&!old)throw new Error('Registro não encontrado. Reabra a Agenda.');
  const oldKey=old?agManualKey(old):key;
  const known=[...agSnapshotRows(key),...agSnapshotRows(oldKey)];
  const ids=[...new Set([stableId,agCanonicalIdFromKey(oldKey),...known.map(r=>r.id),...(oldId?[oldId]:[])])];
  if(ids.length>200)throw new Error('Muitas cópias antigas desta origem. Consulte a auditoria antes de editar.');
  await finTransaction(async tx=>{
    const refs=ids.map(id=>db.collection('agenda_financeira').doc(id));
    const snaps=await Promise.all(refs.map(r=>tx.get(r)));
    const actual=snaps.map((s,i)=>s.exists?{...s.data(),id:ids[i]}:null).filter(Boolean);
    const current=agCanonicalRows(actual).find(r=>agManualKey(r)===key);
    if(old){
      const currentOld=actual.find(r=>r.id===oldId);
      if(!currentOld||currentOld._deleted||finVersion(currentOld)!==finVersion(old))throw new Error('Recebimento alterado em outro computador. Reabra para conferir antes de salvar.');
      // Compare também a chave canônica: uma aba antiga pode estar editando um documento legado.
      const oldCanonical=actual.find(r=>r.id===agCanonicalIdFromKey(oldKey));
      const knownCanonical=Object.hasOwn(old,'__canonicalBaseline')?old.__canonicalBaseline:known.find(r=>r.id===agCanonicalIdFromKey(oldKey));
      if(finVersion(oldCanonical)!==finVersion(knownCanonical))throw new Error('A origem foi alterada em outro computador. Reabra o recebimento.');
      if(key!==oldKey&&current)throw new Error('Já há um recebimento na nova data/origem. Edite esse recebimento para evitar sobrescrever valores.');
    }else if(current){
      if(lancMoneyKey(current.valor)===lancMoneyKey(item.valor)&&current.status===item.status)return;
      throw new Error('Já existe recebimento nesta data/origem. Use Editar para alterar o total recebido.');
    }
    const now=firebase.firestore.FieldValue.serverTimestamp();
    // Migração por chave, com preservação dos registros antigos e sem limpeza assíncrona.
    for(let i=0;i<ids.length;i++){
      if(ids[i]===stableId)continue;
      const row=actual.find(r=>r.id===ids[i]);
      if(row&&[key,oldKey].includes(agManualKey(row))&&!row._deleted)tx.update(refs[i],{_deleted:true,_superseded_by:stableId,_rev:(row._rev||0)+1,updated_at:now});
    }
    if(oldKey!==key){
      const oldCanonical=agCanonicalIdFromKey(oldKey);
      tx.set(db.collection('agenda_financeira').doc(oldCanonical),{...finClean(old),manual_key:oldKey,_deleted:true,_superseded_by:stableId,updated_at:now},{merge:true});
    }
    const target=actual.find(r=>r.id===stableId);
    tx.set(db.collection('agenda_financeira').doc(stableId),{...finClean(item),_deleted:false,_integrity:1,_rev:(target?._rev||0)+1,manual_key:key,criado_em:old?.criado_em||new Date().toISOString(),updated_at:now});
  });
  return {...item,id:stableId};
}
async function agDeleteReceipts(items){
  finAssertReady(['agenda_financeira']);
  const captured=items.map(item=>({item:{...item},key:agManualKey(item),rows:agSnapshotRows(agManualKey(item)).map(r=>({...r}))}));
  for(const c of captured){const current=agCanonicalRows(c.rows).find(r=>agManualKey(r)===c.key);if(!current||finVersion(current)!==finVersion(c.item))throw new Error('Recebimento alterado. Reanalise antes de excluir.');}
  const ids=[...new Set(captured.flatMap(c=>[agCanonicalIdFromKey(c.key),...c.rows.map(r=>r.id)]))];
  if(ids.length>200)throw new Error('Selecione até 200 registros por vez.');
  await finTransaction(async tx=>{
    const refs=ids.map(id=>db.collection('agenda_financeira').doc(id));
    const snaps=await Promise.all(refs.map(r=>tx.get(r)));
    const actual=snaps.map((s,i)=>s.exists?{...s.data(),id:ids[i]}:null);
    for(const c of captured){
      for(const id of [agCanonicalIdFromKey(c.key),...c.rows.map(r=>r.id)]){
        const before=c.rows.find(r=>r.id===id)||null,now=actual.find(r=>r?.id===id)||null;
        if(finVersion(before)!==finVersion(now))throw new Error('Recebimento alterado em outro computador. Reanalise antes de excluir.');
      }
    }
    const stamp=firebase.firestore.FieldValue.serverTimestamp();
    captured.forEach(c=>tx.set(db.collection('agenda_financeira').doc(agCanonicalIdFromKey(c.key)),{...finClean(c.item),_deleted:true,_rev:(c.item._rev||0)+1,deleted_at:new Date().toISOString(),updated_at:stamp},{merge:true}));
    actual.forEach((r,i)=>{if(r&&!r._deleted)tx.update(refs[i],{_deleted:true,deleted_at:new Date().toISOString(),updated_at:stamp});});
  });
}
function agUniqueReceiptKey(r){return agManualKey(r);}


function agManualMesItems(mes=agendaMes){
  normalizeAgendaStore();

  return agRecebimentosUnicos(store.agenda||[],mes).map(r=>{
    const origem=agCanonOrigem(r)||agOrigem(r)||'Recebimento manual';
    return {
      ...r,
      id:r.id,
      manual_key:agUniqueReceiptKey(r)||r.manual_key,
      source:'manual',
      tipo:'receber',
      descricao:origem,
      forma:origem,
      status:r.status||'Baixado',
      valor:+r.valor||0,
      origem:'Manual'
    };
  }).sort(agSort);
}
function agLancMesItems(mes=agendaMes){
  return (store.lancamentos||[]).filter(r=>r.rec_desp!=='Contas a receber'&&agLancData(r).startsWith(mes)).map(r=>({
    id:'l_'+r.id,
    lancId:r.id,
    source:'lancamento',
    tipo:'pagar',
    data:agLancData(r),
    descricao:r.descricao||r.categoria||'Lançamento',
    valor:+r.valor||0,
    status:r.status==='Concluído'?'Baixado':'Aberto',
    forma:r.forma_pagamento||'',
    conta:r.instituicao||'',
    categoria:r.categoria||'',
    subcategoria:r.subcategoria||'',
    data_baixa:r.data_efetivacao||'',
    origem:'Automático · Lançamentos'
  })).filter(x=>x.data).sort(agSort);
}
function agAllMesItems(mes=agendaMes){return agUnificarItensVisiveis([...bkCombinedReceipts(mes),...agLancMesItems(mes)]).sort(agSort);}
function agMesItems(){const all=agAllMesItems();return agHideBaixados?all.filter(x=>x.status!=='Baixado'):all;}
window.agSetMes=function(delta){agendaMes=agAddMes(agendaMes,delta);rAgenda();};
window.agHoje=function(){agendaMes=today().slice(0,7);rAgenda();};
window.agToggleBaixados=function(){agHideBaixados=!agHideBaixados;rAgenda();};

function agendaForm(r={},presetTipo='',presetData=''){
  const data=r.data||presetData||today();
  const origem=(r.origem||r.forma||r.descricao||'').trim();
  const origens=['iFood','99Food','Crédito','Débito','Pix'];
  return `<div class="fg">

async function financeAction(fn,message){

window.svL=async function(id){
  if(lancSaveInProgress)return;
  lancSetSaveBusy(true);
  try{
    const d=getLancD(),rec=id?'unica':$('f-rec')?.value||'unica';
    if(!d.categoria||!Number.isFinite(d.valor)||d.valor<=0)throw new Error('Informe categoria e valor positivo.');
    if(id){
      if(!finValidDate(d.data_competencia)||!finValidDate(d.data_vencimento))throw new Error('Informe competência e vencimento válidos.');
      const base=financeBaseline?.id===id?financeBaseline:finExpected('lancamentos',id);
      if(!base)throw new Error('Registro indisponível. Reabra a tela.');
      d.data_efetivacao=d.status==='Concluído'?(base.data_efetivacao||today()):null;
      if(financeSeriesBaseline&&lancLinkedSeriesId(base))await lancSaveSeriesEdit(financeSeriesBaseline,d,$('f-series-scope')?.value||'all');
      else await finUpdateMany([{col:'lancamentos',id,expected:base,patch:d}]);
    }else{
      const count=rec==='parcelada'?Number($('f-np').value):rec==='recorrente'?Number($('f-nm').value):1;
      if(rec!=='unica'&&count<2)throw new Error('Informe ao menos duas ocorrências.');
      d.data_efetivacao=d.status==='Concluído'?today():null;
      await lancCreate(d,rec,count);
    }
    cM();safeRender(CM);toast('Gravação confirmada no servidor ✅','ok');
  }catch(e){console.error('[Financeiro:salvar]',e);toast(e.message||'Falha ao salvar.','er');}
  finally{lancSetSaveBusy(false);}
};

  function partners(model,rows,ms){

      <div class="bk-two"><section class="bk-panel"><h2>Descrição dos repasses</h2>${table(['Descrição no extrato','Total','Pagamentos'],cats.map(c=>cells([c,money(-sum(rs.filter(r=>r.subtype===c),r=>r.cents)),rs.filter(r=>r.subtype===c).length])))}</section>
      <section class="bk-panel"><h2>Entradas vindas dos sócios</h2>${table(['Sócio','Créditos recebidos'],names.map(n=>cells([n,money(sum(rows.filter(r=>r.person===n&&r.cents>0),r=>r.cents))])))}</section></div>
      <section class="bk-panel"><div class="bk-section-title"><h2>Detalhe dos repasses</h2><label>Sócio <select data-bank-filter="person"><option value="">Todos</option>${names.map(n=>`<option ${state.person===n?'selected':''}>${n}</option>`).join('')}</select></label></div>${paged(rs.filter(r=>!state.person||r.person===state.person).sort((a,b)=>b.date.localeCompare(a.date)))}</section>`;
  }
  function reconcile(model){
    if(!ledgerReady())return '<section class="bk-panel"><h2>Conciliação aguardando Lançamentos</h2><p>Aguardando atualização dos lançamentos…</p></section>';
    const rs=model.reconciliation.filter(scope),statuses=['Provável por valor, data e descrição','Revisar valor e data','Múltiplas correspondências possíveis','Sem correspondência no critério'];
    const filtered=rs.filter(r=>(!state.status||r.reconciliation===state.status)&&(!state.search||BurgerBankCore.norm(r.note+' '+r.counterpart+' '+r.category+' '+r.candidates.map(c=>c.description).join(' ')).includes(BurgerBankCore.norm(state.search)))).sort((a,b)=>a.cents-b.cents);
    const missing=model.unmatchedLedger.filter(r=>scope({month:r.date.slice(0,7)}));
    return `<div class="bk-kpis">${statuses.map(s=>card(s,money(-sum(rs.filter(r=>r.reconciliation===s),r=>r.cents)),`${rs.filter(r=>r.reconciliation===s).length} débitos`)).join('')}</div>

    <div class="bk-controls"><label>Situação <select data-bank-filter="status"><option value="">Todas</option>${statuses.map(s=>`<option ${state.status===s?'selected':''}>${E(s)}</option>`).join('')}</select></label><label>Descrição <input data-bank-search value="${E(state.search)}" placeholder="Buscar despesa ou descrição"></label><button data-bank-export="reconciliation">Exportar este filtro</button></div>${paged(filtered,true)}</section>
    <section class="bk-panel"><h2>Lançamentos sem candidato no extrato</h2><p class="bk-muted">${missing.length} registros · ${money(sum(missing,r=>r.cents))}</p><details><summary>Ver registros</summary>${table(['Data usada','Descrição','Valor','Situação','Forma','Base da data'],missing.map(r=>cells([date(r.date),r.description,money(r.cents),r.status,r.payment,r.dateBasis])))}</details></section>`;
  }
  function sources(model,rows){
    let visible=rows.filter(r=>!state.search||BurgerBankCore.norm(r.note+' '+r.counterpart+' '+r.category+' '+r.history).includes(BurgerBankCore.norm(state.search)));
    if(state.status==='outlier'){const ids=new Set(model.unusual.map(r=>r.id));visible=visible.filter(r=>ids.has(r.id));}
    return `<section class="bk-panel"><h2>Arquivos e conferência de saldos</h2>${table(['Mês','Arquivo','Movimentos','Saldos diários','Diferença'],state.statements.map(s=>`<tr>${td(month(s.month))}${td(s.name)}${td(s.rows.length)}${td(s.daily.length)}${td(money(model.monthly.find(m=>m.month===s.month).balanceDifference))}</tr>`))}
    ${state.ignored.length?`<details><summary>${state.ignored.length} arquivos repetidos ignorados na última importação</summary><ul>${state.ignored.map(s=>`<li>${E(s.name)} repete ${E(s.duplicateOf)}</li>`).join('')}</ul></details>`:''}
</section>
    <section class="bk-panel"><div class="bk-section-title"><h2>${state.status==='outlier'?'Saídas fora do padrão':'Movimentos do extrato'}</h2><button data-bank-export="bank">Exportar este filtro</button></div><div class="bk-controls"><label>Descrição <input data-bank-search value="${E(state.search)}" placeholder="Buscar no extrato"></label>${state.status==='outlier'?'<button data-bank-attention="">Ver todos os movimentos</button>':''}</div>${paged(visible.sort((a,b)=>b.date.localeCompare(a.date)))}</section>`;
  }
  function receiptView(model,ms){
    const docs=bkCloudMonths().filter(d=>scope({month:d.month})),auto=bkBankReceipts().filter(r=>scope({month:r.data.slice(0,7)})),suppressed=bkSuppressedManual().filter(r=>scope({month:r.data.slice(0,7)}));
    const included=sum(docs,d=>d.receipts.included),excluded=sum(docs,d=>d.receipts.excluded);
    const origins=[...new Set(auto.map(r=>r.forma))].sort();
    return `<div class="bk-kpis">${card('Recebimentos na Agenda',money(included),`${auto.length} totais por dia e origem`)}${card('Créditos a identificar',money(excluded),'Origem pendente')}${card('Manuais preservados',suppressed.length+' registros','Histórico anterior ao extrato')}${card('Atualização','Na importação','Agenda e Fluxo de Caixa')}</div>
    <section class="bk-panel"><h2>Agenda Financeira e Fluxo de Caixa</h2>
    ${table(['Mês',...origins,'Total automático','Créditos a identificar'],ms.map(m=>{const doc=docs.find(d=>d.month===m.month);return cells([month(m.month),...origins.map(o=>doc?money(sum(auto.filter(r=>r.data.startsWith(m.month)&&r.forma===o),r=>r.bank_cents)):'—'),doc?money(doc.receipts.included):'Sem extrato',doc?money(doc.receipts.excluded):'—']);}))}</section>
    <section class="bk-panel"><h2>Conferência dos manuais anteriores</h2>${table(['Dia','Origem manual','Valor manual preservado','Extrato na mesma origem','Diferença','Total bancário do dia'],suppressed.map(r=>cells([date(r.data),r.descricao,money(Math.round(r.valor*100)),r.automatic===null?'Outra classificação':money(Math.round(r.automatic*100)),r.automatic===null?'Revisar classificação':money(Math.round((r.automatic-r.valor)*100)),money(Math.round(r.automaticDay*100))])))}</section>
    <section class="bk-panel"><h2>Recebimentos diários automáticos</h2>${table(['Dia','Origem','Créditos agrupados','Valor','Fonte'],auto.map(r=>cells([date(r.data),r.forma,r.bank_count,money(r.bank_cents),'Extrato bancário'])))}</section>`;
  }
  function render(){
    if(CM!=='extratos')return;
    const c=$('content');c.classList.add('bank-content');
    if(!state.ready){c.innerHTML='<div class="bk-page"><p>Carregando extratos…</p></div>';return;}
    const model=BurgerBankCore.analyze(state.statements,ledgerReady()?store.lancamentos:[]);state.model=model;
    const months=model.monthly.map(r=>r.month);if(state.from&&!months.includes(state.from))state.from='';if(state.to&&!months.includes(state.to))state.to='';
    const ms=model.monthly.filter(scope),rows=model.bank.filter(scope);
    const tabs=[['overview','Visão executiva'],['monthly','Despesa × Receita mensal'],['partners','Sócios'],['receipts','Recebimentos automáticos'],['reconcile','Conciliação'],['sources','Extratos e fontes']];
    c.innerHTML=`<div class="bk-page"><header class="bk-header"><div><h1>Despesa × Receita</h1></div><div><input id="bk-files" type="file" accept=".xlsx" multiple hidden><button class="bk-primary" data-bank-import ${state.busy?'disabled':''}>${state.busy?'Conferindo arquivos…':'Importar extratos XLSX'}</button></div></header>
    ${state.message?`<p class="bk-notice" role="status">${E(state.message)}</p>`:''}${state.pending.length?`<p class="bk-notice">${state.pending.length} arquivos aguardam gravação. <button data-bank-retry ${state.busy?'disabled':''}>Tentar gravar</button></p>`:''}${!state.cloudConfirmed?'<p class="bk-notice">Atualização pendente. Confira sua conexão.</p>':''}
    ${!state.statements.length?`<section class="bk-panel bk-empty"><h2>Importe os extratos mensais</h2><p>Selecione os arquivos XLSX do Sicoob para começar.</p></section>`:`<nav class="bk-tabs" aria-label="Análise bancária">${tabs.map(([id,label])=>`<button data-bank-tab="${id}" aria-current="${id===state.tab?'page':'false'}">${label}</button>`).join('')}</nav>
    <div class="bk-controls bk-period"><label>De <select data-bank-filter="from"><option value="">Primeiro mês</option>${months.map(m=>`<option value="${m}" ${state.from===m?'selected':''}>${E(month(m))}</option>`).join('')}</select></label><label>Até <select data-bank-filter="to"><option value="">Último mês</option>${months.map(m=>`<option value="${m}" ${state.to===m?'selected':''}>${E(month(m))}</option>`).join('')}</select></label><button data-bank-reset>Limpar filtros</button><span>${rows.length.toLocaleString('pt-BR')} movimentos · ${ms.filter(m=>m.available).length} meses com extrato</span></div>
    ${financeSync.collections.lancamentos?.error||!navigator.onLine?'<p class="bk-notice">Sem conexão. Exibindo os últimos dados salvos.</p>':''}
    ${!rows.length&&ms.every(m=>!m.available)?'<section class="bk-panel"><h2>Sem extrato neste intervalo</h2><p>Selecione outro mês ou importe o arquivo ausente.</p></section>':state.tab==='overview'?overview(model,rows,ms):state.tab==='monthly'?monthly(model,ms):state.tab==='partners'?partners(model,rows,ms):state.tab==='receipts'?receiptView(model,ms):state.tab==='reconcile'?reconcile(model):sources(model,rows)}`}
    </div>`;
    bind(c);
  }
  function bind(c){
    c.querySelector('[data-bank-import]')?.addEventListener('click',()=>c.querySelector('#bk-files').click());
    c.querySelector('#bk-files')?.addEventListener('change',e=>importFiles([...e.target.files]));
    c.querySelectorAll('[data-bank-tab]').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.bankTab;state.page=1;state.status='';state.search='';render();c.scrollTop=0;}));
    c.querySelectorAll('[data-bank-filter]').forEach(el=>el.addEventListener('change',()=>{state[el.dataset.bankFilter]=el.value;if(state.from&&state.to&&state.from>state.to){state.to=state.from;}state.page=1;render();}));
    c.querySelector('[data-bank-reset]')?.addEventListener('click',()=>{state.from='';state.to='';state.search='';state.status='';state.person='';state.page=1;render();});
    c.querySelectorAll('[data-bank-page]').forEach(el=>el.addEventListener('click',()=>{state.page=Number(el.dataset.bankPage);render();}));
    c.querySelectorAll('[data-bank-detail]').forEach(el=>el.addEventListener('click',()=>detail(el.dataset.bankDetail)));
    c.querySelector('[data-bank-retry]')?.addEventListener('click',async()=>{if(state.busy)return;state.busy=true;state.message='';render();try{await persistPending();}catch(e){state.message='Gravação não confirmada: '+e.message;}finally{state.busy=false;render();}});
    c.querySelectorAll('[data-bank-export]').forEach(el=>el.addEventListener('click',()=>exportCsv(el.dataset.bankExport)));
    c.querySelectorAll('[data-bank-attention]').forEach(el=>el.addEventListener('click',()=>{state.tab='sources';state.status=el.dataset.bankAttention;state.page=1;render();}));
    c.querySelector('[data-bank-search]')?.addEventListener('change',e=>{state.search=e.target.value;state.page=1;render();});
  }
  async function persistPending(){
    if(!state.pending.length)return;
    finAssertReady(['extratos_bancarios']);
    const incoming=state.pending,next=await BurgerBankImport.merge(state.statements,incoming);
    const ack=await BurgerBankCloud.persist(db,incoming,()=>firebase.firestore.FieldValue.serverTimestamp(),fn=>finTransaction(fn),RECEIPT_POLICY);
    const confirmed=new Map(state.statements.map(s=>[s.month,s]));ack.documents.forEach(d=>confirmed.set(d.statement.month,d.statement));
    state.statements=[...confirmed.values()].sort((a,b)=>a.month.localeCompare(b.month));state.ignored=next.ignored;state.pending=[];state.cloudConfirmed=true;
    state.message=`Importação concluída: ${ack.created} meses incluídos; ${ack.updated} atualizados; ${ack.duplicates} períodos já importados.`;
    try{await save({statements:state.statements,ignored:state.ignored,pending:[]});}catch(e){state.message+=' Dados salvos; cópia offline indisponível.';}
  }
  async function importFiles(files){
    if(state.busy||!files.length)return;state.busy=true;state.message='';render();
    try{
      const incoming=[];for(const f of files){if(!/\.xlsx$/i.test(f.name))throw Error('Selecione apenas arquivos XLSX');const parsed=await BurgerBankImport.readXlsx(f);incoming.push(...(Array.isArray(parsed)?parsed:[parsed]));}
      await BurgerBankImport.merge(state.statements,incoming);
      state.pending=incoming;
      try{await save({statements:state.statements,ignored:state.ignored,pending:incoming});}catch(e){state.message='Cache local indisponível. ';}
      await persistPending();
    }catch(e){state.message+=' Gravação não confirmada: '+e.message+' '+(state.pending.length?'O lote está pendente. Use Tentar gravar após reconectar.':'A base existente foi preservada.');}finally{state.busy=false;render();}
  }
  function detail(id){
    const r=state.model.bank.find(r=>r.id===id);if(!r)return;
    const match=state.model.reconciliation.find(t=>t.id===id),outlier=state.model.unusual.find(t=>t.id===id);
    document.getElementById('bk-dialog')?.remove();const dlg=document.createElement('dialog');dlg.id='bk-dialog';dlg.className='bk-dialog';
    dlg.innerHTML=`<div class="bk-section-title"><h2>Conferir movimento</h2><button data-close>Fechar</button></div><p><b>${date(r.date)} · ${money(r.cents)}</b></p><p>${E(r.file)} · aba LANÇAMENTOS · linha ${r.row}</p><pre>${E(r.history+'\n'+r.info)}</pre><p>Grupo: ${E(r.category)}${r.subtype?' · '+E(r.subtype):''}</p>${outlier?`<p>Faixa superior calculada: ${money(Math.round(outlier.threshold))}. Grupo de ${outlier.groupSize} pagamentos comparáveis.</p>`:''}
    ${match?`<h3>${E(match.reconciliation)}</h3>${table(['Despesa registrada','Valor','Data usada','Base','Status','Forma','Conta'],match.candidates.map(e=>{const l=state.model.ledger.find(l=>l.id===e.ledgerId);return cells([l.description,money(l.cents),date(l.date),l.dateBasis,l.status,l.payment,l.account]);}))}<p>Correspondências são sugestões. Confirme o comprovante antes de alterar qualquer lançamento.</p>`:''}`;
    document.body.appendChild(dlg);dlg.querySelector('[data-close]').onclick=()=>dlg.close();dlg.addEventListener('close',()=>dlg.remove());dlg.showModal();
  }
  function exportCsv(type){
    let rows=(type==='reconciliation'?state.model.reconciliation:state.model.bank).filter(scope);
    if(type==='reconciliation'&&state.status)rows=rows.filter(r=>r.reconciliation===state.status);
    if(type==='bank'&&state.status==='outlier'){const ids=new Set(state.model.unusual.map(r=>r.id));rows=rows.filter(r=>ids.has(r.id));}
    if(state.search)rows=rows.filter(r=>BurgerBankCore.norm(r.note+' '+r.counterpart+' '+r.category+' '+(type==='reconciliation'?r.candidates.map(c=>c.description).join(' '):r.history)).includes(BurgerBankCore.norm(state.search)));
    const quote=v=>{let s=String(v??'');if(/^[=+@\t\r]/.test(s)||/^-(?!\d)/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
    const header=['Data','Descrição','Favorecido','Categoria','Sócio','Tipo repasse','Valor BRL','Situação conciliação','Candidatos','Arquivo','Linha'];
    const csv='\ufeff'+[header,...rows.map(r=>[r.date,r.note,r.counterpart,r.category,r.person,r.subtype,(r.cents/100).toFixed(2).replace('.',','),r.reconciliation||'',r.candidates?.map(c=>c.description).join(' | ')||'',r.file,r.row])].map(row=>row.map(quote).join(';')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`burger-${type}-${state.from||'inicio'}-${state.to||'fim'}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  window.rExtratos=render;
  function acceptCloud(docs){
    state.statements=docs.filter(d=>!d._deleted&&[1,2].includes(d.schemaVersion)&&d.statement).map(d=>d.statement).sort((a,b)=>a.month.localeCompare(b.month));state.cloudConfirmed=true;state.ready=true;
    save({statements:state.statements,ignored:state.ignored,pending:state.pending}).catch(()=>{});
    if(CM==='extratos')safeRender(CM);
  }
  window.BurgerBankUI={state,render,importFiles,acceptCloud,persistPending};
  storage('readonly',os=>os.get('statements')).then(saved=>{if(saved?.statements&&!state.cloudConfirmed){state.statements=saved.statements;state.ignored=saved.ignored||[];}if(saved?.pending?.length)state.pending=saved.pending;}).catch(e=>{state.message='Cache local indisponível: '+e.message;}).finally(()=>{state.ready=true;render();});
})();

// ── INIT ────────────────────────────────────────────────
(async function(){
  // Limpa caches antigos pesados/corrompidos e evita renderizar milhares de lançamentos antes do Firebase responder.
  try{ lsLoad(); }catch(e){ console.warn('Cache leve indisponível', e); }
  $('content').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx2);gap:8px"><div style="width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite"></div>Conectando…</div>`;

  const sdkOk = await ensureFirebaseScripts();
  if(!sdkOk){
    fbOk=false;
    setStatus('● Firebase SDK indisponível','var(--wa)');
  } else {
    initFirebase();
  }
  if(fbOk){
    try{
      const ok = await Promise.race([
        loadAll(),
        new Promise(resolve=>setTimeout(()=>resolve(false),12000))
      ]);
      if(ok){
        render(CM||'visaogeral');
        return;
      }
      setStatus('● Firebase demorou','var(--wa)');
    }catch(e){
      setStatus('● offline','var(--er)');
      console.warn('Falha no carregamento inicial:', e);
    }
  } else {
    setStatus('● local (sem Firebase)','var(--wa)');
  }

  if(!(store.lancamentos||[]).length){
    $('content').innerHTML=`<div class="es"><div class="em">⚠️</div><h3>Firebase ainda não carregou</h3><p>O sistema abriu sem travar, mas ainda não recebeu os lançamentos. Aguarde alguns segundos e recarregue se necessário.</p></div>`;
    return;
  }
  render(CM||'visaogeral');
})();
</script>
