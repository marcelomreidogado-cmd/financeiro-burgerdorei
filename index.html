<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e14;--s1:#131620;--s2:#1a1f2e;--s3:#222840;
  --bd:#252b3b;--bd2:#2e3650;
  --acc:#f97316;--acc2:#fb923c;--acc3:rgba(249,115,22,.12);
  --ok:#22c55e;--ok2:rgba(34,197,94,.12);
  --er:#ef4444;--er2:rgba(239,68,68,.12);
  --wa:#eab308;--wa2:rgba(234,179,8,.12);
  --in:#3b82f6;--in2:rgba(59,130,246,.12);
  --pu:#a855f7;--pu2:rgba(168,85,247,.12);
  --tx:#e2e8f0;--tx2:#7d8ba8;--tx3:#3f4a63;
  --r:10px;--sw:218px;--hh:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
#app{display:flex;height:100vh}

/* SIDEBAR */
#sb{width:var(--sw);min-width:var(--sw);background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:width .22s ease;z-index:20;overflow:hidden}
#sb.col{width:52px;min-width:52px}
.sb-logo{height:var(--hh);display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-ico{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#c2410c);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:12px;color:#fff;flex-shrink:0;letter-spacing:-1px}
.sb-nm{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;white-space:nowrap;transition:opacity .15s}
#sb.col .sb-nm{opacity:0;pointer-events:none}
#sb.col #sb-logo-img{height:28px}
.sb-sec{padding:10px 8px 3px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;white-space:nowrap;overflow:hidden;flex-shrink:0;transition:opacity .15s}
#sb.col .sb-sec{opacity:0}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:1px 5px;border-radius:8px;cursor:pointer;transition:background .12s;white-space:nowrap;overflow:hidden;flex-shrink:0}
.ni:hover{background:var(--s2)}.ni.act{background:var(--acc3);color:var(--acc)}
.ni .ic{font-size:14px;flex-shrink:0;width:20px;text-align:center}
.ni .lb{font-size:13px;font-weight:500;transition:opacity .15s;overflow:hidden;text-overflow:ellipsis}
#sb.col .lb{opacity:0;pointer-events:none}
.sb-tog{margin-top:auto;height:42px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--bd);cursor:pointer;color:var(--tx2);font-size:15px;transition:color .12s;flex-shrink:0}
.sb-tog:hover{color:var(--acc)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:var(--hh);min-height:var(--hh);background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0}
#topbar h1{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;flex:1}
.chip{background:var(--s2);border:1px solid var(--bd);padding:3px 9px;border-radius:20px;font-size:11px;color:var(--tx2);font-family:'DM Mono',monospace}

/* MONTH TABS */
#month-nav{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 18px;display:none;flex-shrink:0;overflow-x:auto}
#month-nav.show{display:flex;align-items:center;gap:2px}
.yr-group{display:flex;align-items:center;gap:2px;flex-shrink:0;padding:6px 0}
.yr-lbl{font-size:11px;font-weight:600;color:var(--tx3);padding:0 6px;flex-shrink:0}
.m-tab{padding:4px 10px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;color:var(--tx2);transition:all .12s;flex-shrink:0;border:1px solid transparent}
.m-tab:hover{color:var(--tx);background:var(--s2)}
.m-tab.act{background:var(--acc3);color:var(--acc);border-color:rgba(249,115,22,.3)}
.m-tab.all{background:var(--s2);color:var(--tx2)}
.m-tab.all.act{background:var(--acc3);color:var(--acc)}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:16px 18px}

/* KPIS */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--acc))}
.kpi-l{font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--tx2);text-transform:uppercase;margin-bottom:4px}
.kpi-v{font-family:'Syne',sans-serif;font-weight:700;font-size:19px}
.kpi-s{font-size:11px;color:var(--tx3);margin-top:2px}

/* TOOLBAR */
.tb{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:9px 11px;display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.sw-wrap{position:relative;flex:1;min-width:140px}
.sw-wrap input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:7px 9px 7px 29px;color:var(--tx);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.sw-wrap input:focus{border-color:var(--acc)}
.sw-wrap .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:13px}
select.fc,input.fc{background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;color:var(--tx);font-size:13px;outline:none;font-family:inherit;cursor:pointer;transition:border-color .15s}
select.fc:focus,input.fc:focus{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;border:none;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .12s;white-space:nowrap}
.bp{background:var(--acc);color:#fff}.bp:hover{background:var(--acc2)}
.bs{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}.bs:hover{border-color:var(--acc);color:var(--acc)}
.bd2{background:var(--er2);color:var(--er);border:1px solid rgba(239,68,68,.2)}.bd2:hover{background:rgba(239,68,68,.25)}
.bpu{background:var(--pu2);color:var(--pu);border:1px solid rgba(168,85,247,.2)}
.btn-s{padding:5px 9px;font-size:12px}.btn-i{padding:5px;width:28px;height:28px;justify-content:center}

/* TABLE */
.tw{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:auto;max-height:min(68vh, calc(100vh - 285px));overscroll-behavior:contain}
.tw table{width:100%;border-collapse:collapse}
.tw thead tr{background:var(--s2);border-bottom:1px solid var(--bd)}
.tw th{padding:8px 11px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--tx2);text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:4;background:var(--s2);box-shadow:0 1px 0 var(--bd)}
.tw th:hover{color:var(--tx)}.tw th.srt{color:var(--acc)}
.tw td{padding:8px 11px;border-bottom:1px solid var(--bd);border-right:1px solid rgba(255,255,255,.035);font-size:13px;vertical-align:middle}
.tw tr:last-child td{border-bottom:none}
.tw tbody tr:hover{background:rgba(255,255,255,.022)}
.tw tbody tr.sel{background:rgba(249,115,22,.1);outline:1px solid rgba(249,115,22,.35);outline-offset:-1px}
.tw tbody tr.sel:hover{background:rgba(249,115,22,.14)}
.tw tbody tr.sel td{color:var(--tx)}
.vencido-item:hover{background:rgba(239,68,68,.08)!important}
.pend-item:hover{background:rgba(249,115,22,.06)!important}
.tr{text-align:right}.tc{text-align:center}
.mono{font-family:'DM Mono',monospace}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* BADGES */
.bg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bgreen{background:var(--ok2);color:var(--ok)}.bred{background:var(--er2);color:var(--er)}
.byel{background:var(--wa2);color:var(--wa)}.bblue{background:var(--in2);color:var(--in)}
.bgray{background:var(--s2);color:var(--tx2)}.borange{background:var(--acc3);color:var(--acc)}
.bpu2{background:var(--pu2);color:var(--pu)}

.vin{color:var(--ok);font-family:'DM Mono',monospace}
.vout{color:var(--er);font-family:'DM Mono',monospace}

/* MODAL */
.mb{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mb.op{display:flex;animation:fi .15s ease}
@keyframes fi{from{opacity:0}}
.mo{background:var(--s1);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:580px;max-height:92vh;display:flex;flex-direction:column;animation:su .18s ease}
.mo-lg{max-width:720px}
@keyframes su{from{transform:translateY(16px);opacity:0}}
.mh{padding:15px 17px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:9px}
.mt{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;flex:1}
.mbody{padding:17px;overflow-y:auto;flex:1}
.mf{padding:11px 17px;border-top:1px solid var(--bd);display:flex;gap:7px;justify-content:flex-end}

/* FORM */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fgi{display:flex;flex-direction:column;gap:4px}
.fgi.full{grid-column:1/-1}
.fl{font-size:11px;font-weight:600;color:var(--tx2);letter-spacing:.04em}
.fl .rq{color:var(--acc)}
.fv{background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;color:var(--tx);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.fv:focus{border-color:var(--acc)}
.fv::placeholder{color:var(--tx3)}
select.fv option{background:var(--s1)}
.fv-hint{font-size:11px;color:var(--tx3);margin-top:2px}
hr.fsep{border:none;border-top:1px solid var(--bd);grid-column:1/-1;margin:2px 0}

/* CONFIRM */
#cfbg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center}
#cfbg.op{display:flex}
#cfbox{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:22px 20px;max-width:320px;width:90%;text-align:center}
#cfbox h3{font-family:'Syne',sans-serif;font-size:14px;margin-bottom:7px}
#cfbox p{color:var(--tx2);font-size:12px;margin-bottom:16px}
.cfb{display:flex;gap:8px;justify-content:center}

/* TOAST */
#ta{position:fixed;bottom:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:6px}
.tos{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:10px 13px;display:flex;align-items:center;gap:8px;font-size:13px;min-width:210px;max-width:290px;animation:ti .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tos.rem{animation:to .2s ease forwards}
@keyframes ti{from{transform:translateX(14px);opacity:0}}
@keyframes to{to{transform:translateX(14px);opacity:0}}
.tos-ok{border-left:3px solid var(--ok)}.tos-er{border-left:3px solid var(--er)}.tos-in{border-left:3px solid var(--in)}

/* CHARTS */
.bi-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.bi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.bi-grid.g3{grid-template-columns:1fr 1fr 1fr}
.bi-card.full{grid-column:1/-1}
.sh{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.sh span{color:var(--tx2);font-size:11px;font-weight:400;font-family:'DM Sans',sans-serif}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.bar-lbl{font-size:11px;width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-wrap{flex:1;height:13px;background:var(--s2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s}
.bar-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx2);width:88px;text-align:right;flex-shrink:0}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.chart-area{height:120px;display:flex;align-items:flex-end;gap:2px;position:relative}
.chart-b{border-radius:3px 3px 0 0;opacity:.85;cursor:default;min-width:7px;transition:opacity .15s}
.chart-b:hover{opacity:1}

/* DRE */
.dre-t{width:100%;border-collapse:collapse;font-size:12px}
.dre-t td,.dre-t th{padding:5px 10px;border-bottom:1px solid var(--bd)}
.dre-t thead th{background:var(--s2);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx2);text-align:right;white-space:nowrap}
.dre-t thead th:first-child{text-align:left;position:sticky;left:0;background:var(--s2);min-width:200px}
.dre-t td:first-child{position:sticky;left:0;background:var(--s1);z-index:1}
.dre-cat td{font-weight:600;color:var(--tx);background:var(--s2)}
.dre-cat td:first-child{background:var(--s2)}
.dre-sub td{color:var(--tx2);padding-left:22px;font-size:11px}
.dre-sub td:first-child{background:var(--s1)}
.dre-tot{font-weight:700}
.dre-tot td{background:rgba(249,115,22,.06);color:var(--acc);border-top:2px solid var(--bd2)}
.dre-tot td:first-child{background:rgba(249,115,22,.06)}
.dre-sep td{height:6px;background:var(--bg);border:none}
.dre-hi td{background:rgba(34,197,94,.06);color:var(--ok);font-weight:700;border-top:2px solid var(--bd2)}
.dre-hi td:first-child{background:rgba(34,197,94,.06)}
.dre-bk td{background:rgba(59,130,246,.06);color:var(--in);font-weight:600}
.dre-bk td:first-child{background:rgba(59,130,246,.06)}
.dv{text-align:right;font-family:'DM Mono',monospace}
.dp{color:var(--ok)}.dn{color:var(--er)}.dc{color:var(--tx2);font-size:11px}

/* VISÃO GERAL */
.vg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.vg-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:15px}
.vg-card.span2{grid-column:span 2}
.input-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.input-row label{flex:1;font-size:12px;color:var(--tx2)}
.input-row input{width:100px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;color:var(--tx);font-size:12px;font-family:'DM Mono',monospace;outline:none;text-align:right}
.input-row input:focus{border-color:var(--acc)}


/* AGENDA FINANCEIRA */
.ag-shell{display:flex;flex-direction:column;gap:12px}
.ag-top{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.ag-title{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:19px;text-transform:capitalize}
.ag-navbtn{width:34px;height:34px;border-radius:9px;background:var(--s2);border:1px solid rgba(249,115,22,.35);color:var(--acc);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.ag-navbtn:hover{background:var(--acc3);border-color:var(--acc)}
.ag-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ag-cal{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px;overflow:hidden}
.ag-week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px}
.ag-dow{text-align:center;color:var(--tx2);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.ag-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.ag-day{min-height:118px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.012));border:1px solid var(--bd);border-radius:12px;padding:9px;position:relative;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ag-day:hover{border-color:rgba(249,115,22,.55);transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.22)}
.ag-day.empty{background:transparent;border-color:transparent;cursor:default;box-shadow:none;transform:none}
.ag-day.today{border-color:var(--acc);box-shadow:0 0 0 1px rgba(249,115,22,.35) inset}
.ag-day.has{background:rgba(249,115,22,.055)}
.ag-day.mix{background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(239,68,68,.08))}
.ag-day.rec{background:rgba(34,197,94,.07)}
.ag-day.pag{background:rgba(239,68,68,.07)}
.ag-day.done{opacity:.74;background:rgba(34,197,94,.045)}
.ag-num{font-family:'DM Mono',monospace;font-size:13px;font-weight:800;color:var(--tx2);display:flex;align-items:center;justify-content:space-between;gap:5px}
.ag-check{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#06130b;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.ag-total{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ag-total.pos{color:var(--ok)}.ag-total.neg{color:var(--er)}.ag-total.zero{color:var(--tx3)}
.ag-lines{display:flex;flex-direction:column;gap:3px;margin-top:auto}
.ag-line{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:10.5px;color:var(--tx2);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.04);border-radius:6px;padding:3px 5px}
.ag-line strong{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--tx)}
.ag-pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:800}
.ag-pill.rec{background:var(--ok2);color:var(--ok)}.ag-pill.pag{background:var(--er2);color:var(--er)}.ag-pill.open{background:var(--wa2);color:var(--wa)}.ag-pill.done{background:var(--ok2);color:var(--ok)}
.ag-list{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.ag-list-head{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ag-item{display:grid;grid-template-columns:92px 1fr 115px 84px 98px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}
.ag-item:last-child{border-bottom:none}
.ag-item:hover{background:rgba(255,255,255,.022)}
.ag-item-title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-item-sub{font-size:11px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-muted{color:var(--tx3);font-size:11px}
.ag-day-detail{display:flex;flex-direction:column;gap:8px}
.ag-detail-row{display:grid;grid-template-columns:1fr 105px 86px 92px;gap:8px;align-items:center;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:9px}
@media(max-width:980px){.ag-week,.ag-grid{gap:5px}.ag-day{min-height:100px;padding:7px}.ag-total{font-size:13px}.ag-item{grid-template-columns:82px 1fr 100px;}.ag-item .hide-sm{display:none}}
@media(max-width:768px){.ag-week,.ag-grid{grid-template-columns:repeat(2,1fr)}.ag-dow{display:none}.ag-day.empty{display:none}.ag-top{align-items:stretch}.ag-actions{width:100%}.ag-actions .btn{flex:1;justify-content:center}.ag-detail-row{grid-template-columns:1fr}.ag-item{grid-template-columns:1fr}.ag-item .hide-sm{display:block}}
/* Ajuste visual forte da Agenda Financeira: números menores e leitura limpa */
.ag-shell .kpi{padding:11px 12px!important;min-width:0}
.ag-shell .kpi-v{font-size:15px!important;line-height:1.08!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.03em}
.ag-shell .kpi-s{font-size:10.5px!important;line-height:1.2}
.ag-day{min-height:104px!important;padding:7px 8px!important;gap:4px!important}
.ag-num{font-size:12px!important;line-height:1!important}
.ag-check{width:18px!important;height:18px!important;font-size:11px!important}
.ag-day .ag-total,
.ag-day .ag-total.pos,
.ag-day .ag-total.neg,
.ag-day .ag-total.zero{
  font-family:'DM Mono',monospace!important;
  font-size:11.2px!important;
  font-weight:900!important;
  letter-spacing:-.075em!important;
  line-height:1.05!important;
  margin:0!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  max-width:100%!important;
}
.ag-lines{gap:3px!important}
.ag-line{font-size:9.2px!important;line-height:1.05!important;padding:2px 5px!important;border-radius:6px!important;gap:4px!important}
.ag-line strong{font-family:'DM Mono',monospace!important;font-size:9.4px!important;line-height:1.05!important;letter-spacing:-.045em!important;color:var(--tx)!important}
.ag-muted{font-size:10.5px!important;line-height:1.1!important}
@media(min-width:1400px){
  .ag-day .ag-total,.ag-day .ag-total.pos,.ag-day .ag-total.neg,.ag-day .ag-total.zero{font-size:12px!important}
  .ag-line{font-size:9.8px!important}
  .ag-line strong{font-size:10px!important}
}
@media(max-width:980px){
  .ag-day{min-height:96px!important;padding:6px!important}
  .ag-day .ag-total,.ag-day .ag-total.pos,.ag-day .ag-total.neg,.ag-day .ag-total.zero{font-size:10.3px!important}
  .ag-line{font-size:8.8px!important;padding:2px 4px!important}
  .ag-line strong{font-size:8.9px!important}
}


/* Ajuste definitivo: mês da agenda menor e Plano de Contas em quadros */
.ag-shell .ag-title{font-size:15px!important;line-height:1.05!important;gap:8px!important;letter-spacing:-.035em!important}
.ag-shell .ag-title span{font-size:15px!important;line-height:1.05!important;font-weight:800!important;white-space:nowrap!important}
.ag-shell .ag-navbtn{width:28px!important;height:28px!important;border-radius:8px!important;font-size:18px!important;line-height:1!important}
.ag-shell .ag-top{padding:11px!important;gap:9px!important}
@media(min-width:1200px){.ag-shell .ag-title,.ag-shell .ag-title span{font-size:16px!important}}
@media(max-width:768px){.ag-shell .ag-title,.ag-shell .ag-title span{font-size:14px!important}.ag-shell .ag-navbtn{width:26px!important;height:26px!important;font-size:16px!important}}
.cc-layout{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:12px;align-items:start}
.cc-panel{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.cc-panel-head{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.cc-panel-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--tx);letter-spacing:-.02em}
.cc-panel-sub{font-size:10.5px;color:var(--tx2);margin-top:2px}
.cc-groups{display:flex;flex-direction:column;gap:7px;padding:10px;max-height:calc(100vh - 260px);overflow:auto}
.cc-group-card{border:1px solid var(--bd);background:linear-gradient(180deg,rgba(255,255,255,.026),rgba(255,255,255,.012));border-radius:12px;padding:10px;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cc-group-card:hover{border-color:rgba(249,115,22,.55);transform:translateY(-1px)}
.cc-group-card.act{border-color:var(--acc);box-shadow:0 0 0 1px rgba(249,115,22,.25) inset;background:rgba(249,115,22,.08)}
.cc-group-name{font-size:12.5px;font-weight:800;color:var(--tx);line-height:1.15}
.cc-group-meta{font-size:10px;color:var(--tx2);margin-top:3px}
.cc-count{font-family:'DM Mono',monospace;font-size:11px;font-weight:800;color:var(--acc);background:var(--acc3);border:1px solid rgba(249,115,22,.18);border-radius:999px;padding:3px 7px;white-space:nowrap}
.cc-sub-list{padding:10px;display:flex;flex-direction:column;gap:7px}
.cc-sub-row{display:grid;grid-template-columns:1fr 90px 74px;gap:8px;align-items:center;background:rgba(255,255,255,.022);border:1px solid var(--bd);border-radius:12px;padding:10px}
.cc-sub-name{font-size:13px;font-weight:750;color:var(--tx)}
.cc-sub-empty{padding:36px 18px;text-align:center;color:var(--tx3)}
.cc-mini-actions{display:flex;gap:5px;justify-content:flex-end}
.cc-note{font-size:10.5px;color:var(--tx2);padding:10px 12px;border-top:1px solid var(--bd);line-height:1.35}
@media(max-width:980px){.cc-layout{grid-template-columns:1fr}.cc-groups{max-height:none}.cc-sub-row{grid-template-columns:1fr}.cc-mini-actions{justify-content:flex-start}}

/* PAGINATION */
.pag{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:9px}
.pb{width:27px;height:27px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--bd);color:var(--tx2);font-size:12px;cursor:pointer;transition:all .12s}
.pb:hover,.pb.act{border-color:var(--acc);color:var(--acc)}
.pi{font-size:11px;color:var(--tx2);margin:0 4px}

.es{text-align:center;padding:45px 20px;color:var(--tx3)}
.es .em{font-size:30px;margin-bottom:8px}
.es h3{color:var(--tx2);font-size:13px;margin-bottom:4px}
.ra{display:flex;gap:3px;justify-content:flex-end}

@media(max-width:768px){.kpis{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr}.bi-grid{grid-template-columns:1fr}.vg-grid{grid-template-columns:1fr}}

#content .ag-line{
  font-family:'DM Sans',sans-serif!important;
  font-size:9.8px!important;
  font-weight:600!important;
  line-height:1.05!important;
  padding:2px 5px!important;
  border-radius:6px!important;
  gap:4px!important;
}
#content .ag-line strong{
  font-family:'DM Sans',sans-serif!important;
  font-size:9.8px!important;
  font-weight:750!important;
  line-height:1.05!important;
  letter-spacing:-.015em!important;
}
#content .ag-muted{
  font-size:10.5px!important;
  line-height:1.15!important;
}
#content .ag-item-title{
  font-size:12.5px!important;
  font-weight:700!important;
}
#content .ag-item-sub{
  font-size:10.5px!important;
}

#content .cc-panel-title{
  font-family:'DM Sans',sans-serif!important;
  font-size:13px!important;
  font-weight:750!important;
  letter-spacing:-.005em!important;
  line-height:1.15!important;
}
#content .cc-panel-sub,
#content .cc-group-meta,
#content .cc-note{
  font-size:10.5px!important;
  line-height:1.25!important;
  font-weight:500!important;
}
#content .cc-group-card{
  padding:9px 10px!important;
  border-radius:10px!important;
  gap:7px!important;
}
#content .cc-group-name{
  font-family:'DM Sans',sans-serif!important;
  font-size:12.5px!important;
  font-weight:750!important;
  line-height:1.15!important;
  letter-spacing:-.005em!important;
}
#content .cc-count{
  font-family:'DM Sans',sans-serif!important;
  font-size:10.5px!important;
  font-weight:750!important;
  padding:3px 7px!important;
}
#content .cc-sub-row{
  padding:9px 10px!important;
  grid-template-columns:1fr 78px 70px!important;
  gap:7px!important;
  border-radius:10px!important;
}
#content .cc-sub-name{
  font-family:'DM Sans',sans-serif!important;
  font-size:12.5px!important;
  font-weight:750!important;
  line-height:1.15!important;
}
#content .cc-mini-actions .btn-i{
  width:30px!important;
  height:30px!important;
  padding:0!important;
}
#content .sw-wrap input{
  font-family:'DM Sans',sans-serif!important;
  font-size:12.5px!important;
  font-weight:500!important;
}
@media(max-width:980px){
  #content .cc-sub-row{grid-template-columns:1fr!important}
}
@media(max-width:768px){
  #content .ag-shell .ag-title,
  #content .ag-shell .ag-title span{font-size:15px!important}
  #content .ag-shell .ag-navbtn{width:28px!important;height:28px!important;font-size:17px!important}
  #content .ag-day .ag-total{font-size:11.5px!important}
  #content .ag-line,#content .ag-line strong{font-size:9.2px!important}
}




/* Ajuste Agenda: recebimentos manuais simples por origem */
.ag-origin-grid{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:8px;margin-top:6px}
.ag-origin-grid input{display:none!important}
.ag-origin-card{display:flex;align-items:center;justify-content:center;min-height:42px;border:1px solid var(--bd);border-radius:12px;background:var(--s2);color:var(--tx2);font-size:13px;font-weight:750;cursor:pointer;transition:.15s ease;user-select:none}
.ag-origin-card:hover{border-color:rgba(255,107,26,.45);color:var(--tx)}
.ag-origin-grid input:checked+.ag-origin-card{border-color:var(--acc);background:rgba(255,107,26,.14);color:var(--acc);box-shadow:0 0 0 1px rgba(255,107,26,.22) inset}
@media(max-width:760px){.ag-origin-grid{grid-template-columns:repeat(2,1fr)}}

/* Robustez financeira v1 — leitura suave, auditoria e fluxo de caixa */
:root{--font-soft:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
body,.app,.content,.btn,.fc,.fv,input,select,textarea,table{font-family:var(--font-soft)!important;letter-spacing:-.01em}
.ag-shell .ag-title span{font-size:18px!important;font-weight:750!important;letter-spacing:-.025em!important}
.ag-shell .ag-navbtn{width:30px!important;height:30px!important;font-size:17px!important}
.kpi .kpi-v,.ag-total,.cc-stat-v{font-family:var(--font-soft)!important;font-weight:700!important;letter-spacing:-.025em!important}
.fx-top{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(340px,1.1fr);gap:12px;margin-bottom:12px}
.fx-card,.audit-card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.fx-title,.audit-title{font-size:15px;font-weight:750;color:var(--tx);margin-bottom:4px;letter-spacing:-.02em}
.fx-sub,.audit-sub{font-size:11.5px;color:var(--tx2);line-height:1.35}
.fx-controls{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:12px}
.fx-controls .fgi{min-width:145px;flex:1}
.fx-month{font-size:18px;font-weight:750;color:var(--tx);letter-spacing:-.025em}
.fx-warn{border-color:rgba(239,68,68,.28)!important;background:rgba(239,68,68,.07)!important}
.fx-ok{border-color:rgba(34,197,94,.24)!important;background:rgba(34,197,94,.06)!important}
.fx-row-bad td{background:rgba(239,68,68,.055)}
.fx-row-good td{background:rgba(34,197,94,.035)}
.audit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:10px;margin-bottom:12px}
.audit-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);background:var(--s2);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--tx2);font-weight:650;margin:2px 4px 2px 0}
.audit-chip.bad{border-color:rgba(239,68,68,.35);color:#ff6b6b;background:rgba(239,68,68,.08)}
.audit-chip.warn{border-color:rgba(245,158,11,.35);color:#fbbf24;background:rgba(245,158,11,.08)}
.audit-chip.ok{border-color:rgba(34,197,94,.32);color:#4ade80;background:rgba(34,197,94,.08)}
.audit-list{display:grid;gap:10px}
.audit-item{border:1px solid var(--bd);background:var(--s1);border-radius:14px;padding:12px;transition:.16s ease}
.audit-item.audit-click{cursor:pointer}
.audit-item.audit-click:hover{border-color:rgba(255,107,26,.55);background:rgba(255,255,255,.04);transform:translateY(-1px)}
.audit-item h4{margin:0 0 4px;font-size:13.5px;color:var(--tx);font-weight:750}
.audit-item p{margin:0 0 8px;font-size:11.5px;color:var(--tx2);line-height:1.4}
.audit-meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--tx3);font-size:10.5px}
.audit-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.audit-tip{font-size:10.5px;color:var(--tx3)}
.audit-open{font-size:11px!important;padding:7px 10px!important}
.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:900px){.fx-top{grid-template-columns:1fr}.ag-shell .ag-title span{font-size:16px!important}}

// Mantém categoria/subcategoria como texto para compatibilidade visual,
// mas usa grupo_id e subcategoria_id como vínculo principal e estável.
let ccIdsEnsured=false;
function ccNorm(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ');}
function ccHashId(prefix,text){let h=2166136261;const str=String(text||'');for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return prefix+(h>>>0).toString(36);}
function ccNewId(prefix){return prefix+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
function ccRowGroupId(r){return r?.grupo_id||r?.group_id||r?.categoria_id||'';}
function ccRowSubId(r){return r?.subcategoria_id||r?.sub_id||r?.cc_id||'';}
function ccEnsureIds(opts={}){
  store.centrocusto=store.centrocusto||[];store.lancamentos=store.lancamentos||[];store.agenda=store.agenda||[];
  const persist=!!opts.persist; const changedCC=[],changedLanc=[],changedAgenda=[];
  const gidByCat={};
  store.centrocusto.forEach(r=>{if(!r.categoria)return;const k=ccNorm(r.categoria);const gid=ccRowGroupId(r);if(gid&&!gidByCat[k])gidByCat[k]=gid;});
  store.centrocusto.forEach(r=>{
    if(!r.categoria)return;
    const k=ccNorm(r.categoria);const old=JSON.stringify([r.grupo_id,r.categoria_id,r.group_id,r.subcategoria_id,r.sub_id,r.cc_id,r.grupo]);
    const gid=gidByCat[k]||ccHashId('grp_',k); gidByCat[k]=gid;
    r.grupo_id=gid; r.categoria_id=gid; if('group_id' in r) delete r.group_id; if('grupo' in r) r.grupo='';
    if((r.subcategoria||'').trim()){
      const sid=ccRowSubId(r)||ccHashId('sub_',gid+'|'+ccNorm(r.subcategoria));
      r.subcategoria_id=sid; if('sub_id' in r) delete r.sub_id; if('cc_id' in r) delete r.cc_id;
    } else { if('subcategoria_id' in r && !r.subcategoria) delete r.subcategoria_id; }
    if(!r.dre_id) r.dre_id=dreInferClass(r.categoria);
    const now=JSON.stringify([r.grupo_id,r.categoria_id,r.group_id,r.subcategoria_id,r.sub_id,r.cc_id,r.grupo,r.dre_id]);
    if(old!==now)changedCC.push(r);
  });
  const findGroupByName=(cat)=>{const k=ccNorm(cat);const gid=gidByCat[k];return gid?{id:gid,nome:(store.centrocusto.find(x=>ccRowGroupId(x)===gid)?.categoria)||cat}:null;};
  const subByPair={}; store.centrocusto.forEach(r=>{if(r.subcategoria){subByPair[(ccRowGroupId(r)||'')+'|||'+ccNorm(r.subcategoria)]=r;}});
  const applyIds=(r,arr)=>{
    if(!r||!r.categoria)return;
    const g=findGroupByName(r.categoria); if(!g)return;
    let changed=false;
    if(!r.categoria_id){r.categoria_id=g.id; changed=true;}
    if((r.subcategoria||'').trim()){
      const sub=subByPair[g.id+'|||'+ccNorm(r.subcategoria)];
      if(sub && !r.subcategoria_id){r.subcategoria_id=ccRowSubId(sub); changed=true;}
    }
    if(changed)arr.push(r);
  };
  store.lancamentos.forEach(r=>applyIds(r,changedLanc));
  store.agenda.forEach(r=>applyIds(r,changedAgenda));
  lsSave?.();
  if(persist&&fbOk){
    (async()=>{
      try{
        for(const r of changedCC){if(r.id)await fbSet('centrocusto',r.id,{...r});}
        for(const r of changedLanc){if(r.id)await fbSet('lancamentos',r.id,{...r});}
        for(const r of changedAgenda){if(r.id)await fbSet('agenda_financeira',r.id,{...r});}
        if((changedCC.length+changedLanc.length+changedAgenda.length)>0) console.log('IDs fixos do plano validados:',changedCC.length,changedLanc.length,changedAgenda.length);
      }catch(e){console.warn('Falha ao persistir IDs fixos do plano:',e);}
    })();
  }
  return {changedCC:changedCC.length,changedLanc:changedLanc.length,changedAgenda:changedAgenda.length};
}
function ccGroups(){
  ccEnsureIds(); const map=new Map();
  (store.centrocusto||[]).forEach(r=>{if(!r.categoria)return;const gid=ccRowGroupId(r)||ccHashId('grp_',ccNorm(r.categoria));if(!map.has(gid))map.set(gid,{id:gid,nome:r.categoria,rows:[]});map.get(gid).rows.push(r);});
  return [...map.values()].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function ccGroupByAny(v){const val=String(v||'');return ccGroups().find(g=>g.id===val)||ccGroups().find(g=>ccNorm(g.nome)===ccNorm(val))||null;}
function ccSubsByAny(group){const g=ccGroupByAny(group);if(!g)return[];return g.rows.filter(c=>c.subcategoria&&c.subcategoria.trim()).sort((a,b)=>(a.subcategoria||'').localeCompare(b.subcategoria||'','pt-BR'));}
function ccSubByAny(group,subOrId){const val=String(subOrId||'');const subs=ccSubsByAny(group);return subs.find(s=>ccRowSubId(s)===val)||subs.find(s=>ccNorm(s.subcategoria)===ccNorm(val))||null;}
function ccLabelFromIds(catId,subId){const g=ccGroupByAny(catId);const s=g?ccSubByAny(g.id,subId):null;return{categoria:g?.nome||'',subcategoria:s?.subcategoria||'',categoria_id:g?.id||catId||'',subcategoria_id:ccRowSubId(s)||subId||''};}

// ── Carregamento econômico + tempo real automático ───────────────
const LS_LANC_SYNC_KEY = 'bdr_lancamentos_sync_ms_v2';
const DELTA_SYNC_SAFETY_MS = 10 * 60 * 1000;
function getLancSyncMs(){try{return +(localStorage.getItem(LS_LANC_SYNC_KEY)||0)||0;}catch(e){return 0;}}
function setLancSyncMs(ms){try{localStorage.setItem(LS_LANC_SYNC_KEY,String(Math.max(0,Math.floor(ms||0))));}catch(e){}}
function tsToMs(v){
  if(!v) return 0;
  if(typeof v.toMillis==='function') return v.toMillis();
  if(typeof v.seconds==='number') return v.seconds*1000 + Math.floor((v.nanoseconds||0)/1000000);
  if(typeof v._seconds==='number') return v._seconds*1000 + Math.floor((v._nanoseconds||0)/1000000);
  if(typeof v==='number') return v;
  const p=Date.parse(v); return Number.isFinite(p)?p:0;
}
function cleanDoc(doc){return {id:doc.id,...doc.data()};}
function upsertById(arr,item){const i=arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]={...arr[i],...item}; else arr.unshift(item);}
function pushOrUpdateById(arr,item){const i=arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]={...arr[i],...item}; else arr.push(item);}
function removeById(arr,id){return (arr||[]).filter(x=>x.id!==id);}
function touchLancSyncFromChanges(changes){
  let max=getLancSyncMs();
  changes.forEach(ch=>{const d=ch.doc&&ch.doc.data?ch.doc.data():{}; const ms=tsToMs(d.updated_at)||tsToMs(d.deleted_at); if(ms>max) max=ms;});
  // Avança o marcador com janela de segurança para não reler a base inteira, sem perder alterações recentes.
  const safeNow=Date.now()-2000;
  setLancSyncMs(Math.max(max,safeNow));
}
function lancamentosDeltaQuery(){
  const ms=getLancSyncMs();
  if(ms>0){
    const from=firebase.firestore.Timestamp.fromMillis(Math.max(0,ms-DELTA_SYNC_SAFETY_MS));
    return db.collection('lancamentos').where('updated_at','>=',from).orderBy('updated_at','desc');
  }
  return db.collection('lancamentos').orderBy('data_competencia','desc');
}

    ccEnsureIds({persist:false});

      toast('Firebase indisponível — abrindo cache local','in');

    setStatus('● offline','var(--er)');
    toast('Firebase offline/sem quota — sem cache local neste computador','er');
    return false;
  }
}

// ── Sync em tempo real econômico (multi-usuário) ──────
function setupRealtimeSync(){
  unsubListeners.forEach(u=>{try{u();}catch(e){}});
  unsubListeners = [];

  // Lançamentos: tempo real automático, mas sem reler a coleção inteira a cada abertura.
  const unsub = lancamentosDeltaQuery().onSnapshot(snap=>{
    const changes=snap.docChanges();
    changes.forEach(ch=>{
      const d=cleanDoc(ch.doc);
      if(ch.type==='removed' || d.deleted){
        store.lancamentos=removeById(store.lancamentos,ch.doc.id);
      } else {
        upsertById(store.lancamentos,d);
      }
    });
    if(changes.length) touchLancSyncFromChanges(changes);
    store.lancamentos=(store.lancamentos||[]).filter(r=>!r.deleted);
    lsSave();
    setStatus('● '+store.lancamentos.length+' lanç. | online automático','var(--ok)');
    if(changes.length && CM) safeRender(CM);
  }, err=>{ console.warn('Lançamentos offline:',err.message); setStatus('● offline','var(--er)'); });
  unsubListeners.push(unsub);

  // Coleções menores continuam em tempo real para todos verem alterações automaticamente.
  const unsubAgenda = db.collection('agenda_financeira').onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      const d=cleanDoc(ch.doc);
      if(ch.type==='removed') store.agenda=removeById(store.agenda,ch.doc.id);
      else pushOrUpdateById(store.agenda,d);
    });
    lsSave();
    if(CM==='agenda' || CM==='fluxocaixa') safeRender(CM);
  }, err=>{ console.warn('Agenda offline:', err.message); });
  unsubListeners.push(unsubAgenda);

  const unsubCC = db.collection('centrocusto').onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      const d=cleanDoc(ch.doc);
      if(ch.type==='removed') store.centrocusto=removeById(store.centrocusto,ch.doc.id);
      else pushOrUpdateById(store.centrocusto,d);
    });
    ccEnsureIds();
    lsSave();
    if(['centrocusto','lancamentos','dashboard','visaogeral','dre','auditoria'].includes(CM)) safeRender(CM);
  }, err=>console.warn('Plano de contas offline:',err.message));
  unsubListeners.push(unsubCC);

  const unsubClientes = db.collection('clientes_mes').onSnapshot(snap=>{
    const novo={}; snap.docs.forEach(d=>{novo[d.id]=d.data().count||0;});
    store.clientes_mes=novo; lsSave();
    if(['visaogeral','dashboard'].includes(CM) && !clienteInputAtivo()) safeRender(CM);
  }, err=>console.warn('Clientes offline:',err.message));
  unsubListeners.push(unsubClientes);

  const unsubPat = db.collection('patrimonio').onSnapshot(snap=>{
    store.patrimonio=snap.docs.map(cleanDoc); lsSave();
    if(['patrimonio','auditoria'].includes(CM)) safeRender(CM);
  }, err=>console.warn('Patrimônio offline:',err.message));
  unsubListeners.push(unsubPat);

  const unsubCfg = db.collection('config').onSnapshot(snap=>{
    if(snap.docs.length){ store.cfg={...store.cfg,...snap.docs[0].data()}; lsSave(); if(['config','fluxocaixa'].includes(CM)) safeRender(CM); }
  }, err=>console.warn('Config offline:',err.message));
  unsubListeners.push(unsubCfg);
}

// ── CRUD Firestore ─────────────────────────────────────
async function fbAdd(col, data){
  if(!fbOk) return null;
  const payload={...(data||{})};
  delete payload.id;
  payload.updated_at = firebase.firestore.FieldValue.serverTimestamp();
  const ref = await db.collection(col).add(payload);
  return ref.id;
}
async function fbSet(col, id, data){
  if(!fbOk || !id) return;
  const payload={...(data||{})};
  delete payload.id;
  payload.updated_at = firebase.firestore.FieldValue.serverTimestamp();
  await db.collection(col).doc(id).set(payload, {merge:true});
}
async function fbDel(col, id){
  if(!fbOk || !id) return;
  if(col==='lancamentos'){
    await db.collection(col).doc(id).set({deleted:true,deleted_at:firebase.firestore.FieldValue.serverTimestamp(),updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    return;
  }
  await db.collection(col).doc(id).delete();
}
async function fbBatch(col, items){
  if(!fbOk) return;
  const CHUNK=499;
  for(let i=0;i<items.length;i+=CHUNK){
    const batch=db.batch();
    items.slice(i,i+CHUNK).forEach(item=>{
      const d={...item};delete d.id;
      d.updated_at=firebase.firestore.FieldValue.serverTimestamp();
      const ref=db.collection(col).doc();
      batch.set(ref,d);
    });
    await batch.commit();
    console.log(`Batch ${i/CHUNK+1} ok`);
  }
}

// Digitação de Clientes Atendidos corrigida.
// Não salva o banco/localStorage a cada tecla, porque isso travava o input e impedia digitar/apagar de uma vez.
const clientesMesTimers = {};
window.clientesMesDigitado = function(el, mes){
  const raw = String(el.value || '').replace(/\D/g,'');
  if(el.value !== raw) el.value = raw;

  // Atualiza só a memória da tela, sem redesenhar e sem gravar pesado a cada tecla.
  if(raw === '') delete store.clientes_mes[mes];
  else store.clientes_mes[mes] = parseInt(raw, 10) || 0;

  clearTimeout(clientesMesTimers[mes]);
  clientesMesTimers[mes] = setTimeout(()=>{
    saveClientesMes(mes, raw === '' ? null : parseInt(raw, 10)).catch(()=>{});
  }, 1000);
};

  const anos=[...new Set(store.lancamentos.map(r=>(r.data_competencia||'').slice(0,4)).filter(Boolean))].sort();
  let html=`<div class="yr-group"><div class="m-tab all${!selMes?' act':''}" onclick="setMes('')">Tudo</div></div>`;
  anos.forEach(ano=>{
    const mesesAno=[...new Set(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(ano+'-')).map(r=>(r.data_competencia||'').slice(5,7)).filter(Boolean))].sort();

}

let sortKey='data_competencia',sortDir='desc';
let lancBusca='';

function rLanc(){
  const swRaw=lancBusca||'';
  const sw=swRaw.toLowerCase();
  const fS=($('fst')||{value:''}).value;
  const fT=($('ftp')||{value:''}).value;
  const fMc=($('fmc')||{value:''}).value;
  const fMv=($('fmv')||{value:''}).value;
  const fC=($('fcat')||{value:''}).value;
  const fFP=($('ffp')||{value:''}).value;
  const fSub=($('fsub')||{value:''}).value;

  // subcategorias filtradas pela categoria selecionada (ou todas)
  const subs=[...new Set(store.lancamentos.filter(r=>!($('fcat')||{value:''}).value||r.categoria===($('fcat')||{value:''}).value).map(r=>r.subcategoria).filter(Boolean))].sort();

  let data=store.lancamentos.filter(r=>{
    if(fS&&r.status!==fS)return false;
    if(fT&&r.rec_desp!==fT)return false;
    if(fC&&r.categoria!==fC)return false;
    if(fSub&&r.subcategoria!==fSub)return false;
    if(fFP&&r.forma_pagamento!==fFP)return false;
    if(fMc&&(r.data_competencia||'').slice(0,7)!==fMc)return false;
    if(fMv&&(r.data_vencimento||'').slice(0,7)!==fMv)return false;
    if(sw){const s=`${r.descricao||''} ${r.categoria||''} ${r.subcategoria||''} ${r.forma_pagamento||''}`.toLowerCase();if(!s.includes(sw))return false;}
    return true;
  });

  data.sort((a,b)=>{
    const va=a[sortKey]||'',vb=b[sortKey]||'';
    if(sortKey==='valor'){return sortDir==='asc'?+va- +vb:+vb- +va;}
    return sortDir==='asc'?(va>vb?1:-1):(va<vb?1:-1);
  });

  const tIn=data.filter(r=>r.rec_desp==='Contas a receber').reduce((s,r)=>s+r.valor,0);
  const tOut=data.filter(r=>r.rec_desp!=='Contas a receber').reduce((s,r)=>s+r.valor,0);

  const cats=[...new Set(store.lancamentos.map(r=>r.categoria).filter(Boolean))].sort();
  const meses=[...new Set(store.lancamentos.map(r=>(r.data_competencia||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const mesesV=[...new Set(store.lancamentos.map(r=>(r.data_vencimento||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const fps=[...new Set(store.lancamentos.map(r=>r.forma_pagamento).filter(Boolean))].sort();

  const thC=(k,lbl)=>`<th class="${sortKey===k?'srt':''}" onclick="sortL('${k}')">${lbl}${sortKey===k?(sortDir==='asc'?' ↑':' ↓'):''}</th>`;

  // Para manter a digitação da busca fluida, a tabela renderiza uma quantidade segura de linhas por vez.
  // Quando a busca fica mais específica, mais itens aparecem automaticamente sem travar o campo.
  const limiteLinhas = sw ? 260 : 180;
  const dadosVisiveis = data.slice(0, limiteLinhas);

  const rows=dadosVisiveis.map(r=>{
    const isIn=r.rec_desp==='Contas a receber';
    const parcTag=r.parcela_info?`<span class="bg bpu2" style="font-size:10px;margin-left:4px">${r.parcela_info}</span>`:'';
    const recTag=r.recorrente?`<span class="bg bblue" style="font-size:10px;margin-left:4px">↻</span>`:'';
    return`<tr onclick="selRow(this,'${r.id}')" style="cursor:default" title="Clique para selecionar. Use o botão ✅ para dar baixa.">
      <td class="mono" style="font-size:12px">${fmtD(r.data_competencia)}</td>
      <td class="mono" style="font-size:12px;color:var(--tx2)">${fmtD(r.data_vencimento)}</td>
      <td><span style="font-size:12px;color:var(--tx2)">${r.forma_pagamento||'—'}</span></td>
      <td style="font-size:12px;color:var(--tx2)">${r.categoria||'—'}</td>
      <td style="font-size:12px;color:var(--tx3)">${r.subcategoria||'—'}</td>
      <td class="trunc" title="${r.descricao||''}" style="max-width:170px">${r.descricao||'—'}${parcTag}${recTag}</td>
      <td class="tr"><span class="${isIn?'vin':'vout'}">${isIn?'+':'−'} ${fmtN(r.valor)}</span></td>
      <td><span class="bg ${r.status==='Concluído'?'bgreen':'byel'}">${r.status==='Concluído'?'✓':'⏳'}</span></td>
      <td><div class="ra">
        ${r.status==='Pendente'?`<button class="btn bp btn-s btn-i" title="Dar baixa" onclick="event.stopPropagation();abreBaixa('${r.id}')">✅</button>`:''}
        ${r.status==='Pendente'?`<button class="btn bp btn-s btn-i" title="Dar baixa" onclick="event.stopPropagation();abreBaixa('${r.id}')">✅</button>`:''}
        <button class="btn bs btn-s btn-i" title="Editar" onclick="event.stopPropagation();eL('${r.id}')">✏️</button>
        <button class="btn bd2 btn-s btn-i" title="Excluir" onclick="event.stopPropagation();dL('${r.id}')">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');

  $('content').innerHTML=`
    <div class="kpis">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Vendas (filtro)</div><div class="kpi-v">${fmt(tIn)}</div><div class="kpi-s">${data.filter(r=>r.rec_desp==='Contas a receber').length} registros</div></div>
      <div class="kpi" style="--kc:var(--er)"><div class="kpi-l">Saídas (filtro)</div><div class="kpi-v">${fmt(tOut)}</div><div class="kpi-s">${data.filter(r=>r.rec_desp!=='Contas a receber').length} registros</div></div>
      <div class="kpi" style="--kc:${tIn-tOut>=0?'var(--ok)':'var(--er)'}"><div class="kpi-l">Resultado</div><div class="kpi-v" style="color:${tIn-tOut>=0?'var(--ok)':'var(--er)'}">${fmt(tIn-tOut)}</div></div>
      <div class="kpi" style="--kc:var(--wa)"><div class="kpi-l">Pendentes</div><div class="kpi-v" style="color:var(--wa)">${data.filter(r=>r.status==='Pendente').length}</div></div>
    </div>
    <div class="tb">
      <div class="sw-wrap"><span class="si">🔍</span><input id="sw-l" type="text" placeholder="Buscar descrição, categoria, subcategoria ou forma…" value="${ccSafe(swRaw)}" oninput="setLancBusca(this.value)" onkeydown="if(event.key==='Enter'){clearTimeout(DT);lancBusca=this.value||'';rLanc(true)}" autocomplete="off" spellcheck="false"></div>
      <select id="ftp" class="fc" onchange="rLanc()"><option value="">Tipo: Todos</option><option value="Contas a receber" ${fT==='Contas a receber'?'selected':''}>↑ Vendas</option><option value="Contas a pagar" ${fT==='Contas a pagar'?'selected':''}>↓ Pagar</option></select>
      <select id="fst" class="fc" onchange="rLanc()"><option value="">Status: Todos</option><option value="Concluído" ${fS==='Concluído'?'selected':''}>Concluído</option><option value="Pendente" ${fS==='Pendente'?'selected':''}>Pendente</option></select>
      <select id="fmc" class="fc" onchange="rLanc()" title="Filtro por Competência">
        <option value="">Competência: Todas</option>
        ${mesOptGroups(meses,fMc)}
      </select>
      <select id="fmv" class="fc" onchange="rLanc()" title="Filtro por Vencimento">
        <option value="">Vencimento: Todos</option>
        ${mesOptGroups(mesesV,fMv)}
      </select>
      <select id="fcat" class="fc" onchange="rLanc()"><option value="">Categoria: Todas</option>${cats.map(c=>`<option value="${c}" ${fC===c?'selected':''}>${c}</option>`).join('')}</select>
      <select id="fsub" class="fc" onchange="rLanc()"><option value="">Subcategoria: Todas</option>${subs.map(s=>`<option value="${s}" ${fSub===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="ffp" class="fc" onchange="rLanc()"><option value="">Forma Pgto: Todas</option>${fps.map(f=>`<option value="${f}" ${fFP===f?'selected':''}>${f}</option>`).join('')}</select>
      <button class="btn bp" onclick="nL()">＋ Novo</button>
    </div>
    <div class="tw"><table>
      <thead><tr>
        ${thC('data_competencia','Competência')}
        ${thC('data_vencimento','Vencimento')}
        <th>Forma Pgto</th>
        ${thC('categoria','Categoria')}
        ${thC('subcategoria','Subcategoria')}
        <th>Descrição</th>
        ${thC('valor','Valor')}
        <th>Status</th><th style="width:68px"></th>
      </tr></thead>
      <tbody>${rows||`<tr><td colspan="9"><div class="es"><div class="em">📭</div><h3>Sem resultados</h3></div></td></tr>`}</tbody>
    </table></div>
    <div style="font-size:11px;color:var(--tx3);margin-top:8px;text-align:right">${data.length>dadosVisiveis.length?`Mostrando ${dadosVisiveis.length} de ${data.length} registros — refine a busca para carregar mais rápido`:`${data.length} registros`}</div>`;
  if(arguments[0]===true){
    requestAnimationFrame(()=>{const el=$('sw-l');if(el){el.focus();const p=el.value.length;try{el.setSelectionRange(p,p);}catch(e){}}});
  }
}

// Form lançamento simplificado — selects usam IDs internos fixos
function catOpts(sel=''){
  ccEnsureIds(); const gSel=ccGroupByAny(sel); const sid=gSel?.id||sel;
  return ccGroups().map(g=>`<option value="${agEsc(g.id)}" ${sid===g.id?'selected':''}>${agEsc(g.nome)}</option>`).join('');
}
function subOpts(cat,sel=''){
  const g=ccGroupByAny(cat); if(!g)return''; const sSel=ccSubByAny(g.id,sel); const sid=ccRowSubId(sSel)||sel;
  return ccSubsByAny(g.id).map(c=>`<option value="${agEsc(ccRowSubId(c))}" ${sid===ccRowSubId(c)?'selected':''}>${agEsc(c.subcategoria)}</option>`).join('');
}
window.updSub=()=>{const s=$('f-sub');if(s)s.innerHTML='<option value="">— Selecione —</option>'+subOpts($('f-cat').value);};
window.toggleRecurr=()=>{
  const tp=$('f-rec').value;
  const ep=$('rec-parc'), er=$('rec-recorr');
  if(ep) ep.style.display=tp==='parcelada'?'block':'none';
  if(er) er.style.display=tp==='recorrente'?'block':'none';
  previewDatas();
};

window.previewDatas=()=>{
  const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const tp=$('f-rec')?$('f-rec').value:'unica';
  const dv=($('f-dv')||{value:''}).value;
  const dc=($('f-dc')||{value:''}).value;
  const vl=parseFloat(($('f-vl')||{value:0}).value)||0;

  if(tp==='parcelada'){
    const np=parseInt(($('f-np')||{value:2}).value)||2;
    const valParc=vl/np;
    const pc=$('parc-valor-calc');
    if(pc) pc.textContent=vl?('R$ '+valParc.toFixed(2).replace('.',',')):'—';
    const prev=$('preview-parc');
    if(!prev) return;
    if(!dv){ prev.innerHTML='<span style="color:var(--wa)">⚠️ Informe a data de vencimento para ver as datas</span>'; return; }
    const datas=[];
    for(let i=0;i<Math.min(np,6);i++){
      const d=new Date(dv+'T12:00:00');d.setMonth(d.getMonth()+i);
      datas.push(d.getDate().toString().padStart(2,'0')+'/'+MN[d.getMonth()]+'/'+d.getFullYear());
    }
    const extra=np>6?' + '+(np-6)+' mais…':'';
    prev.innerHTML='<strong>Parcelas geradas:</strong> '+datas.join(' · ')+extra;
  }

  if(tp==='recorrente'){
    const nm=parseInt(($('f-nm')||{value:12}).value)||12;
    const prev=$('preview-recorr');
    if(!prev) return;
    const base=dv||dc;
    if(!base){ prev.innerHTML='<span style="color:var(--wa)">⚠️ Informe a data de vencimento para ver as datas</span>'; return; }
    const datas=[];
    for(let i=0;i<Math.min(nm,6);i++){
      const d=new Date(base+'T12:00:00');d.setMonth(d.getMonth()+i);
      datas.push(d.getDate().toString().padStart(2,'0')+'/'+MN[d.getMonth()]+'/'+d.getFullYear());
    }
    const extra=nm>6?' + '+(nm-6)+' mais…':'';
    prev.innerHTML='<strong>'+nm+' lançamentos:</strong> '+datas.join(' · ')+extra;
  }
};

function getLancD(){
  const catId=$('f-cat').value; const subId=$('f-sub').value;
  const lbl=ccLabelFromIds(catId,subId);
  return{rec_desp:$('f-rd').value,status:$('f-st').value,data_competencia:$('f-dc').value,data_vencimento:$('f-dv').value||null,valor:parseFloat($('f-vl').value)||0,forma_pagamento:$('f-fp').value,categoria_id:lbl.categoria_id,categoria:lbl.categoria,subcategoria_id:lbl.subcategoria_id,subcategoria:lbl.subcategoria,descricao:$('f-ds').value.trim()};
}

window.nL=()=>oM('Novo Lançamento',lancForm(),`<button class="btn bs" onclick="cM()">Cancelar</button><button class="btn bp" onclick="svL(null)">💾 Salvar</button>`,true);
window.eL=id=>{const r=store.lancamentos.find(x=>x.id===id);oM('Editar Lançamento',lancForm(r),`<button class="btn bs" onclick="cM()">Cancelar</button><button class="btn bp" onclick="svL('${id}')">💾 Atualizar</button>`,true);};
window.svL=async function(id){
  const d=getLancD();
  if(!d.data_competencia||!d.valor||!d.categoria){toast('Preencha campos obrigatórios','er');return;}
  if(id){
    const i=store.lancamentos.findIndex(x=>x.id===id);
    if(i>=0) store.lancamentos[i]={...store.lancamentos[i],...d};
    cM(); render(CM); toast('Atualizado! ✅','ok');
    try{ if(i>=0) await fbSet('lancamentos',id,d); lsSave(); }catch(e){ lsSave(); }
  } else {
    const rec=$('f-rec')?$('f-rec').value:'unica';
    if(rec==='parcelada'){
      const np=parseInt(($('f-np')||{value:2}).value)||2;
      const gid=uid();
      for(let i=0;i<np;i++){
        const dc=addMonths(d.data_competencia,i);
        const dv=d.data_vencimento?addMonths(d.data_vencimento,i):null;
        store.lancamentos.unshift({id:uid(),...d,data_competencia:dc,data_vencimento:dv,descricao:`${d.descricao||d.categoria} (${i+1}/${np})`,parcela_info:`${i+1}/${np}`,parcelamento_id:gid});
      }
      for(const l of store.lancamentos.slice(0,np)){await fbAdd('lancamentos',{...l});}
      lsSave();
      toast(`${np} parcelas criadas!`,'ok');
    } else if(rec==='recorrente'){
      const nm=parseInt(($('f-nm')||{value:12}).value)||12;
      const gid=uid();
      for(let i=0;i<nm;i++){
        const dc=addMonths(d.data_competencia,i);
        const dv=d.data_vencimento?addMonths(d.data_vencimento,i):null;
        store.lancamentos.unshift({id:uid(),...d,data_competencia:dc,data_vencimento:dv,recorrente:true,recorrencia_id:gid});
      }
      for(const l of store.lancamentos.slice(0,nm)){await fbAdd('lancamentos',{...l});}
      lsSave();
      toast(`${nm} meses recorrentes criados!`,'ok');
    } else {
      const tmpId = uid();
      store.lancamentos.unshift({id:tmpId,...d});
      cM(); render(CM); toast('Criado! ✅','ok');
      try{
        const newId = await fbAdd('lancamentos',{...d});
        if(newId){ const idx=store.lancamentos.findIndex(x=>x.id===tmpId); if(idx>=0) store.lancamentos[idx].id=newId; }
        lsSave();
      }catch(e){ lsSave(); }
    }
  }
  cM();
  if(CM==='auditoria') rAuditoria();
  else if(CM==='agenda') rAgenda();
  else if(CM==='fluxocaixa') rFluxo();
  else rLanc();
};
window.dL=async function(id){
  const r=store.lancamentos.find(x=>x.id===id);
  const hasGrp=r&&(r.parcelamento_id||r.recorrencia_id);
  const gid=r?.parcelamento_id||r?.recorrencia_id;
  const extras=hasGrp?store.lancamentos.filter(x=>(x.parcelamento_id||x.recorrencia_id)===gid).length:0;
  confirm_('Excluir Lançamento',
    extras>1?`Excluir só este ou todos os ${extras} vinculados?`:`Excluir "${r?.descricao||'este lançamento'}"?`,
    async ()=>{
      if(hasGrp&&extras>1&&confirm(`Excluir TODOS os ${extras} lançamentos vinculados?`)){
        const idsGrp=store.lancamentos.filter(x=>(x.parcelamento_id||x.recorrencia_id)===gid).map(x=>x.id);
        store.lancamentos=store.lancamentos.filter(x=>(x.parcelamento_id||x.recorrencia_id)!==gid);
        for(const xid of idsGrp) await fbDel('lancamentos',xid);
        lsSave();
        toast(`${extras} lançamentos excluídos`,'ok');
      } else {
        store.lancamentos=store.lancamentos.filter(x=>x.id!==id);
        render(CM); toast('Excluído ✅','ok');
        try{ await fbDel('lancamentos',id); lsSave(); }catch(e){ lsSave(); }
      }
      if(CM==='auditoria') rAuditoria();
      else if(CM==='agenda') rAgenda();
      else if(CM==='fluxocaixa') rFluxo();
      else rLanc();
    });
};

const DRE_STRUCT=[
  {id:'rec_bruta', lbl:'(+) Receita Bruta',       cats:['Receita com produtos e mercadorias','Outras receitas operacionais'], sinal:1, tipo:'g'},
  {id:'ded',       lbl:'(−) Deduções da Receita',  cats:['Impostos sobre a receita','Outras deduções'], sinal:-1, tipo:'g'},
  {id:'rec_liq',   lbl:'= Receita Líquida',        tipo:'tot', deps:['rec_bruta','ded']},
  {id:'custos',    lbl:'(−) Custo dos Produtos',   cats:['Custo dos produtos'], sinal:-1, tipo:'g'},
  {id:'lbr',       lbl:'= Lucro Bruto',             tipo:'tot', deps:['rec_liq','custos']},
  {id:'desp_op',   lbl:'(−) Despesas Operacionais',cats:['Despesas Operacionais'], sinal:-1, tipo:'g'},
  {id:'desp_pes',  lbl:'(−) Despesas com Pessoal', cats:['Despesas com pessoal'], sinal:-1, tipo:'g'},
  {id:'outras',    lbl:'(−) Outras Despesas',       cats:['Outras despesas operacionais'], sinal:-1, tipo:'g'},
  {id:'depreciacao',lbl:'(−) Depreciação',          cats:['Depreciação'], sinal:-1, tipo:'g'},
  {id:'res_op',    lbl:'= Resultado Operacional',   tipo:'tot', deps:['lbr','desp_op','desp_pes','outras','depreciacao']},
  {id:'resultado', lbl:'= Resultado Líquido',        tipo:'tot', deps:['res_op'], hi:true},
];

const DRE_CLASS=[
  {id:'rec_bruta',lbl:'Receita Bruta'},
  {id:'ded',lbl:'Deduções da Receita'},
  {id:'custos',lbl:'Custo dos Produtos'},
  {id:'desp_op',lbl:'Despesas Operacionais'},
  {id:'desp_pes',lbl:'Despesas com Pessoal'},
  {id:'outras',lbl:'Outras Despesas'},
  {id:'depreciacao',lbl:'Depreciação'},
  {id:'fora',lbl:'Fora do DRE'}
];
function dreClassLabel(id){return (DRE_CLASS.find(x=>x.id===id)||{}).lbl||'Sem classificação';}
function dreInferClass(cat){
  const n=ccNorm(cat);
  if(['receita com produtos e mercadorias','outras receitas operacionais','vendas','a receber'].includes(n)) return 'rec_bruta';
  if(['impostos sobre a receita','outras deducoes','taxas de cartao','taxas ifood','taxas i food','taxas'].includes(n)) return 'ded';
  if(n==='custo dos produtos') return 'custos';
  if(n==='despesas com pessoal') return 'desp_pes';
  if(n==='outras despesas operacionais') return 'outras';
  if(n==='depreciacao') return 'depreciacao';
  if(['transferencia entre contas','transferências entre contas','aporte dos socios','aporte dos sócios','distribuicao de lucros','distribuição de lucros','aquisicao de bens','aquisição de bens'].includes(n)) return 'fora';
  if(n==='despesas operacionais') return 'desp_op';
  return 'desp_op';
}
function dreClassForPlanRow(r){return r?.dre_id||r?.dre_classificacao||dreInferClass(r?.categoria||'');}
function dreClassForGroup(g){
  const rows=ccRows(g?.id||g?.nome||g)||[];
  const explicit=rows.find(r=>r.dre_id||r.dre_classificacao);
  return explicit?(explicit.dre_id||explicit.dre_classificacao):dreInferClass(g?.nome||g||'');
}
function dreClassForLanc(r){
  if(r?.dre_id||r?.dre_classificacao) return r.dre_id||r.dre_classificacao;
  const g=ccGroupByAny(r?.categoria_id||r?.categoria);
  if(g) return dreClassForGroup(g);
  return dreInferClass(r?.categoria||'');
}
function dreLancMatchesPlan(l,row){
  const gid=ccRowGroupId(row), sid=ccRowSubId(row);
  const gm=gid?((l.categoria_id&&l.categoria_id===gid)||ccNorm(l.categoria)===ccNorm(row.categoria)):ccNorm(l.categoria)===ccNorm(row.categoria);
  if(!gm) return false;
  if(row.subcategoria&&sid) return (l.subcategoria_id&&l.subcategoria_id===sid)||ccNorm(l.subcategoria)===ccNorm(row.subcategoria);
  if(row.subcategoria) return ccNorm(l.subcategoria)===ccNorm(row.subcategoria);
  return true;
}

function calcDRE(lancs){
  const vals={};
  DRE_STRUCT.forEach(row=>{
    if(row.tipo==='g'){
      const sum=lancs.filter(r=>dreClassForLanc(r)===row.id).reduce((ss,r)=>ss+(+r.valor||0),0);
      vals[row.id]=sum*row.sinal;
    } else {
      vals[row.id]=row.deps.reduce((s,d)=>s+(vals[d]||0),0);
    }
  });
  return vals;
}

function rDRE(){
  const fAno=($('dre-ano')||{value:new Date().getFullYear().toString()}).value||new Date().getFullYear().toString();
  const anos=[...new Set(store.lancamentos.map(r=>(r.data_competencia||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const mesesDisp=[...new Set(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-')).map(r=>(r.data_competencia||'').slice(5,7)).filter(Boolean))].sort();

  if(!mesesDisp.length){$('content').innerHTML=`<div class="es"><div class="em">📈</div><h3>Sem dados para ${fAno}</h3></div>`;return;}

  const dreM={};mesesDisp.forEach(m=>{dreM[m]=calcDRE(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-'+m)));});
  const dreTotal=calcDRE(store.lancamentos.filter(r=>(r.data_competencia||'').startsWith(fAno+'-')));

  const thM=mesesDisp.map(m=>`<th class="dv">${MES_NM[+m-1]}</th>`).join('');
  const colCnt=mesesDisp.length+3;

  // Breakeven: custos fixos / margem contribuição
  // Custos fixos = pessoal + desp_op + outras
  // Custos variáveis = custo dos produtos
  // MC% = (Receita - CV) / Receita * 100
  // BEP = CF / MC%

  function bkRow(m,vals){
    const rb=vals['rec_bruta']||0;const cv=Math.abs(vals['custos']||0);
    const cf=Math.abs((vals['desp_op']||0)+(vals['desp_pes']||0)+(vals['outras']||0));
    const mc=rb-cv;const mcPct=rb?mc/rb:0;
    const bep=mcPct>0?cf/mcPct:null;
    const marg=rb?((vals['resultado']||0)/rb*100):0;
    return{bep,marg,mc,mcPct:mcPct*100};
  }

  const bkTotal=bkRow('total',dreTotal);
  const bkM={};mesesDisp.forEach(m=>{bkM[m]=bkRow(m,dreM[m]);});

  const recBruta=Math.abs(dreTotal['rec_bruta']||1);

  function valCls(v){return v>0?'dp':v<0?'dn':'dc';}

  const buildRows=()=>{
    let h='';
    DRE_STRUCT.forEach(row=>{
      const va=dreTotal[row.id]||0;
      const pct=recBruta?Math.abs(va)/recBruta*100:0;
      const mCols=mesesDisp.map(m=>{const v=dreM[m][row.id]||0;return`<td class="dv ${valCls(v)}">${v===0?'—':fmtN(v)}</td>`;}).join('');
      if(row.tipo==='g'){
        const cls=row.hi?'dre-hi':'dre-cat';
        h+=`<tr class="${cls}"><td>${row.lbl}</td>${mCols}<td class="dv ${valCls(va)}">${fmtN(va)}</td><td class="dv dc">${pct.toFixed(1)}%</td></tr>`;
        const planRows=(store.centrocusto||[]).filter(c=>c.subcategoria&&dreClassForPlanRow(c)===row.id);
        planRows.forEach(pr=>{
          const tots=store.lancamentos.filter(l=>(l.data_competencia||'').startsWith(fAno+'-')&&dreLancMatchesPlan(l,pr)).reduce((s,l)=>s+(+l.valor||0),0);
          if(tots>0){
            const sCols=mesesDisp.map(m=>{const v=store.lancamentos.filter(l=>(l.data_competencia||'').startsWith(fAno+'-'+m)&&dreLancMatchesPlan(l,pr)).reduce((s,l)=>s+(+l.valor||0),0);return`<td class="dv dc">${v?fmtN(v):'—'}</td>`;}).join('');
            h+=`<tr class="dre-sub"><td>└ ${ccSafe(pr.categoria)} › ${ccSafe(pr.subcategoria)}</td>${sCols}<td class="dv dc">${fmtN(tots)}</td><td></td></tr>`;
          }
        });
      } else {
        const cls=row.hi?'dre-hi':'dre-tot';
        h+=`<tr class="${cls}"><td>${row.lbl}</td>${mCols}<td class="dv ${valCls(va)}">${fmtN(va)}</td><td class="dv dc">${pct.toFixed(1)}%</td></tr>`;
        h+=`<tr class="dre-sep"><td colspan="${colCnt}"></td></tr>`;
      }
    });

    // Margem de Lucro
    const margTotal=bkTotal.marg;
    const margCols=mesesDisp.map(m=>{const v=bkM[m].marg;return`<td class="dv ${v>=0?'dp':'dn'}">${v.toFixed(1)}%</td>`;}).join('');
    h+=`<tr class="dre-bk"><td>📊 Margem de Lucro</td>${margCols}<td class="dv ${margTotal>=0?'dp':'dn'}">${margTotal.toFixed(1)}%</td><td></td></tr>`;

    // Breakeven
    const bepTotal=bkTotal.bep;
    const bepCols=mesesDisp.map(m=>{const v=bkM[m].bep;return`<td class="dv dc">${v!==null?fmt(v):'N/D'}</td>`;}).join('');
    h+=`<tr class="dre-bk"><td>🎯 Breakeven</td>${bepCols}<td class="dv dc">${bepTotal!==null?fmt(bepTotal):'N/D'}</td><td></td></tr>`;

    // Margem Contribuição
    const mcTot=bkTotal.mcPct;
    const mcCols=mesesDisp.map(m=>{const v=bkM[m].mcPct;return`<td class="dv dc">${v.toFixed(1)}%</td>`;}).join('');
    h+=`<tr class="dre-bk"><td>📐 Margem de Contribuição</td>${mcCols}<td class="dv dc">${mcTot.toFixed(1)}%</td><td></td></tr>`;

    return h;
  };

  $('content').innerHTML=`
    <div class="tb" style="margin-bottom:12px">
      <span style="font-size:13px;font-weight:600;color:var(--tx2)">Ano:</span>
      <select id="dre-ano" class="fc" onchange="rDRE()">${anos.map(a=>`<option value="${a}" ${a===fAno?'selected':''}>${a}</option>`).join('')}</select>
      <span style="font-size:11px;color:var(--tx3);margin-left:6px">Regime de Competência · ${mesesDisp.length} meses · DRE segue a classificação do Plano de Contas</span>
    </div>
    <div style="overflow-x:auto"><div class="tw">
      <table class="dre-t">
        <thead><tr><th style="text-align:left;min-width:210px">Item</th>${thM}<th class="dv" style="color:var(--acc)">Total ${fAno}</th><th class="dv">% Rec.</th></tr></thead>
        <tbody>${buildRows()}</tbody>
      </table>
    </div></div>`;
}
window.rDRE=rDRE;

function ccAgendaCount(cat,sub=''){
  const g=ccGroupByAny(cat); const subObj=sub?ccSubByAny(g?.id||cat,sub):null;
  return (store.agenda||[]).filter(a=>{
    const gMatch=g?((a.categoria_id&&a.categoria_id===g.id)||ccNorm(a.categoria)===ccNorm(g.nome)):false;
    if(!sub)return gMatch;
    return gMatch && (subObj?((a.subcategoria_id&&a.subcategoria_id===ccRowSubId(subObj))||ccNorm(a.subcategoria)===ccNorm(subObj.subcategoria)):ccNorm(a.subcategoria)===ccNorm(sub));
  }).length;
}
function ccSafe(v){return agEsc(v||'');}
function ccSortStore(){
  store.centrocusto=(store.centrocusto||[]).sort((a,b)=>{
    const c=(a.categoria||'').localeCompare((b.categoria||''),'pt-BR',{sensitivity:'base'});
    if(c)return c;
    const sa=(a.subcategoria||'').trim(), sb=(b.subcategoria||'').trim();
    if(!sa&&sb)return -1;
    if(sa&&!sb)return 1;
    return sa.localeCompare(sb,'pt-BR',{sensitivity:'base'});
  });
}
async function ccPersistRefs(changedLanc,changedAgenda){
  try{
    const jobs=[];
    changedLanc.forEach(r=>{if(r.id)jobs.push(fbSet('lancamentos',r.id,{...r}));});
    changedAgenda.forEach(r=>{if(r.id)jobs.push(fbSet('agenda_financeira',r.id,{...r}));});
    for(let i=0;i<jobs.length;i+=80){await Promise.all(jobs.slice(i,i+80));}
  }catch(e){console.warn('Falha ao atualizar referências do plano de contas:',e);}
}
async function ccRenameRefs(oldCat,newCat,oldSub=null,newSub=null,ids={}){
  const groupId=ids.groupId||''; const subId=ids.subId||'';
  const changedLanc=[],changedAgenda=[];
  const apply=(r,arr)=>{
    const gMatch=groupId?(r.categoria_id===groupId||ccNorm(r.categoria)===ccNorm(oldCat)):ccNorm(r.categoria)===ccNorm(oldCat);
    if(!gMatch)return;
    const sMatch=oldSub===null?true:(subId?(r.subcategoria_id===subId||ccNorm(r.subcategoria)===ccNorm(oldSub)):ccNorm(r.subcategoria)===ccNorm(oldSub));
    if(!sMatch)return;
    r.categoria=newCat; if(groupId)r.categoria_id=groupId;
    if(newSub!==null){r.subcategoria=newSub; if(subId)r.subcategoria_id=subId;}
    arr.push(r);
  };
  (store.lancamentos||[]).forEach(r=>apply(r,changedLanc));
  (store.agenda||[]).forEach(r=>apply(r,changedAgenda));
  await ccPersistRefs(changedLanc,changedAgenda);
}

window.svCCGroup=async function(oldId){
  const nome=$('cc-cat').value.trim();
  const dreId=($('cc-dre')||{}).value||dreInferClass(nome);
  if(!nome){toast('Nome do grupo obrigatório','er');return;}
  const oldGroup=oldId?ccGroupByAny(oldId):null;
  if(!oldGroup){
    if(ccGroups().some(g=>ccNorm(g.nome)===ccNorm(nome))){toast('Esse grupo já existe','er');return;}
    const gid=ccNewId('grp_');
    const nid=ccNewId('cc_');
    const row={id:nid,grupo_id:gid,categoria_id:gid,categoria:nome,subcategoria:'',status:'Ativo/Exibido',dre_id:dreId,grupo:''};
    store.centrocusto.push(row); ccSortStore(); ccSel=gid; lsSave(); cM(); rCC(); toast('Grupo criado e classificado no DRE!','ok');
    try{await fbSet('centrocusto',nid,{...row});}catch(e){console.warn('Falha ao salvar grupo no Firebase:',e);toast('Salvo localmente. Verifique conexão para sincronizar.','in');}
    return;
  }
  if(nome!==oldGroup.nome && ccGroups().some(g=>g.id!==oldGroup.id&&ccNorm(g.nome)===ccNorm(nome))){toast('Já existe outro grupo com esse nome','er');return;}
  const rows=ccRows(oldGroup.id); const oldCat=oldGroup.nome;
  rows.forEach(r=>{r.categoria=nome;r.grupo_id=oldGroup.id;r.categoria_id=oldGroup.id;r.dre_id=dreId;});
  ccSortStore(); lsSave();
  try{for(const r of rows){if(r.id)await fbSet('centrocusto',r.id,{...r});}}catch(e){console.warn(e);toast('Alteração salva localmente. Falha ao sincronizar agora.','in');}
  if(nome!==oldCat) await ccRenameRefs(oldCat,nome,null,null,{groupId:oldGroup.id});
  ccSel=oldGroup.id;toast('Grupo atualizado sem quebrar IDs!','ok');cM();rCC();
};
window.dCCGroup=async function(id){
  const g=ccGroupByAny(id); if(!g)return; const rows=ccRows(g.id), lanc=ccLancCount(g.id), ag=ccAgendaCount(g.id);
  confirm_('Excluir grupo',`Excluir o grupo "${g.nome}" e suas ${ccSubs(g.id).length} subcategoria(s) do plano de contas? Os ${lanc} lançamento(s) e ${ag} item(ns) da agenda continuam salvos, mas sem esse grupo cadastrado nas opções.`,async()=>{
    const rowIds=new Set(rows.map(x=>x.id).filter(Boolean));
    store.centrocusto=store.centrocusto.filter(x=>{
      const sameId=x.id&&rowIds.has(x.id);
      const sameGroup=ccRowGroupId(x)===g.id || x.categoria_id===g.id || ccNorm(x.categoria)===ccNorm(g.nome);
      return !(sameId||sameGroup);
    });
    ccSortStore();
    try{for(const r of rows){if(r.id)await fbDel('centrocusto',r.id);}}catch(e){console.warn('Falha ao excluir grupo no Firebase:',e);toast('Excluído localmente. Verifique conexão para sincronizar.','in');}
    ccSel=ccGroups()[0]?.id||'';lsSave();toast('Grupo removido do plano de contas','ok');rCC();
  });
};

window.svCC=async function(idx){
  const groupId=$('cc-cat').value; const g=ccGroupByAny(groupId); const subNome=$('cc-sub').value.trim(); const status=$('cc-st').value;
  if(!g||!subNome){toast('Grupo e subcategoria são obrigatórios','er');return;}
  const duplicado=(store.centrocusto||[]).some((x,i)=>i!==idx&&ccRowGroupId(x)===g.id&&ccNorm(x.subcategoria)===ccNorm(subNome));
  if(duplicado){toast('Essa subcategoria já existe nesse grupo','er');return;}
  const dreId=dreClassForGroup(g);
  if(idx!==null&&idx!==undefined){
    const item=store.centrocusto[idx];
    const oldCat=item.categoria, oldSub=item.subcategoria||'', oldGroupId=ccRowGroupId(item)||g.id, oldSubId=ccRowSubId(item)||ccHashId('sub_',g.id+'|'+ccNorm(oldSub));
    store.centrocusto[idx]={...item,grupo_id:g.id,categoria_id:g.id,categoria:g.nome,subcategoria_id:oldSubId,subcategoria:subNome,status,grupo:'',dre_id:dreId};
    ccSortStore(); lsSave();
    try{if(item.id){const savedRow=store.centrocusto.find(x=>ccRowSubId(x)===oldSubId)||store.centrocusto[idx];await fbSet('centrocusto',item.id,{...savedRow});}}catch(e){console.warn('Falha ao salvar subcategoria:',e);toast('Salvo localmente. Verifique conexão para sincronizar.','in');}
    if(oldCat!==g.nome || oldSub!==subNome || oldGroupId!==g.id) await ccRenameRefs(oldCat,g.nome,oldSub,subNome,{groupId:oldGroupId||g.id,subId:oldSubId});
  }else{
    const sid=ccNewId('sub_');
    const nid=ccNewId('cc_');
    const row={id:nid,grupo_id:g.id,categoria_id:g.id,categoria:g.nome,subcategoria_id:sid,subcategoria:subNome,status,grupo:'',dre_id:dreId};
    store.centrocusto.push(row); ccSortStore(); lsSave();
    try{await fbSet('centrocusto',nid,{...row});}catch(e){console.warn('Falha ao salvar subcategoria no Firebase:',e);toast('Salvo localmente. Verifique conexão para sincronizar.','in');}
  }
  ccSel=g.id;toast('Salvo com ID interno fixo!','ok');cM();rCC();
};
window.dCC=async function(idx){
  const r=store.centrocusto[idx];
  if(!r)return;
  const lanc=ccLancCount(r.grupo_id||r.categoria,r.subcategoria_id||r.subcategoria), ag=ccAgendaCount(r.grupo_id||r.categoria,r.subcategoria_id||r.subcategoria);
  confirm_('Excluir subcategoria',`Excluir "${r.subcategoria}" do grupo "${r.categoria}"? Os ${lanc} lançamento(s) e ${ag} item(ns) da agenda continuam salvos, mas essa opção sai do plano de contas.`,async()=>{
    const item=store.centrocusto[idx];
    const itemId=item?.id||''; const itemG=ccRowGroupId(item)||item?.categoria_id||''; const itemS=ccRowSubId(item)||item?.subcategoria_id||'';
    store.centrocusto=store.centrocusto.filter(x=>{
      if(itemId && x.id===itemId)return false;
      if(x===item)return false;
      const sameGroup=itemG && (ccRowGroupId(x)===itemG || x.categoria_id===itemG);
      const sameSub=itemS ? ccRowSubId(x)===itemS : (sameGroup && ccNorm(x.subcategoria)===ccNorm(item.subcategoria));
      return !(sameGroup&&sameSub);
    });
    ccSortStore();
    try{if(item&&item.id)await fbDel('centrocusto',item.id);}catch(e){console.warn('Falha ao excluir subcategoria no Firebase:',e);toast('Excluída localmente. Verifique conexão para sincronizar.','in');}
    lsSave();toast('Subcategoria excluída','ok');rCC();
  });
};

function calcDep(r){if(!r.valor_aquisicao||!r.vida_util_anos)return{m:0,ac:0,at:+r.valor_aquisicao||0,pct:0};const mn=(+r.valor_aquisicao)/(+r.vida_util_anos*12);const s=r.data_aquisicao?new Date(r.data_aquisicao):new Date();const e=r.data_baixa?new Date(r.data_baixa):new Date();const ms=Math.max(0,(e.getFullYear()-s.getFullYear())*12+e.getMonth()-s.getMonth());const ac=Math.min(mn*ms,+r.valor_aquisicao);return{m:mn,ac,at:+r.valor_aquisicao-ac,pct:+r.valor_aquisicao?ac/+r.valor_aquisicao*100:0};}
function rPat(){
  const sw=($('sw-pat')||{value:''}).value.toLowerCase();

  const tot=data.length,pgs=Math.ceil(tot/PS)||1;if(CP>pgs)CP=1;
  const sl=data.slice((CP-1)*PS,CP*PS);
  const rows=sl.map(r=>{const d=calcDep(r);return`<tr><td>${fmtD(r.data_aquisicao)}</td><td><strong>${r.nome_bem||'—'}</strong></td><td class="tr mono">${fmtN(r.valor_aquisicao)}</td><td style="min-width:100px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--tx2);margin-bottom:2px"><span>${fmtN(d.ac)}</span><span>${d.pct.toFixed(0)}%</span></div><div style="height:3px;background:var(--s2);border-radius:2px"><div style="height:100%;width:${Math.min(d.pct,100)}%;background:${d.pct>80?'var(--er)':d.pct>50?'var(--wa)':'var(--acc)'};border-radius:2px"></div></div></td><td class="tr mono" style="color:${d.at>0?'var(--ok)':'var(--tx2)'}">${fmtN(d.at)}</td><td><span class="bg ${r.status==='Ativo'?'bgreen':'bgray'}">${r.status||'Ativo'}</span></td><td><div class="ra"><button class="btn bs btn-s btn-i" onclick="ePat('${r.id}')">✏️</button><button class="btn bd2 btn-s btn-i" onclick="dPat('${r.id}')">🗑️</button></div></td></tr>`;}).join('');
  $('content').innerHTML=`<div class="kpis"><div class="kpi" style="--kc:var(--in)"><div class="kpi-l">Valor Aquisição</div><div class="kpi-v">${fmt(tv)}</div><div class="kpi-s">${data.length} bens</div></div><div class="kpi" style="--kc:var(--er)"><div class="kpi-l">Depreciação Acum.</div><div class="kpi-v">${fmt(tv-ta)}</div></div><div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Valor Atual</div><div class="kpi-v">${fmt(ta)}</div></div><div class="kpi" style="--kc:var(--acc)"><div class="kpi-l">Ativos</div><div class="kpi-v">${data.filter(r=>r.status==='Ativo').length}</div></div></div>
    <div class="tb"><div class="sw-wrap"><span class="si">🔍</span><input id="sw-pat" type="text" placeholder="Buscar bem…" value="${sw}" oninput="debouncR()"></div><button class="btn bp" onclick="nPat()">＋ Novo Bem</button></div>
    <div class="tw"><table><thead><tr><th>Aquisição</th><th>Nome do Bem</th><th class="tr">Valor Orig.</th><th>Depreciação</th><th class="tr">Valor Atual</th><th>Status</th><th style="width:68px"></th></tr></thead><tbody>${rows||`<tr><td colspan="7"><div class="es"><div class="em">🏢</div><h3>Nenhum bem</h3></div></td></tr>`}</tbody></table></div>${mkPag(CP,pgs,'pgPt')}`;
}
