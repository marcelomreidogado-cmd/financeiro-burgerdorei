const prodState={meses:new Set(),cats:new Set(),prods:new Set(),sort:'valor'};
function prodArr(set){return Array.from(set||[]);}
function prodSetFrom(arr){return new Set((arr||[]).filter(Boolean));}
function prodClearProdutos(){prodState.prods.clear();}
function prodClearCats(){prodState.cats.clear();prodState.prods.clear();}
function prodClearAll(){prodState.meses.clear();prodState.cats.clear();prodState.prods.clear();prodState.sort='valor';rProdutos();}
function prodToggleMes(m){ if(!m){prodState.meses.clear();} else {prodState.meses.has(m)?prodState.meses.delete(m):prodState.meses.add(m);} rProdutos();}
function prodToggleCat(c){ if(!c){prodClearCats();} else {prodState.cats.has(c)?prodState.cats.delete(c):prodState.cats.add(c); prodState.prods.clear();} rProdutos();}
function prodToggleProd(p){ if(!p){prodState.prods.clear();} else {prodState.prods.has(p)?prodState.prods.delete(p):prodState.prods.add(p);} rProdutos();}
function prodSetSort(v){prodState.sort=v||'valor';rProdutos();}
function prodFocusCat(c){
  if(!c) return;
  prodState.cats.clear();
  prodState.cats.add(c);
  prodState.prods.clear();
  rProdutos();
}
Object.assign(window,{prodClearProdutos,prodClearCats,prodClearAll,prodToggleMes,prodToggleCat,prodToggleProd,prodSetSort,prodFocusCat});
function prodNormTxt(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function prodId(periodoInicio,periodoFim,categoria,produto){return ('pv_'+periodoInicio+'_'+periodoFim+'_'+prodNormTxt(categoria).slice(0,45)+'_'+prodNormTxt(produto).slice(0,75)).replace(/-+/g,'-');}
function prodNum(v){
  if(typeof v==='number') return Number.isFinite(v)?v:0;
  let s=String(v||'').replace(/R\$/g,'').replace(/%/g,'').replace(/\s/g,'').trim();
  if(!s)return 0;
  if(s.includes(',') && s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s);return Number.isFinite(n)?n:0;
}
function prodDate(v){
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v==='number'){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return d.toISOString().slice(0,10);
  }
  const s=String(v||'').trim();
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){let y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function prodPeriodoTxt(a,b){return (a&&b)?`${fmtD(a)} a ${fmtD(b)}`:'—';}
function prodParseRows(rows){
  const periodoInicio=prodDate(rows?.[1]?.[0]);
  const periodoFim=prodDate(rows?.[1]?.[1]);
  if(!periodoInicio||!periodoFim) throw new Error('Não encontrei Data Inicial e Data Final no relatório. Use o relatório original do Saipos.');
  let categoria=''; const map={};
  for(let i=3;i<rows.length;i++){
    const r=rows[i]||[]; let nome=String(r[0]||'').trim();
    if(!nome) continue;
    const qtd=prodNum(r[1]), valor=prodNum(r[2]), perc=prodNum(r[3]);
    const item=/^-/.test(nome);
    nome=nome.replace(/^[-–—]\s*/,'').replace(/\s+/g,' ').trim();
    if(!item){ categoria=nome; continue; }
    if(!categoria || (!qtd && !valor)) continue;
    const key=prodNormTxt(categoria)+'|'+prodNormTxt(nome);
    if(!map[key]) map[key]={categoria,produto:nome,quantidade:0,valor_total:0,percentual_soma:0,linhas:0};
    map[key].quantidade+=qtd; map[key].valor_total+=valor; map[key].percentual_soma+=perc; map[key].linhas+=1;
  }
  const mes_ref=periodoInicio.slice(0,7);
  const itens=Object.values(map).map(x=>({
    id:prodId(periodoInicio,periodoFim,x.categoria,x.produto),
    origem:'Saipos',periodo_inicio:periodoInicio,periodo_fim:periodoFim,mes_ref,
    categoria:x.categoria,produto:x.produto,
    quantidade:+x.quantidade.toFixed(3),valor_total:+x.valor_total.toFixed(2),
    preco_medio:x.quantidade?+(x.valor_total/x.quantidade).toFixed(2):0,
    percentual:+(x.percentual_soma/Math.max(x.linhas,1)).toFixed(3),
    importado_em:new Date().toISOString(),linhas_agrupadas:x.linhas
  })).sort((a,b)=>b.valor_total-a.valor_total);
  return {periodoInicio,periodoFim,mes_ref,itens};
}
async function garantirXLSX(){
  if(typeof XLSX!=='undefined') return;
  await new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=resolve; s.onerror=()=>reject(new Error('Não foi possível carregar a biblioteca Excel. Verifique a internet.'));
    document.head.appendChild(s);
  });
}
async function prodLerArquivo(file){
  await garantirXLSX();
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  return prodParseRows(rows);
}
function prodIsFullMonth(a,b){
  if(!a||!b) return false;
  const da=new Date(a+'T12:00:00'), dbb=new Date(b+'T12:00:00');
  if(da.getFullYear()!==dbb.getFullYear()||da.getMonth()!==dbb.getMonth()) return false;
  const last=new Date(da.getFullYear(),da.getMonth()+1,0).getDate();
  return da.getDate()===1 && dbb.getDate()===last;
}
function prodPeriodoNome(a,b){
  if(!a||!b) return 'Período não identificado';
  if(prodIsFullMonth(a,b)) return `${mesLbl(a.slice(0,7))} · mês completo`;
  return `${fmtD(a)} a ${fmtD(b)} · período parcial`;
}
function prodPeriodos(data){
  const m=new Map();
  (data||[]).forEach(r=>{const k=(r.periodo_inicio||'')+'|'+(r.periodo_fim||''); if(k!=='|') m.set(k,{ini:r.periodo_inicio,fim:r.periodo_fim});});
  return [...m.values()].sort((a,b)=>(a.ini||'').localeCompare(b.ini||''));
}
function prodDataFiltrada(){
  const sw=($('prod-sw')||{value:''}).value.toLowerCase().trim();
  const meses=prodArr(prodState.meses), cats=prodArr(prodState.cats), prods=prodArr(prodState.prods);
  return (store.produtos||[]).filter(r=>{
    if(meses.length && !meses.includes(r.mes_ref)) return false;
    if(cats.length && !cats.includes(r.categoria)) return false;
    if(prods.length && !prods.includes(r.produto)) return false;
    if(sw && !(`${r.produto||''} ${r.categoria||''}`.toLowerCase().includes(sw))) return false;
    return true;
  });
}
function prodAgrupa(data,campo){
  const map={};
  data.forEach(r=>{
    const k=campo==='produto'?prodNormTxt(r.produto||'—'):(r.categoria||'—');
    if(!map[k]) map[k]={categoria:r.categoria||'—',produto:campo==='produto'?(r.produto||'—'):'',quantidade:0,valor_total:0,periodos:new Set(),categorias:new Set(),produtos:new Set(),periodo_inicio:'',periodo_fim:''};
    map[k].quantidade+=+r.quantidade||0; map[k].valor_total+=+r.valor_total||0;
    if(r.mes_ref) map[k].periodos.add(r.mes_ref); if(r.categoria) map[k].categorias.add(r.categoria); if(r.produto) map[k].produtos.add(r.produto);
    if(r.periodo_inicio && (!map[k].periodo_inicio || r.periodo_inicio<map[k].periodo_inicio)) map[k].periodo_inicio=r.periodo_inicio;
    if(r.periodo_fim && (!map[k].periodo_fim || r.periodo_fim>map[k].periodo_fim)) map[k].periodo_fim=r.periodo_fim;
  });
  return Object.values(map).map(x=>({...x,categoria:campo==='produto'?[...x.categorias].sort((a,b)=>a.localeCompare(b,'pt-BR')).join(', '):x.categoria,preco_medio:x.quantidade?x.valor_total/x.quantidade:0,periodos:[...x.periodos].sort(),produtos:[...x.produtos].sort((a,b)=>a.localeCompare(b,'pt-BR'))}));
}
function prodChip(txt,active,action,value='',extra=''){
  return `<button type="button" class="prod-chip ${active?'act':''} ${extra}" data-prod-action="${hEsc(action)}" data-prod-value="${hEsc(value)}">${txt}</button>`;
}
function prodCountBy(arr,key){const m={};arr.forEach(r=>{const v=r[key]||'—';m[v]=(m[v]||0)+(+r.valor_total||0);});return m;}
function prodHandleAction(action,value,ev){
  if(action==='mes') prodToggleMes(value||'');
  else if(action==='cat-toggle') prodToggleCat(value||'');
  else if(action==='cat-focus') prodFocusCat(value||'');
  else if(action==='prod-toggle') prodToggleProd(value||'');
  else if(action==='sort') prodSetSort(value||'valor');
  else if(action==='clear') prodClearAll();
}
function prodBindEvents(){
  const root=$('content'); if(!root) return;
  root.querySelectorAll('[data-prod-action]').forEach(el=>{
    const action=el.dataset.prodAction||'';
    const value=el.dataset.prodValue||'';
    el.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();prodHandleAction(action,value,ev);});
    if(action==='cat-focus'){
      el.addEventListener('dblclick',ev=>{ev.preventDefault();ev.stopPropagation();prodFocusCat(value);});
    }
  });
}
function rProdutos(){
  const todos=store.produtos||[];
  const meses=[...new Set(todos.map(r=>r.mes_ref).filter(Boolean))].sort().reverse();
  if(!prodState.meses.size && meses[0]) prodState.meses.add(meses[0]);

  const sw=($('prod-sw')||{value:''}).value||'';
  const mesesSel=prodArr(prodState.meses), catsSel=prodArr(prodState.cats), prodsSel=prodArr(prodState.prods);
  const baseMes=todos.filter(r=>!mesesSel.length || mesesSel.includes(r.mes_ref));
  const cats=[...new Set(baseMes.map(r=>r.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

  // Busca fica global no período. Categoria selecionada define o ranking de produtos.
  const baseBusca=baseMes.filter(r=>!sw || `${r.produto||''} ${r.categoria||''}`.toLowerCase().includes(sw.toLowerCase()));
  const dataCats=catsSel.length ? baseBusca.filter(r=>catsSel.includes(r.categoria)) : baseBusca;
  const dataProdutos=catsSel.length ? dataCats.filter(r=>!prodsSel.length || prodsSel.includes(r.produto)) : [];

  const totalValor=dataCats.reduce((s,r)=>s+(+r.valor_total||0),0);
  const totalQtd=dataCats.reduce((s,r)=>s+(+r.quantidade||0),0);
  const periodos=prodPeriodos(dataCats.length?dataCats:baseMes);
  const pIni=periodos[0]?.ini||'', pFim=periodos[periodos.length-1]?.fim||'';

  const rankCat=prodAgrupa(baseBusca,'categoria').sort((a,b)=>b.valor_total-a.valor_total);
  const rankProd=prodAgrupa(dataProdutos,'produto').sort((a,b)=>prodState.sort==='qtd'?b.quantidade-a.quantidade:b.valor_total-a.valor_total);
  const maxProd=Math.max(...rankProd.map(x=>x.valor_total),1);

  const mesChips=prodChip('📅 Todos os meses',!mesesSel.length,'mes','', 'all') + meses.map(m=>prodChip(`🗓️ ${mesLbl(m)}`,mesesSel.includes(m),'mes',m)).join('');
  const catChips=prodChip('🍔 Todas categorias',!catsSel.length,'cat-toggle','', 'all') + cats.map(c=>prodChip(`🏷️ ${hEsc(c)}`,catsSel.includes(c),'cat-toggle',c)).join('');
  const sortChips=prodChip('💰 Valor',prodState.sort==='valor','sort','valor')+prodChip('🔢 Quantidade',prodState.sort==='qtd','sort','qtd');
  const selectedCatsHtml=catsSel.length
    ? catsSel.map(c=>`<span class="prod-tag">🏷️ <strong>${hEsc(c)}</strong></span>`).join('')
    : '<span class="prod-tag"><strong>Selecione uma categoria</strong> no cabeçalho ou no ranking para ver os produtos.</span>';
  const periodosHtml=periodos.length?periodos.slice(0,6).map(p=>`<span class="prod-tag">📌 <strong>${prodPeriodoNome(p.ini,p.fim)}</strong></span>`).join(''):'<span class="prod-tag">📌 Nenhum período carregado</span>';

  const rowsCat=rankCat.slice(0,80).map((r,i)=>`<tr class="${catsSel.includes(r.categoria)?'cat-sel':''}" data-prod-action="cat-focus" data-prod-value="${hEsc(r.categoria)}" title="Clique ou dê duplo clique para ver os produtos desta categoria"><td>${i+1}</td><td><strong>${hEsc(r.categoria)}</strong><div class="prod-help">clique para atualizar o ranking de produtos</div></td><td class="tr">${fmtN(r.quantidade)}</td><td class="tr">${fmt(r.valor_total)}</td><td class="tr">${totalValor?fmtN((r.valor_total/Math.max(totalValor,1))*100):'0,00'}%</td></tr>`).join('');

  const rowsProd=rankProd.slice(0,220).map((r,i)=>`<tr class="${prodsSel.includes(r.produto)?'sel':''}" data-prod-action="prod-toggle" data-prod-value="${hEsc(r.produto)}" title="Clique para selecionar/destacar este produto"><td>${i+1}</td><td><strong>${hEsc(r.produto)}</strong><div style="font-size:10px;color:var(--tx3);margin-top:2px">${hEsc(r.categoria)}</div><div class="prod-bar"><span style="width:${Math.max(3,(r.valor_total/maxProd)*100)}%"></span></div></td><td class="tr">${fmtN(r.quantidade)}</td><td class="tr">${fmt(r.valor_total)}</td><td class="tr">${fmt(r.preco_medio)}</td></tr>`).join('');

  const avisoProdutos=!catsSel.length
    ? '<div class="prod-help" style="margin-bottom:8px">Nenhum produto listado até selecionar uma categoria. Clique em uma categoria no cabeçalho ou no Ranking por categoria.</div>'
    : `<div class="prod-help" style="margin-bottom:8px">Ranking dos produtos da categoria selecionada: <strong>${catsSel.map(hEsc).join(', ')}</strong></div>`;

  $('content').innerHTML=`
    <div class="prod-toolbar">
      <div class="prod-topline">
        <div class="prod-upload"><input id="prod-file" class="prod-file" type="file" accept=".xlsx,.xls"><button class="btn bp" onclick="importarProdutosVendidos()">📥 Importar Saipos</button><button class="btn bs" onclick="exportarProdutosCSV()">⬇️ CSV</button></div>
        <div class="prod-periods">${periodosHtml}</div>
      </div>
      <div class="prod-filters">
        <div class="prod-filter-row"><span class="prod-filter-title">Períodos</span>${mesChips}</div>
        <div class="prod-filter-row"><span class="prod-filter-title">Categorias</span>${catChips}</div>
        <div class="prod-searchline"><div class="sw-wrap"><span class="si">🔍</span><input id="prod-sw" type="text" placeholder="Pesquisa rápida de produto ou categoria…" value="${hEsc(sw)}" oninput="debouncR()"></div><div class="prod-filter-row"><span class="prod-filter-title">Ranking</span>${sortChips}</div><button class="btn bd2" data-prod-action="clear" data-prod-value="">Limpar filtros</button></div>
        <div class="prod-selected">${selectedCatsHtml}</div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi" style="--kc:var(--ok)"><div class="kpi-l">Vendas de produtos</div><div class="kpi-v">${fmt(totalValor)}</div><div class="kpi-s">${prodPeriodoTxt(pIni,pFim)}</div></div>
      <div class="kpi" style="--kc:var(--acc)"><div class="kpi-l">Quantidade vendida</div><div class="kpi-v">${fmtN(totalQtd)}</div><div class="kpi-s">${catsSel.length?'categoria selecionada':'todas categorias do período'}</div></div>
      <div class="kpi" style="--kc:var(--wa)"><div class="kpi-l">Preço médio</div><div class="kpi-v">${fmt(totalQtd?totalValor/totalQtd:0)}</div><div class="kpi-s">valor ÷ quantidade</div></div>
      <div class="kpi" style="--kc:#8b5cf6"><div class="kpi-l">Histórico salvo</div><div class="kpi-v">${meses.length}</div><div class="kpi-s">meses importados</div></div>
    </div>
    <div class="prod-grid">
      <div class="prod-card"><h3>Ranking por categoria</h3><div class="prod-help">Clique ou dê duplo clique em uma categoria para atualizar o ranking de produtos.</div><div class="tw"><table><thead><tr><th>#</th><th>Categoria</th><th class="tr">Qtd.</th><th class="tr">Valor</th><th class="tr">%</th></tr></thead><tbody>${rowsCat||'<tr><td colspan="5"><div class="es"><h3>Sem categorias</h3></div></td></tr>'}</tbody></table></div></div>
      <div class="prod-card"><h3>Ranking de produtos</h3>${avisoProdutos}<div class="tw"><table><thead><tr><th>#</th><th>Produto</th><th class="tr">Qtd.</th><th class="tr">Valor</th><th class="tr">Preço médio</th></tr></thead><tbody>${rowsProd||'<tr><td colspan="5"><div class="es"><div class="em">🍔</div><h3>Selecione uma categoria</h3><p>O ranking de produtos aparece aqui depois de selecionar uma categoria.</p></div></td></tr>'}</tbody></table></div></div>
    </div>`;
  prodBindEvents();
}
window.importarProdutosVendidos=async function(){
  const f=$('prod-file')?.files?.[0];
  if(!f){toast('Selecione o Excel de Itens Vendidos do Saipos.','in');return;}
  try{
    toast('Lendo relatório do Saipos…','in');
    const parsed=await prodLerArquivo(f);
    if(!parsed.itens.length){toast('Nenhum produto encontrado no arquivo.','er');return;}
    const byId=new Map((store.produtos||[]).map(x=>[x.id,x]));
    parsed.itens.forEach(item=>byId.set(item.id,{...(byId.get(item.id)||{}),...item}));
    store.produtos=[...byId.values()]; lsSave(); rProdutos();
    if(fbOk){
      setStatus('● salvando produtos…','var(--wa)');
      for(const item of parsed.itens){ await fbSet('produtos_vendidos', item.id, {...item}); }
      setStatus('● '+store.lancamentos.length+' lanç. | online','var(--ok)');
    }
    toast(`Importação concluída: ${parsed.itens.length} produtos agrupados · ${prodPeriodoTxt(parsed.periodoInicio,parsed.periodoFim)}`,'ok');
    rProdutos();
  }catch(e){console.error(e);toast('Erro ao importar: '+e.message,'er');}
};
window.exportarProdutosCSV=function(){
  const data=prodDataFiltrada();
  const head=['periodo_inicio','periodo_fim','mes_ref','categoria','produto','quantidade','valor_total','preco_medio'];
  const csv=[head.join(';')].concat(data.map(r=>head.map(k=>String(r[k]??'').replace(/;/g,',')).join(';'))).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='produtos_vendidos_saipos.csv';a.click();URL.revokeObjectURL(a.href);
};

window.render=function(m){
  CM=m;window.debouncR=()=>{clearTimeout(DT);DT=setTimeout(()=>render(m),230);};
  buildMonthNav();
  ({visaogeral:rVG,dashboard:rDash,lancamentos:rLanc,produtos:rProdutos,dre:rDRE,bi:rBI,centrocusto:rCC,patrimonio:rPat,config:rCfg}[m]||rVG)();
};

// ── INIT ────────────────────────────────────────────────
(async function(){
  initFirebase();
  let mostrouCache=false;
  if(lsLoad()){
    setStatus('● carregando Firebase… cache local na tela','var(--wa)');
    render('visaogeral');
    mostrouCache=true;
  } else if(typeof SEED!=='undefined'){
    store.lancamentos = SEED.l.map(normL);
    store.centrocusto = SEED.cc.filter(c=>c.subcategoria&&c.subcategoria.trim()!=='');
    setStatus('● carregando Firebase… base local na tela','var(--wa)');
    render('visaogeral');
    mostrouCache=true;
  }

  if(fbOk){
    const ok = await loadAll();
    if(ok){ render(CM||'visaogeral'); return; }
    if(!mostrouCache){
      setStatus('● offline — usando local','var(--wa)');
      render('visaogeral');
    }
    return;
  }

  setStatus('● local (sem Firebase)','var(--wa)');
  if(!mostrouCache) render('visaogeral');
})();
</script>
